name: GitHub Settings as Code
description: "Apply declarative repository settings from settings.yml: repo fields, topics, labels, rulesets, branch protection, and more."
author: Vivswan
branding:
  icon: settings
  color: blue

inputs:
  # BEGIN GENERATED: action-inputs (bun run build:action-docs; edit src/flows/inputs.ts)
  token:
    description: >-
      The token for the API calls: a fine-grained PAT, since the default
      GITHUB_TOKEN can never hold the Administration grant most sections need.
    required: false
    default: "${{ github.token }}"
  repository:
    description: >-
      The owner/name repository to run against, the current repository by
      default.
    required: false
    default: ""
  settings-file:
    description: >-
      The settings document to run, or in mode: render the ordered list of
      layers to fold, lowest first.
    required: false
    default: ".github/settings.yml"
  mode:
    description: >-
      apply (write the file's settings), check (report drift, exit 1 on any),
      render (fold settings-file layers into rendered-file), or snapshot
      (write the live settings back as a settings file).
    required: false
    default: "apply"
  rendered-file:
    description: >-
      mode: render only, and required there: the path the rendered settings
      document is written to.
    required: false
    default: ""
  snapshot-file:
    description: >-
      mode: snapshot only, for one repository: the path its live settings are
      written to as a settings document.
    required: false
    default: ""
  snapshot-dir:
    description: >-
      mode: snapshot only, for a fleet: the directory receiving one
      owner/name.yml per repos or repos-dir target.
    required: false
    default: ""
  on-missing-permission:
    description: >-
      fail (default) or warn: whether a section the token cannot access fails
      the run or is skipped with a warning.
    required: false
    default: "fail"
  required-sections:
    description: >-
      Comma-separated sections that must fully apply even under
      on-missing-permission: warn.
    required: false
    default: ""
  sections:
    description: >-
      Comma-separated allowlist of the sections to process, every declared
      section when unset.
    required: false
    default: ""
  api-version:
    description: >-
      The X-GitHub-Api-Version header value, to opt into a newer REST API
      version before this action defaults to it.
    required: false
    default: "2022-11-28"
  repos:
    description: >-
      Comma- or newline-separated owner/name targets, each applied from its
      own .github/settings.yml, or "*" alone to discover every repository the
      token's user owns.
    required: false
    default: ""
  repos-dir:
    description: >-
      A directory in the checked-out admin repository holding one settings
      file per target, as name.yml or owner/name.yml.
    required: false
    default: ""
  defaults-file:
    description: >-
      A settings document applied whole to every multi-repo target that has no
      settings file of its own.
    required: false
    default: ""
  layering:
    description: >-
      mode: render only: replace, shallow, or deep (default), how every list
      section's entries combine with the layers below them.
    required: false
    default: ""
  undeclared:
    description: >-
      keep or delete: the fallback for what apply does to a live resource a
      list does not declare, unset by default so each list's own default
      applies.
    required: false
    default: ""
  private-repos:
    description: >-
      redact (default) or show: whether private and internal targets are
      hidden from the run's public logs, summary, and outputs.
    required: false
    default: "redact"
  private-report:
    description: >-
      none (default), issue, issue-on-failure, or artifact: the private
      channel that delivers the full report of each target the visibility
      probe proves private or internal.
    required: false
    default: "none"
  report-public-key:
    description: >-
      The age recipient (a public key starting with age1) the artifact channel
      encrypts every report to, required by private-report: artifact and
      rejected otherwise.
    required: false
    default: ""
  visibility:
    description: >-
      Keeps only repositories of this visibility in repos: "*" discovery: all
      (default), public, private, or internal.
    required: false
    default: ""
  archived:
    description: >-
      Archived-repository policy for repos: "*" discovery: skip (default),
      include, or only.
    required: false
    default: ""
  forks:
    description: >-
      Fork policy for repos: "*" discovery: include (default), exclude, or
      only.
    required: false
    default: ""
  exclude:
    description: >-
      Comma- or newline-separated wildcard patterns removing repositories from
      repos: "*" discovery.
    required: false
    default: ""
  topics:
    description: >-
      Comma- or newline-separated topics, of which repos: "*" discovery keeps
      the repositories carrying at least one.
    required: false
    default: ""
  affiliation:
    description: >-
      Comma-separated affiliations for repos: "*" discovery: owner (default),
      collaborator, or organization_member.
    required: false
    default: ""
# END GENERATED: action-inputs

outputs:
  # BEGIN GENERATED: action-outputs (bun run build:action-docs; edit src/action/io.ts)
  result:
    description: >-
      The worst result across the run's targets: failed | drift | partial |
      skipped | applied | clean | snapshot | rendered.
  skipped-sections:
    description: >-
      Comma-separated sections skipped for missing permissions under
      on-missing-permission: warn, empty when none.
  repos-result:
    description: >-
      JSON map of owner/name to {result, source, skipped-sections} for every
      target of a multi-repo run, the empty map {} otherwise.
# END GENERATED: action-outputs

runs:
  using: node24
  main: lib/index.js

# Repo-owned actionlint configuration. Generated once by
# the fleet sync and never overwritten by a later
# sync, so add this repository's own ignores freely.

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub grants Dependabot-alert reads to GITHUB_TOKEN under the
      # vulnerability-alerts permission key (the release-health gate needs
      # it); actionlint's permission-scope list has not caught up yet
      # (rhysd/actionlint#666). Drop this once it knows the scope.
      - 'unknown permission scope "vulnerability-alerts"'
      # lib/index.js (action.yml's runs.main) is not committed on main:
      # the workflows that execute the action via `uses: ./` build it in a
      # prior step, and the runnable refs are the release build tags, so
      # the static existence check is a false positive here.
      - 'file "lib/index\.js" does not exist'
      # The npm publish jobs in post-green.yml and update-release.yml share a
      # lane with `queue: max`, which keeps every queued publish instead of
      # the one pending job a lane holds by default; actionlint 1.7.12, the
      # newest release, does not know the key. Drop this once an actionlint
      # release lists `queue` under concurrency and the fleet step runs it.
      - 'unexpected key "queue" for "concurrency" section'

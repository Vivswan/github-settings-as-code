# Repo-owned auto-bundle: lib/index.js and lib/settings.schema.json are
# committed build artifacts, and CI fails when they drift from src/ or the
# dependency tree (Dependabot bumps a package but cannot run the build).
# This workflow rebuilds them on every same-repo PR that touches a bundle
# input and pushes the regenerated artifacts back to the PR branch; an
# already-fresh bundle gets no commit.
#
# Unlike dependabot-bun-lockfile.yml, rebuilding necessarily executes
# PR-controlled code, so the build runs in its own unprivileged job and
# hands lib/ to the push job as an artifact: no code from the PR runs on
# the runner that holds the write token. --ignore-scripts keeps husky (the
# prepare script) and dependency lifecycle scripts out of the build job,
# and the push job never installs anything, so no git hooks exist on
# either runner.
#
# Dependabot-triggered runs read the Dependabot secrets store, not the
# Actions one. Register REPO_PLATFORM_TOKEN in both stores: a push made
# with github.token starts no workflows, so without the token the fix
# commit does not re-run CI (the job then posts a PR comment and a
# warning annotation; close/reopen the PR to re-run), and on Dependabot
# bun PRs the token is a hard prerequisite - the stale lockfile fails
# the frozen install here until dependabot-bun-lockfile.yml's dedupe
# push retriggers this workflow, which only a real token does.

name: Auto Bundle

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".bun-version"
      - ".github/scripts/finalize-schema.ts"

permissions:
  contents: read

# Only the newest run per PR proceeds; a superseded run's push would race
# the new head (its push job skips on the head-moved guard anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Same-repo PRs only: the push job's token cannot push to a fork's
    # branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebuild.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # On a Dependabot PR whose lockfile still has the stale nested
      # entries dependabot-bun-lockfile.yml exists to fix, the frozen
      # install fails here; that workflow's dedupe push retriggers this
      # one on the fixed head.
      - name: Rebuild the committed bundle
        id: rebuild
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          if [ -z "$(git status --porcelain -- lib/)" ]; then
            echo "bundle already fresh"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain -- lib/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.rebuild.outputs.changed == 'true'
        with:
          name: regenerated-lib
          path: lib/
          if-no-files-found: error

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write # the no-retrigger-token PR comment below
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # The artifact is the whole bundle: emptying lib/ first lets a
      # build that removed a file stage that deletion too.
      - run: rm -rf lib
      - uses: actions/download-artifact@v8
        with:
          name: regenerated-lib
          path: lib/
      - name: Commit and push the regenerated bundle
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The branch can move between the build and this push (a
          # Dependabot rebase, or dependabot-bun-lockfile.yml's dedupe
          # commit, which also invalidates the bundle we built): the
          # bundle belongs to HEAD_SHA only, and the newer head's own run
          # owns the rebuild.
          superseded() {
            git fetch --quiet origin "$HEAD_REF"
            [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]
          }
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::head moved since the build; skipping the stale bundle push"
            exit 0
          fi
          if [ -z "$(git status --porcelain -- lib/)" ]; then
            echo "downloaded bundle matches the head commit; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- lib/
          # The body's [dependabot skip] keeps Dependabot rebasing and
          # updating the PR over this commit; without it Dependabot stops
          # touching a PR once someone else pushes to it.
          git commit --no-verify -m "build: regenerate committed bundle" -m "[dependabot skip]"
          # The lease pins the remote to the exact commit the bundle was
          # built from, so a concurrent push (even a force-reset to an
          # ancestor) rejects this one instead of racing it.
          if ! git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${HEAD_REF}"; then
            if superseded; then
              echo "::notice::head moved during the push; skipping the stale bundle push"
              exit 0
            fi
            exit 1
          fi
          if [ "$CAN_RETRIGGER" = "true" ]; then
            exit 0
          fi
          # The fix landed via github.token, which starts no workflows:
          # this PR's checks will not re-run on the new head. Surface that
          # on the PR (once) and as a run annotation. The push itself
          # succeeded, so the run stays green.
          marker="<!-- auto-bundle: no-retrigger-token -->"
          comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' || true)
          case "$comments" in
            *"$marker"*) ;;
            *) gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$marker
          Pushed a bundle regeneration commit with the default workflow token, which starts no workflows, so checks will not re-run on the new head. Close and reopen this PR to re-run them, or register \`REPO_PLATFORM_TOKEN\` (as an Actions secret, and as a Dependabot secret for Dependabot PRs) so future fixes re-trigger CI automatically." || true ;;
          esac
          echo "::warning::bundle fix pushed without REPO_PLATFORM_TOKEN - checks will not re-run on the new head; close/reopen the PR or register the token"

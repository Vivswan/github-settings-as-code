# Repo-owned auto-format: label a pull request `fix-lint` (the label ships
# with the template's settings.yml) and this workflow pushes a formatting
# commit to the PR branch, then removes the label. Generated once by
# the fleet sync and never overwritten by a later
# sync: adjust the format commands to this repository's tooling.
#
# Formatting runs PR-controlled code (the locked biome, the lint:fix script), so it happens in a job without a write
# token and crosses to the push job as a git patch; applying a patch executes nothing, as in auto-fix.yml.

name: Auto Format

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# One run per PR at a time: the label removed and re-applied while a run is pushing would start a second run against
# the same branch, and two formatting pushes race. The later run queues and formats the pushed head instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    # Same-repo PRs only: GITHUB_TOKEN cannot push to a fork's branch.
    if: github.event.label.name == 'fix-lint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.format.outputs.changed }}
      head: ${{ steps.format.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # The install puts the locked biome in node_modules, so the format runs the gate's biome, not the newest one.
      - uses: ./.github/actions/setup
      - name: Format (biome) and stage the patch
        id: format
        run: |
          # The patch belongs to this commit alone; the push job refuses any other head.
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bun run lint:fix
          # Anything the formatter left staged is not this workflow's fix: start from an empty index, then stage
          # modifications and deletions of tracked files alone (a formatter adds nothing).
          git reset -q
          git add -u
          git diff --cached --binary > "$RUNNER_TEMP/format.patch"
          if [ -s "$RUNNER_TEMP/format.patch" ]; then
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to format"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.format.outputs.changed == 'true'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: error

  # Runs whenever the format job ran, so the label comes off even after a failed format: the label is a one-shot
  # request, and a broken run must not loop.
  push:
    needs: format
    if: always() && needs.format.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.format.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # The patch lands OUTSIDE the checkout so nothing in the work tree can shadow or stage it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.format.outputs.changed == 'true'
        with:
          name: format-patch
          path: ${{ runner.temp }}/format
      - name: Commit and push the formatting
        if: needs.format.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ needs.format.outputs.head }}
        run: |
          # The branch can move between the two jobs; the patch was cut on HEAD_SHA and formats that tree alone, so a
          # newer head gets its own run (re-apply the label) instead of a commit formatting the old one.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::head moved since the format; skipping the stale formatting push"
            exit 0
          fi
          git apply --index --binary "$RUNNER_TEMP/format/format.patch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "style: apply automated formatting"
          # The lease pins the remote to the commit the patch was cut on, so a push that lands in between rejects this one.
          git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${HEAD_REF}"
      - name: Remove the fix-lint label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label fix-lint

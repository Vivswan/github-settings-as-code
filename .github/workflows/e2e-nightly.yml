name: E2E Nightly

on:
  schedule:
    # 5:28 am EST, randomly chosen.
    - cron: "28 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The trimmed OpenAPI spec is a fetched, gitignored artifact. The nightly
      # ALWAYS fetches it (no cache) on purpose: the fetch is the drift tripwire.
      # trim-openapi.ts HARD-ERRORS when a USED_PATH is absent upstream (the
      # action calls a path GitHub no longer documents at the pinned version) -
      # the drift worth catching now that there is no committed artifact to diff.
      # e2e-smoke caches this for per-PR speed; the nightly re-fetches so the
      # tripwire runs every night regardless of a cache.
      - name: Fetch the trimmed OpenAPI spec (drift tripwire)
        run: bun .github/scripts/trim-openapi.ts

      - name: Curated corpus
        run: bun test/e2e/run.ts

      # Tripwire: every "section.role" route in allEndpoints() must be hit at
      # least once by the curated corpus. The checker runs the corpus and reads
      # each run's request log, then fails naming any route no scenario reached.
      - name: Endpoint-coverage tripwire
        run: bun .github/scripts/check-endpoint-coverage.ts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ github.run_attempt }}
          path: test/e2e/.artifacts/
          if-no-files-found: ignore

      # The same fleet action nightly-fuzz.yml files through: one open issue per
      # label, the head of each artifact's report.md (title + replay block), the
      # rest in the uploaded artifact it points at.
      - name: File or update the e2e issue
        id: file-issue
        if: failure()
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: e2e-fuzz
          title: e2e nightly failures
          label-description: Automated e2e nightly failure
          stream: generic
          artifacts-dir: test/e2e/.artifacts
          artifact-name: e2e-artifacts-${{ github.run_attempt }}

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: failure() && steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the e2e issue on a green night
        if: success()
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: e2e-fuzz
          stream: generic

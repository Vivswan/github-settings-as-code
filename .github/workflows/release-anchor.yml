# The anchor half of the single-tag scheme's bookkeeping (repo-owned; the
# freshness tripwire is the boundary-check job in checks.yml). Version tags
# live on packaged children that are NOT on main, and release-please's
# commit walk only sees main, so the boundary between release cycles is
# recorded config (last-release-sha in release-please-config.json), not a
# tag lookup. This workflow anchors the NEXT boundary INSIDE the release PR
# branch after every refresh: last-release-sha becomes main's current head,
# the future merge commit's parent, so merging the release PR advances the
# boundary on main as part of the release itself. No push to main, no admin
# credential; the release-freshness gate in the managed ci.yml keeps the
# recorded parent effectively exact (a release PR must contain main's tip
# to merge, and every refresh re-triggers this anchor).
#
# workflow_run, not a job in the release pipeline: release-please refreshes
# the release PR branch inside the managed release.yml, which offers no
# repo hook on ordinary pushes, and the refresh is pushed with the default
# GITHUB_TOKEN, which triggers no push events on the branch. CI completing
# on main is the one event that reliably follows every refresh.

name: Release anchor

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  anchor:
    # Every completed main run, deliberately including failed ones: the
    # release job runs release-please before the packaging hook and the
    # publish stage, so a run can refresh the release PR and then fail - a
    # conclusion filter would leave that refresh unanchored. The script
    # no-ops all the cases a filter would approximate: it anchors only when
    # main still points at the head this run tested AND the release PR
    # branch was built on it.
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The anchor records the head the CI run tested, not this workflow's
      # own GITHUB_SHA; the script skips if main has already moved on (the
      # newer push's run re-anchors) and re-applies on every refresh
      # (release-please force-pushes wipe the previous anchor commit). The
      # branch is unprotected, so the default token pushes it; without
      # REPO_PLATFORM_TOKEN the release PR's checks need the usual
      # close/reopen to run either way.
      - name: Anchor the boundary inside the release PR branch
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: GITHUB_SHA="$TESTED_SHA" bun .github/scripts/release-pipeline.ts anchor

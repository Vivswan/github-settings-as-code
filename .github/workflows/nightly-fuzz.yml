# Nightly fuzzing for the e2e property fuzzer (test/e2e/fuzz.ts): each
# iteration generates a random scenario, predicts its outcome class with the
# oracle, and runs the freshly built bundle against the mock. Failing iterations
# dump artifact directories with contract-shaped report.md files (title +
# replay block), which the fuzz-issue steps below turn into one deduplicated
# tracking issue. Repo-owned: generated once by Vivswan/repo-platform and
# never overwritten by template sync.
name: Nightly Fuzz

on:
  schedule:
    # Off-peak, off the top of the hour, and distinct from the fleet's other
    # nightlies (chromium-bridge 47 4, litellm-vscode-chat 59 7, this repo's
    # e2e-nightly 28 10).
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz master seed (blank for a random one)
        required: false
        default: ""
      iterations:
        description: Fuzz iterations
        required: false
        default: "300"

# Scheduled nights share one group so they serialize; each manual dispatch
# gets its own group (keyed by run id) so several seeds can run at once -
# concurrent with each other AND with a scheduled night - without GitHub
# cancelling the queued ones (one pending run per group). The fuzz-issue
# steps are check-then-act, so a mixed pass/fail batch can close the
# tracking issue under a green message; the failure comment survives.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('nightly-fuzz-{0}', github.run_id) || 'nightly-fuzz' }}
  cancel-in-progress: false

# issues: write lets the fuzz-issue action file/close the tracking issue;
# actions: write lets the failure path dispatch auto-assign at it.
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # If the job hits this timeout it is CANCELLED, not failed, and the
    # `if: failure()` reporting steps below never run - a silent night for
    # exactly the hang a fuzzer exists to find. Bound the fuzz run itself
    # (wall-clock flag, `timeout` wrapper) below this value so a hang
    # surfaces as a failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The trimmed OpenAPI spec is a fetched, gitignored artifact the mock
      # validates responses against. Always fetched fresh (no cache), same as
      # e2e-nightly: the fetch doubles as an upstream-drift tripwire.
      - name: Fetch the trimmed OpenAPI spec
        run: bun .github/scripts/trim-openapi.ts

      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
          ITERATIONS: ${{ inputs.iterations || '300' }}
        run: |
          if [ -z "$SEED" ]; then
            SEED="$RANDOM$RANDOM"
          fi
          echo "fuzzing with seed $SEED, $ITERATIONS iterations"
          timeout 50m bun test/e2e/fuzz.ts --seed "$SEED" --iterations "$ITERATIONS"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-${{ github.run_attempt }}
          path: test/e2e/.artifacts/
          if-no-files-found: ignore

      - name: File or update the fuzz issue
        id: file-issue
        if: failure()
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: report
          label: "fuzz-nightly"
          artifacts-dir: test/e2e/.artifacts
          artifact-name: fuzz-failures-${{ github.run_attempt }}

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: failure() && steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the fuzz issue on a green night
        if: success()
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: resolve
          label: "fuzz-nightly"

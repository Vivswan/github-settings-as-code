# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and
# never overwritten by template sync.
#
# THE SINGLE-TAG SCHEME. main is source-only (lib/index.js is never
# committed there), yet every ref a consumer can name - the vX.Y.Z release
# tags and the moving major vX - must point at a packaged commit carrying
# the built bundle. So this pipeline, not release-please, owns the tags:
# release-please runs with skip-github-release (release-please-config.json)
# and only does version math, the changelog, the manifest and version
# pins, and the release PR. When that PR's squash merge lands on main -
# detected from the .release-please-manifest.json version step,
# cross-checked against the merge subject AND the merged PR's
# release-please branch; anything ambiguous fails loudly and tags nothing
# (detection reads the pushed head commit only, which is exactly where
# release merges land as their own squash commit) - two independent chains
# run off the detection:
#
# release-publish.yml (the release chain):
#   1. rebuilds the bundle from the merge commit and verifies the
#      committed schema byte-for-byte (a divergent regeneration stops the
#      release),
#   2. commits lib/index.js as a CHILD of the merge commit and creates
#      vX.Y.Z once, directly on that child: the tag is born runnable and
#      never moves (the release-tags ruleset freezes it; only deliberate
#      repository-admin action can override, which SECURITY.md states),
#   3. attests the bundle, creates the GitHub release as a DRAFT with the
#      version's CHANGELOG.md section as notes, uploads bundle, schema,
#      and sigstore bundle (draft-first because published releases freeze
#      their assets), force-moves the major tag to the same packaged
#      commit, and confirms origin's refs carry the bundle,
#   4. publishes the release last.
#
# release-bookkeeping.yml (the release-please chain):
#   5. proves the recorded release-please boundary is fresh
#      (last-release-sha in release-please-config.json must be the newest
#      release merge on main or its parent), parking release-please loudly
#      on a stale one instead of letting it build garbage release PRs -
#      version tags live on packaged children that are NOT on main, and
#      release-please's commit walk only sees main, so the boundary is
#      recorded config, not a tag lookup,
#   6. runs release-please (version math, changelog, manifest, release PR;
#      never tags or releases), then anchors the NEXT boundary INSIDE the
#      release PR branch: last-release-sha becomes main's current head,
#      the future merge commit's parent, so merging the release PR
#      advances the boundary on main as part of the release itself. No
#      push to main, no admin credential; the release-freshness gate keeps
#      the recorded parent exact.
#
# A rerun of a failed run converges instead of failing: package verifies
# an existing vX.Y.Z (parent, whole tree, bundle bytes) rather than
# recreating it, re-attests the same bytes (the attestation log is
# append-only), re-uploads assets with --clobber while the release is a
# draft, and the boundary anchor re-applies on every release PR refresh.
# Finish a dead run by re-running its FAILED jobs; a fresh dispatch only
# detects the release while main's head is still the merge commit. The
# same steps by hand:
#   git checkout <merge sha>
#   bun install --frozen-lockfile --ignore-scripts && bun run build
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts package
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts retag-major
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts verify
#   bun .github/scripts/release-pipeline.ts notes X.Y.Z > /tmp/notes.md
#   gh release create vX.Y.Z --draft --verify-tag --title vX.Y.Z --notes-file /tmp/notes.md
#   gh release upload vX.Y.Z lib/settings.schema.json lib/index.js --clobber
#   gh release edit vX.Y.Z --draft=false
#   gh pr edit <release PR> --remove-label "autorelease: pending" --add-label "autorelease: tagged"
# The provenance attestation cannot be produced by hand: the sigstore
# bundle needs the workflow's OIDC identity, so a hand-finished release
# ships without the lib-index-js.sigstore.json asset.
#
# The tag topology itself is unit-tested against fixture repositories
# (test/scripts/release-pipeline.test.ts), so a change that could tag an
# unpackaged commit or move a frozen tag fails on every push, not on
# release day.

name: Release

on:
  workflow_call:

jobs:
  # Is this push the merge of a release-please PR? An empty tag output is
  # an ordinary push: the release chain skips and release-please runs
  # alone. A manifest edit outside a release-please merge fails this job,
  # which parks the whole pipeline - deliberate.
  detect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the provenance check reads the merged PR
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The detection diffs the manifest against the parent commit.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Detect a release-please merge on this push
        id: detect
        # The script prints only the output lines on stdout (diagnostics go
        # to stderr), so the redirect is the whole contract.
        run: bun .github/scripts/release-pipeline.ts detect >> "$GITHUB_OUTPUT"
      # The manifest diff and merge subject prove the shape, not the origin:
      # an ordinary PR could imitate both. Only a PR from release-please's
      # own branch may mint a tag.
      - name: Confirm the merge came from a release-please PR
        if: steps.detect.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // empty')"
          if [ "$head_ref" != "release-please--branches--main" ]; then
            echo "::error::the manifest stepped, but this push's pull request head is '${head_ref:-none}', not release-please--branches--main; refusing to tag a version no release-please PR cut."
            exit 1
          fi

  # The release chain: package, tag, attest, release, publish.
  release-publish:
    needs: [detect-release]
    if: needs.detect-release.outputs.tag != ''
    uses: ./.github/workflows/release-publish.yml
    secrets: inherit
    with:
      tag: ${{ needs.detect-release.outputs.tag }}
      version: ${{ needs.detect-release.outputs.version }}

  # The release-please chain: boundary freshness gate, release PR
  # build/refresh, and the boundary anchored into the release PR branch.
  # Runs on EVERY push; only a failed detection stops it (an ambiguous
  # manifest state parks the whole pipeline).
  release-bookkeeping:
    needs: [detect-release]
    if: ${{ !cancelled() && needs.detect-release.result == 'success' }}
    uses: ./.github/workflows/release-bookkeeping.yml
    secrets: inherit

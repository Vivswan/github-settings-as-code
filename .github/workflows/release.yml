# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and
# never overwritten by template sync.
#
# GitHub releases are immutable once published: the tag and assets freeze,
# and a post-publication `gh release upload` gets HTTP 422. Every release
# therefore moves through the same three steps, always draft-first:
#   1. release-please cuts the release as a DRAFT with its tag already
#      forced (`draft` + `force-tag-creation` in release-please-config.json).
#   2. update-release mutates the draft: this repository's packaging,
#      asset uploads, and note edits go there.
#   3. publish-release flips the draft live. It stays the last job: list
#      every job that mutates the release in its `needs`.
# If the pipeline dies after the draft exists, a rerun cannot recreate it
# (release-please sees the forced tag); finish by hand:
#   gh release upload <tag> <assets> --clobber
#   gh release edit <tag> --draft=false
# Everything runs in the same workflow run, so it works with the default
# GITHUB_TOKEN too, which cannot trigger `on: release` workflows.
#
# This repository additionally moves the released line's moving major tag
# (v1 for a v1.x release, v2 for v2.x, derived from the released tag) so
# major-pinned consumers pick up every release in their line; see
# retag-major below.

name: Release

on:
  workflow_call:

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  # Step 2: mutate the draft here. Replace the placeholder command with this
  # repository's release preparation; add sibling jobs freely, as long as
  # every job that touches the release lands in publish-release's needs.
  update-release:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # also what makes the draft visible to gh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        # Repository-specific release preparation goes here, e.g.:
        #   ./build.sh
        #   gh release upload "$RELEASE_TAG" ./artifact --clobber
        run: echo "nothing to add to $RELEASE_TAG yet"

  # Move the moving major tag to the release this run just cut, but only
  # when the released tag points at the commit this run tested: main can
  # advance in the seconds between the gate and the release, and
  # major-pinned consumers must never receive an untested commit. On a
  # mismatch, fail loudly (the release stays draft) and repair by hand
  # after verifying that commit's CI. Runs after update-release so the tag
  # never moves to a commit whose draft could not be prepared.
  retag-major:
    needs: [release-please, update-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert the release matches the tested commit
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          released="$(git rev-parse "refs/tags/$TAG^{}")"
          if [ "$released" != "$GITHUB_SHA" ]; then
            echo "::error::released $TAG at $released, but this run tested $GITHUB_SHA (main moved during the release window). Verify that commit's CI, then move the major tag by hand: git tag -f <major> $TAG && git push --force origin <major> (e.g. major v1 for v1.2.3)."
            exit 1
          fi
      - name: Move the major tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          major="${TAG%%.*}"
          major="v${major#v}"
          git config user.name "settings-as-code-release"
          git config user.email "settings-as-code-release@users.noreply.github.com"
          git tag -f "$major" "refs/tags/$TAG^{}"
          git push --force origin "refs/tags/$major"
          echo "moved $major -> $TAG"

  # Step 3: freeze the release. This job stays last.
  publish-release:
    needs: [release-please, update-release, retag-major]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false

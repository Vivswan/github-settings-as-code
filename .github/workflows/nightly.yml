# Nightly upstream-freshness probes. Generated from the fleet sync's nightly
# starter and never overwritten by a later sync.
#
# Each job fails a night instead of surprising a later PR: checks runs the
# schema lockstep tests and the typecheck against the latest Octokit
# packages, and float-canary deletes bun.lock and re-resolves from scratch so
# a breaking transitive release fails a night instead of the next
# from-scratch install.
# The report job files one tracking issue on a red night and closes it on a
# green one (the platform's docs/nightly.md).
name: Nightly

on:
  schedule:
    # Off-peak, off the top of the hour, and offset from the fuzzer
    # starter's 03:13; pick your repo's own minute so the fleet's nightlies
    # do not all land on GitHub at once.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# The checks job needs only the checkout; the report job scopes its own
# issue and dispatch permissions below.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        id: setup

      # The lockstep tests PR CI runs against the pinned @octokit/openapi and
      # @octokit/graphql-schema, here against each package's latest release:
      # a used path removed, an upstream gap now documented, or a selected
      # field retired fails the night before Dependabot's bump PR does.
      # --no-save leaves package.json and the lockfile untouched; the upgraded
      # node_modules stays ambient for the rest of this job.
      - name: Probe the latest OpenAPI descriptor and GraphQL schema
        run: |
          bun add --no-save --ignore-scripts @octokit/openapi@latest @octokit/graphql-schema@latest
          # A pinned version left in place would make this probe pass green
          # forever without probing anything.
          for pkg in @octokit/openapi @octokit/graphql-schema; do
            installed="$(bun -e "console.log(require('$pkg/package.json').version)")"
            latest="$(bun info "$pkg" version)"
            if [ "$installed" != "$latest" ]; then
              echo "::error::$pkg@$installed is installed but $latest is the latest; the probe is testing the pin"
              exit 1
            fi
            echo "$pkg@$installed"
          done
          bun test test/e2e/openapi/validate.test.ts test/sections/graphql-queries.test.ts

      # always() so a red schema probe cannot mask this one (the job still
      # fails if either step failed); gated on the setup step because there
      # is nothing to probe when setup itself broke.
      - name: Probe the latest @octokit/types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bun add --no-save --ignore-scripts @octokit/types@latest
          log="$(mktemp)"
          # --pretty false keeps the one-error-per-line format the grep below
          # parses, independent of tsc's TTY detection.
          if bun run typecheck --pretty false >"$log" 2>&1; then
            echo "typecheck is clean against @octokit/types@latest"
          else
            cat "$log"
            # `|| true`: inert under the default shell (the pipeline ends
            # in sort -u), but guards the general-breakage branch below if
            # this step ever declares shell: bash (which adds pipefail).
            tripped="$(grep -E '^src/upstream-gaps/.+error TS2344' "$log" | cut -d'(' -f1 | sort -u || true)"
            if [ -n "$tripped" ]; then
              echo "::error::@octokit/types@latest fires upstream-gap tripwires; run bun .github/scripts/graduate-upstream-gaps.ts for these files:"
              echo "$tripped"
            else
              echo "::error::typecheck against @octokit/types@latest failed outside the upstream-gap tripwires;" \
                "a types major may have broken the build (see log above)"
            fi
            exit 1
          fi

  # The only from-scratch resolve in this repository: package.json is pinned
  # exactly (the package-pins test guards that), so only transitive ranges
  # can float, and a float that breaks the gate fails here first. Its own
  # job because the checks job's @octokit/types probe leaves node_modules
  # upgraded, and this probe needs a clean tree to re-resolve from.
  float-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The from-scratch resolve is this job's install.
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # Delete before resolving: bun keeps a stale lockfile as a valid
      # resolution, and only a from-scratch resolve floats every transitive
      # range.
      - name: Re-resolve from scratch
        run: |
          rm bun.lock
          bun install --ignore-scripts
          git --no-pager diff --stat -- bun.lock
          git checkout -- bun.lock
      - name: Run the gate on the floated resolution
        run: bun run check

  # Runs whatever happened to the probe jobs, and treats a CANCELLED probe
  # as red: a job that hits its timeout is cancelled, not failed, and a
  # hang is exactly what a nightly run exists to catch.
  report:
    needs: [checks, float-canary]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls behind a bun setup; a hung reporter is the residual
    # silence window, so keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue;
    # actions: write lets the red path dispatch auto-assign at it.
    permissions:
      issues: write
      actions: write
    steps:
      - name: File or update the nightly issue
        id: file-issue
        if: needs.checks.result != 'success' || needs.float-canary.result != 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        # This job checks nothing out (kept tight), so gh has no git
        # context; GH_REPO points it at this repository (run 31563375394
        # failed on exactly this).
        env:
          GH_REPO: ${{ github.repository }}
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          # No artifacts directory is passed: this stream files the generic
          # nightly-failure report (workflow, commit, run link) rather than
          # the fuzzer's failure-report contract. The tuple below is used
          # only when the label has to be created and matches the nightly
          # module's tracking label, which the fleet settings layer applies.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure
          stream: generic

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the nightly issue on a green night
        if: needs.checks.result == 'success' && needs.float-canary.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        env:
          GH_REPO: ${{ github.repository }}
        with:
          mode: resolve
          label: "nightly-failure"
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic

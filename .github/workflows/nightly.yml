# Nightly upstream-freshness probes. Generated from the repo-platform nightly
# starter and never overwritten by template sync. The checks job re-cuts the
# trimmed OpenAPI spec from upstream HEAD (a path-level staleness check) and
# typechecks against the latest @octokit/types, so pinned-dependency staleness
# fails a night instead of surprising the next manual bump; the report job
# below files or updates one label-deduplicated tracking issue on a red night
# and closes it on a green one (see repo-platform's docs/nightly.md).
name: Nightly

on:
  schedule:
    # Off-peak, off the top of the hour, and offset from the fuzzer
    # starter's 03:13; pick your repo's own minute so the fleet's nightlies
    # do not all land on GitHub at once.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# The checks job needs only the checkout; the report job scopes its own
# issue and dispatch permissions below.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile --ignore-scripts

      # PR CI proves USED_PATHS against the pinned descriptor; this probe
      # re-cuts against upstream HEAD (deliberately bypassing the cached
      # spec), so trim-openapi's own errors become the freshness signal: a
      # newly documented UNDOCUMENTED_PATHS entry or a removed/renamed used
      # path fails the night.
      - name: Probe the latest OpenAPI descriptor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assign and export separately: `export X="$(cmd)"` takes export's
          # exit status, so a failed gh would run the trim with an empty ref.
          TRIM_UPSTREAM_REF="$(gh api repos/github/rest-api-description/commits/main --jq .sha)"
          export TRIM_UPSTREAM_REF
          case "$TRIM_UPSTREAM_REF" in
            [0-9a-f]*[0-9a-f]) ;;
            *) echo "::error::could not resolve the latest rest-api-description commit; got '$TRIM_UPSTREAM_REF'"; exit 1 ;;
          esac
          log="$(mktemp)"
          if ! bun .github/scripts/trim-openapi.ts >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          cat "$log"
          # The script logs the descriptor URL, which embeds the ref it used.
          # A pinned ref there means the override was ignored - which would
          # make this probe pass green forever without probing anything.
          if ! grep -q "$TRIM_UPSTREAM_REF" "$log"; then
            echo "::error::trim-openapi.ts did not fetch $TRIM_UPSTREAM_REF; its TRIM_UPSTREAM_REF override is gone and this probe is testing nothing"
            exit 1
          fi

      # always() so a red spec probe cannot mask this one (the job still
      # fails if either step failed); gated on install because there is
      # nothing to probe when setup itself broke. --no-save keeps the
      # lockfile and package.json untouched; the upgraded node_modules stays
      # ambient for the rest of this job, so keep later steps out of it.
      - name: Probe the latest @octokit/types
        if: always() && steps.install.outcome == 'success'
        run: |
          bun add --no-save --ignore-scripts @octokit/types@latest
          log="$(mktemp)"
          # --pretty false keeps the one-error-per-line format the grep below
          # parses, independent of tsc's TTY detection.
          if bun run typecheck --pretty false >"$log" 2>&1; then
            echo "typecheck is clean against @octokit/types@latest"
          else
            cat "$log"
            tripped="$(grep -E '^src/upstream-gaps/.+error TS2344' "$log" | cut -d'(' -f1 | sort -u)"
            if [ -n "$tripped" ]; then
              echo "::error::@octokit/types@latest fires upstream-gap tripwires; graduate (delete) these files:"
              echo "$tripped"
            else
              echo "::error::typecheck against @octokit/types@latest failed outside the upstream-gap tripwires; a types major may have broken the build (see log above)"
            fi
            exit 1
          fi

  # Runs whatever happened to the checks job, and treats a CANCELLED checks
  # job as red: a job that hits its timeout is cancelled, not failed, and a
  # hang is exactly what a nightly run exists to catch.
  report:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls behind a bun setup; a hung reporter is the residual
    # silence window, so keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue;
    # actions: write lets the red path dispatch auto-assign at it.
    permissions:
      issues: write
      actions: write
    steps:
      - name: File or update the nightly issue
        id: file-issue
        if: needs.checks.result == 'failure' || needs.checks.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          # No artifacts directory is passed: this stream files the generic
          # nightly-failure report (workflow, commit, run link) rather than
          # the fuzzer's failure-report contract. The tuple below is used
          # only when the label has to be created and matches the
          # settings-sync declaration.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the nightly issue on a green night
        if: needs.checks.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: resolve
          label: "nightly-failure"
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic

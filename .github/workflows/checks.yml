# Repo-owned, never overwritten by sync; the managed ci.yml calls it inside the all-green gate, so every job here
# must pass before all-green goes green. Three limits come with running inside the `checks` caller:
#   secrets      -> none reach these jobs
#   permissions  -> capped at the caller's contents: read
#   all-green    -> sees only the aggregate result

name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bun test loads the fetched, gitignored OpenAPI spec and GraphQL
      # schema; the composite restores each from cache or fetches on a miss.
      - uses: ./.github/actions/fetch-test-artifacts
      - name: Lint (biome)
        run: bun run lint
      - name: Lint (architecture)
        run: bun run lint:arch
      - name: Typecheck
        run: bun run typecheck
      - name: Dead code (knip)
        run: bun run knip
      - name: Compat markers
        run: bun run check:compat
      - name: Test
        run: bun run test

  # The freshness tripwire behind the boundary anchor (update-release-pr.yml): version tags live off main, so a lost
  # anchor would have every release PR refresh computed from a stale boundary, and gating here parks the release job
  # before release-please can build a garbage release PR. Each half is its own job, gated on its event: a skipped job
  # leaves the checks caller, and so all-green, green.
  #   on main          -> boundary-check: last-release-sha is the newest release merge or its parent
  #   on a release PR  -> anchor-check: the PR carries the anchored NEXT boundary, which the main-side rule would reject
  boundary-check:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The newest release merge can be arbitrarily far behind HEAD.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Confirm last-release-sha matches the newest release merge
        run: bun .github/scripts/release-pipeline.ts boundary-check

  # An unanchored release PR must be unmergeable here, not park the pipeline after its merge.
  anchor-check:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Require the release PR to carry this cycle's anchor
        run: bun .github/scripts/release-pipeline.ts anchor-check

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate the schema and compare
        run: bun run build:check

  # The packed tarball is imported from a fresh consumer project under Node and under tsc with skipLibCheck off, so a
  # declaration leaking a devDependency type fails here, not on a consumer's machine.
  # The consumer runs on the engines floor package.json advertises and on current node; tsdown needs a newer node
  # than the floor, so the PATH node is 24 and the floor's binary is handed to the consumer alone.
  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.14", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Hand the consumer its node
        run: echo "SMOKE_CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, pack, install, import, and typecheck the library
        run: bun .github/scripts/package-smoke.ts

  # Drift and permission skips are fine here (the default token cannot read admin surfaces); a CRASH is not, and an
  # exception never sets the result output.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the action bundle
        run: bun run build:bundle
      - name: Run settings-as-code (check mode)
        id: selfcheck
        uses: ./
        continue-on-error: true
        with:
          mode: check
          on-missing-permission: warn
      - name: Assert the action ran to completion
        env:
          RESULT: ${{ steps.selfcheck.outputs.result }}
        run: |
          case "$RESULT" in
            clean|drift|partial|failed) echo "action completed with result=$RESULT" ;;
            *) echo "::error::action crashed (no result output)"; exit 1 ;;
          esac

  # The action bundle runs under node24, so node is installed beside bun. A non-PR event (push, dispatch) has no base
  # to diff against, so it runs the full corpus.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Select sections from the diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      # The harness validates mock responses against the fetched, gitignored spec; the composite restores or fetches
      # it, skipped with the run when the selector picks nothing.
      - uses: ./.github/actions/fetch-test-artifacts
        if: steps.select.outputs.sections != 'none'
      - name: Run scenarios and fuzz
        if: steps.select.outputs.sections != 'none'
        env:
          SECTIONS: ${{ steps.select.outputs.sections }}
        run: |
          if [ "$SECTIONS" = "all" ]; then
            bun test/e2e/run.ts
            bun test/e2e/fuzz.ts --iterations 25
          else
            bun test/e2e/run.ts --sections "$SECTIONS"
            bun test/e2e/fuzz.ts --iterations 25 --sections "$SECTIONS"
          fi

  # A PR that adds an endpoint without a scenario reaching it must fail on that PR, not the next night. Coldness is a
  # whole-corpus property (deleting one scenario can chill any route), so the full corpus runs (~10 minutes) unless
  # the selector finds nothing settings-related in the diff.
  endpoint-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Only the selector's "none" answer matters here. It runs BEFORE the spec cache/fetch so a PR that selects
      # nothing skips the download too.
      - name: Check whether the diff can affect route coverage
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      - uses: ./.github/actions/fetch-test-artifacts
        if: steps.select.outputs.sections != 'none'
      - name: Endpoint-coverage tripwire
        if: steps.select.outputs.sections != 'none'
        run: bun .github/scripts/check-endpoint-coverage.ts

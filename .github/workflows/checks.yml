# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Never
# overwritten by template sync, so edit freely.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result.

name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bun test loads the fetched, gitignored OpenAPI spec and GraphQL
      # schema; the composite restores each from cache or fetches on a miss.
      - uses: ./.github/actions/fetch-test-artifacts
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Dead code (knip)
        run: bun run knip
      - name: Test
        run: bun run test

  # The freshness tripwire behind the single-tag scheme's boundary (the
  # anchor half lives in update-release-pr.yml): last-release-sha in
  # release-please-config.json must be the newest release merge on main or
  # its parent - version tags live on packaged children that are NOT on
  # main, so release-please cannot find the boundary by tag, and a lost
  # anchor would have every release PR refresh computed from a stale one.
  # Gating here parks the release job (it needs all-green) BEFORE
  # release-please can build a garbage release PR, loudly on every push.
  # The skip lives on the STEPS, per side: the main-side check judges only
  # main (a dispatch against another branch would judge that branch's
  # config, and the release PR deliberately carries the anchored NEXT
  # boundary, which the main-side check would call stale - the PR-side
  # anchor-check below validates that instead), and all-green treats a
  # skipped needed job as failure.
  boundary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          # The newest release merge can be arbitrarily far behind HEAD.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          bun-version-file: .bun-version
      - name: Confirm last-release-sha matches the newest release merge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bun .github/scripts/release-pipeline.ts boundary-check
      # The PR-side half, on release PRs only: the merge must land the
      # anchor, and the managed release-freshness gate proves only that the
      # PR contains main's tip - not that the anchor commit survived the
      # last release-please force-push. An unanchored release PR must be
      # unmergeable here, not park the pipeline after its merge.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        with:
          bun-version-file: .bun-version
      - name: Require the release PR to carry this cycle's anchor
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: bun .github/scripts/release-pipeline.ts anchor-check

  # lib/settings.schema.json is the committed settings.yml JSON Schema,
  # generated from the SettingsFile types in src/; fail if it drifts.
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate the schema and compare
        run: bun run build:check

  # Self-test: run the action from this checkout in check mode against this
  # repository. The bundle is not committed, so build it first. Drift or
  # permission skips are fine (the default token cannot read admin
  # surfaces); a CRASH is not - assert the action produced a result output,
  # which an exception never does.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the action bundle
        run: bun run build:bundle
      - name: Run settings-as-code (check mode)
        id: selfcheck
        uses: ./
        continue-on-error: true
        with:
          mode: check
          on-missing-permission: warn
      - name: Assert the action ran to completion
        env:
          RESULT: ${{ steps.selfcheck.outputs.result }}
        run: |
          case "$RESULT" in
            clean|drift|partial|failed) echo "action completed with result=$RESULT" ;;
            *) echo "::error::action crashed (no result output)"; exit 1 ;;
          esac

  # Diff-aware e2e smoke: on a PR, run only the scenarios and fuzz for the
  # sections the PR touched (docs-only PRs skip; core or cross-cutting changes
  # run every section). The action bundle runs under node24, so the smoke job
  # installs node too. Non-PR events (push, dispatch) have no PR base to diff
  # against, so they run the full corpus.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Select sections from the diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      # The harness validates mock responses against the fetched, gitignored spec;
      # the composite restores or fetches it, skipped with the run on a docs-only PR.
      - uses: ./.github/actions/fetch-test-artifacts
        if: steps.select.outputs.sections != 'none'
      - name: Run scenarios and fuzz
        if: steps.select.outputs.sections != 'none'
        env:
          SECTIONS: ${{ steps.select.outputs.sections }}
        run: |
          if [ "$SECTIONS" = "all" ]; then
            bun test/e2e/run.ts
            bun test/e2e/fuzz.ts --iterations 25
          else
            bun test/e2e/run.ts --sections "$SECTIONS"
            bun test/e2e/fuzz.ts --iterations 25 --sections "$SECTIONS"
          fi

  # Endpoint-coverage tripwire: every "section.role" route in allEndpoints()
  # and allGraphqlOps() must be hit at least once by the curated corpus. The
  # nightly also runs this, but a PR that adds an endpoint without a scenario
  # reaching it must fail on that PR, not the next night. The checker runs
  # the full corpus itself (the diff-aware smoke job may run a subset) - the
  # ~10 minutes are skipped only when the section selector proves the PR
  # touched no route-bearing code (docs-only). The action bundle runs under
  # node24, so node is installed here too.
  endpoint-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The same selector e2e-smoke uses, but only its "none" answer matters
      # here: coldness is a whole-corpus property (deleting one scenario can
      # chill any route), so any code change runs the full sweep, and only a
      # provably docs-only PR skips it. Non-PR events run it always. It runs
      # BEFORE the spec cache/fetch so a docs-only PR skips the download too.
      - name: Check whether the diff can affect route coverage
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      # The same fetched artifacts as e2e-smoke above, skipped with the sweep.
      - uses: ./.github/actions/fetch-test-artifacts
        if: steps.select.outputs.sections != 'none'
      - name: Endpoint-coverage tripwire
        if: steps.select.outputs.sections != 'none'
        run: bun .github/scripts/check-endpoint-coverage.ts

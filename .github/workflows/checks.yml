# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Never
# overwritten by template sync, so edit freely.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result.

name: Checks

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # bun test includes the OpenAPI validator tests, which load the fetched,
      # gitignored trimmed spec; restore it from cache or fetch on a miss.
      - name: Cache the trimmed OpenAPI spec
        id: openapi-cache
        uses: actions/cache@v6
        with:
          path: test/e2e/openapi/github-openapi.trimmed.json
          key: openapi-trimmed-${{ hashFiles('.github/scripts/trim-openapi.ts', 'test/e2e/openapi/paths.ts', 'src/report/issue-report.ts', 'src/sections/**', 'src/upstream-gaps/**', 'src/schema.ts', 'src/github/api.ts') }}
      - name: Fetch the trimmed OpenAPI spec (cache miss)
        if: steps.openapi-cache.outputs.cache-hit != 'true'
        run: bun .github/scripts/trim-openapi.ts
      # bun test also validates every declared GraphQL query against GitHub's
      # published schema, another fetched, gitignored artifact. The key hashes
      # only the fetch script: it carries the pinned UPSTREAM_REF, the sole
      # input that changes the output.
      - name: Cache the GraphQL schema
        id: graphql-schema-cache
        uses: actions/cache@v6
        with:
          path: test/e2e/graphql/schema.docs.graphql
          key: graphql-schema-${{ hashFiles('.github/scripts/fetch-graphql-schema.ts') }}
      - name: Fetch the GraphQL schema (cache miss)
        if: steps.graphql-schema-cache.outputs.cache-hit != 'true'
        run: bun .github/scripts/fetch-graphql-schema.ts
      - name: Lint (biome)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Dead code (knip)
        run: bun run knip
      - name: Test
        run: bun run test

  # lib/settings.schema.json is the committed settings.yml JSON Schema,
  # generated from the SettingsFile types in src/; fail if it drifts.
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate the schema and compare
        run: bun run build:check

  # Self-test: run the action from this checkout in check mode against this
  # repository. The bundle is not committed, so build it first. Drift or
  # permission skips are fine (the default token cannot read admin
  # surfaces); a CRASH is not - assert the action produced a result output,
  # which an exception never does.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the action bundle
        run: bun run build:bundle
      - name: Run settings-as-code (check mode)
        id: selfcheck
        uses: ./
        continue-on-error: true
        with:
          mode: check
          on-missing-permission: warn
      - name: Assert the action ran to completion
        env:
          RESULT: ${{ steps.selfcheck.outputs.result }}
        run: |
          case "$RESULT" in
            clean|drift|partial|failed) echo "action completed with result=$RESULT" ;;
            *) echo "::error::action crashed (no result output)"; exit 1 ;;
          esac

  # Diff-aware e2e smoke: on a PR, run only the scenarios and fuzz for the
  # sections the PR touched (docs-only PRs skip; core or cross-cutting changes
  # run every section). The action bundle runs under node24, so the smoke job
  # installs node too. Non-PR events (push, dispatch) have no PR base to diff
  # against, so they run the full corpus.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The trimmed OpenAPI spec is a fetched, gitignored artifact. Restore it
      # from cache or fetch on a miss. The key hashes every input that changes
      # the output - the trim script (which carries UPSTREAM_REF), USED_PATHS,
      # and the DEFAULT_API_VERSION source - so any of them changing busts the
      # cache and re-fetches, never restoring a stale slice.
      - name: Cache the trimmed OpenAPI spec
        id: openapi-cache
        uses: actions/cache@v6
        with:
          path: test/e2e/openapi/github-openapi.trimmed.json
          key: openapi-trimmed-${{ hashFiles('.github/scripts/trim-openapi.ts', 'test/e2e/openapi/paths.ts', 'src/report/issue-report.ts', 'src/sections/**', 'src/upstream-gaps/**', 'src/schema.ts', 'src/github/api.ts') }}
      - name: Fetch the trimmed OpenAPI spec (cache miss)
        if: steps.openapi-cache.outputs.cache-hit != 'true'
        run: bun .github/scripts/trim-openapi.ts
      - name: Select sections from the diff
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      - name: Run scenarios and fuzz
        if: steps.select.outputs.sections != 'none'
        env:
          SECTIONS: ${{ steps.select.outputs.sections }}
        run: |
          if [ "$SECTIONS" = "all" ]; then
            bun test/e2e/run.ts
            bun test/e2e/fuzz.ts --iterations 25
          else
            bun test/e2e/run.ts --sections "$SECTIONS"
            bun test/e2e/fuzz.ts --iterations 25 --sections "$SECTIONS"
          fi

  # Endpoint-coverage tripwire: every "section.role" route in allEndpoints()
  # and allGraphqlOps() must be hit at least once by the curated corpus. The
  # nightly also runs this, but a PR that adds an endpoint without a scenario
  # reaching it must fail on that PR, not the next night. The checker runs
  # the full corpus itself (the diff-aware smoke job may run a subset) - the
  # ~10 minutes are skipped only when the section selector proves the PR
  # touched no route-bearing code (docs-only). The action bundle runs under
  # node24, so node is installed here too.
  endpoint-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The same selector e2e-smoke uses, but only its "none" answer matters
      # here: coldness is a whole-corpus property (deleting one scenario can
      # chill any route), so any code change runs the full sweep, and only a
      # provably docs-only PR skips it. Non-PR events run it always. It runs
      # BEFORE the spec cache/fetch so a docs-only PR skips the download too.
      - name: Check whether the diff can affect route coverage
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            SECTIONS="$(bun .github/scripts/changed-sections.ts "$BASE_SHA")"
          else
            SECTIONS="all"
          fi
          echo "sections=$SECTIONS" >> "$GITHUB_OUTPUT"
          echo "selected sections: $SECTIONS"
      # Same fetched, gitignored artifact and cache key as e2e-smoke above.
      - name: Cache the trimmed OpenAPI spec
        if: steps.select.outputs.sections != 'none'
        id: openapi-cache
        uses: actions/cache@v6
        with:
          path: test/e2e/openapi/github-openapi.trimmed.json
          key: openapi-trimmed-${{ hashFiles('.github/scripts/trim-openapi.ts', 'test/e2e/openapi/paths.ts', 'src/report/issue-report.ts', 'src/sections/**', 'src/upstream-gaps/**', 'src/schema.ts', 'src/github/api.ts') }}
      - name: Fetch the trimmed OpenAPI spec (cache miss)
        if: steps.select.outputs.sections != 'none' && steps.openapi-cache.outputs.cache-hit != 'true'
        run: bun .github/scripts/trim-openapi.ts
      - name: Endpoint-coverage tripwire
        if: steps.select.outputs.sections != 'none'
        run: bun .github/scripts/check-endpoint-coverage.ts

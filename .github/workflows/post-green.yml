# Repo-owned, never overwritten by sync; ci.yml calls it after the all-green gate, before the release, with the
# judged sha. Pending runs coalesce (ci.yml's concurrency group), so jobs here reconcile current state and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No permissions key: the job inherits the caller's grant, which is enough because chain commits carry no .github/workflows/.
  #   GITHUB_TOKEN at contents: write, or a PAT  -> pushes build and latest
  #   a read ceiling and no PAT                  -> warns and skips; the release hook publishes the release's chain commit and latest itself
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The script judges whether build's recorded sources lie on this commit's history; a shallow checkout cannot.
          fetch-depth: 0
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # A dry-run push asks origin for its receive-pack advertisement over the channel the real push uses, which a
      # token without write access is refused; nothing is created. The target is a ref that never exists: HEAD is no
      # descendant of build's tip, so a dry run against build itself would be rejected locally whatever the token.
      #
      # git's refusal is remote-supplied text, so it is printed inside a stop-commands fence keyed by a per-run token
      # and never inside a workflow command.
      #   the runner acts on any line whose first non-blank text is "::"  -> the fence disarms every such line
      #   only the fence's own token resumes command processing           -> the text can neither forge a command nor swallow the error after it
      #   awk, not sed                                                     -> ends the last line even when git did not, so the fence stays alone
      - name: Check the token can push to build
        id: token
        env:
          PAT_SET: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
        run: |
          if git push --dry-run --quiet origin HEAD:refs/dry-run/token-probe 2>probe.err; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PAT_SET" = "true" ]; then
            fence=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "::stop-commands::$fence"
            echo "probe stderr:"
            awk '{ print "  " $0 }' probe.err
            echo "::$fence::"
            echo "::error::REPO_PLATFORM_TOKEN cannot push to this repository; git's refusal is in the probe stderr lines above."
            rm -f probe.err
            exit 1
          else
            echo "::warning::this run's token cannot push (the caller grants contents: read);" \
              "the build branch and the latest tag were not advanced here (the release hook advances them on each release)." \
              "Raise the caller's ceiling to contents: write, or add a REPO_PLATFORM_TOKEN PAT secret" \
              "with Contents (read and write) on this repository, to publish every green push to @latest."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f probe.err
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.proceed == 'true'
        with:
          bun-version-file: .bun-version
      - name: Build the bundle and the library
        if: steps.token.outputs.proceed == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:bundle
          bun run build:lib
      - name: Append this commit's packaged commit to build and point latest at the newest main source
        if: steps.token.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts advance-build

  # No permissions key, like build: a job asking above the caller's ceiling fails the whole call, so the OIDC
  # grant arrives by inheritance from the id-token: write the managed ci.yml gives the post-green call.
  # The npm-publish lane exists because ci.yml keys main runs by sha (two green pushes can publish at once) and
  # the registry has no compare-and-set: a verdict read under the lane still holds when its publish lands.
  #   no ACTIONS_ID_TOKEN_REQUEST_URL -> the caller granted none (a fork, a ceiling change); step one skips the rest
  #   shared lane                     -> update-release.yml's publish takes the same lane; no caller holds it
  #   queue: max                      -> a lane keeps ONE pending job by default; a dropped job fails the post-green call
  #   verdict compares dist-tags      -> the lane serializes but does not order; GitHub promises no queue order
  publish-next:
    if: github.repository == 'Vivswan/github-settings-as-code'
    concurrency:
      group: npm-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the caller grants an OIDC token
        id: oidc
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this run has no OIDC token (the post-green call in the managed ci.yml grants no id-token: write);" \
              "the library pre-release was not published to npm." \
              "Add id-token: write to that call's permissions in Vivswan/repo-platform to publish every green push to @next."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.oidc.outputs.proceed == 'true'
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.oidc.outputs.proceed == 'true'
        with:
          bun-version-file: .bun-version
      # registry-url writes the .npmrc npm publishes through; with no
      # NODE_AUTH_TOKEN the action leaves a placeholder there, which npm's
      # OIDC exchange replaces.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.oidc.outputs.proceed == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an
      # older bundled npm is upgraded once, then held to the floor.
      - name: Require an npm that publishes through OIDC
        if: steps.oidc.outputs.proceed == 'true'
        run: |
          floor=11.5.1
          below_floor() { [ "$(printf '%s\n' "$floor" "$(npm --version)" | sort -V | head -n1)" != "$floor" ]; }
          if below_floor; then
            npm install -g npm@latest
          fi
          if below_floor; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs npm $floor or newer."
            exit 1
          fi
      - name: Build the library
        if: steps.oidc.outputs.proceed == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:lib
      # scripts.prepare is dropped from the published manifest: it installs
      # lefthook, a devDependency the tarball does not carry, and npm blocks
      # install scripts from a provenance-attested package anyway.
      # The verdict reads the registry: a version already there (a rerun of
      # this run) or a next or latest that is not older (a stale retry after
      # newer runs published) publishes nothing, so next never moves back; a
      # registry error stops the job instead of publishing blind. npm's
      # provenance names the commit in GITHUB_SHA, so the source is passed in.
      - name: Publish the pre-release under the next dist-tag
        if: steps.oidc.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          verdict="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-verdict next)"
          case "$verdict" in
            publish\ *)
              npm version "${verdict#publish }" --no-git-tag-version
              npm pkg delete scripts.prepare
              GITHUB_SHA="$SOURCE_SHA" npm publish --tag next ;;
            skip\ *) echo "::notice::${verdict#skip }" ;;
            *)
              echo "unexpected npm-verdict output: $verdict"
              echo "::error::npm-verdict printed neither publish nor skip; see the line above."
              exit 1 ;;
          esac

# Repo-owned, never overwritten by sync; ci.yml calls it after the all-green gate, before the release, with the
# judged sha. Main runs are keyed by sha (ci.yml's concurrency group), so runs for different shas never coalesce
# and successive merges can overlap; the job here reconciles current state and stays idempotent. Its one job packages
# the judged commit; the npm pre-release publishes from update-release-pr.yml, on release-please's refresh of the
# release PR, not from every green push.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No permissions key: the job inherits the caller's grant, which is enough because a packaged commit changes no
  # workflow file against its parent (the main commit), the diff GitHub judges a token's workflows grant on.
  #   GITHUB_TOKEN at contents: write, or a PAT  -> pushes the build tag and latest
  #   a read ceiling and no PAT                  -> warns and skips; the release hook packages each release and moves latest itself
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The script names the tag by this commit's position on main and judges latest's source against its
          # history; a shallow checkout can do neither.
          fetch-depth: 0
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # bun alone: the probe runs before anything is installed for a commit the job may not publish.
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Check the token can push
        id: token
        env:
          PAT_SET: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
        run: bun .github/scripts/post-green-steps.ts probe
      - uses: ./.github/actions/setup
        if: steps.token.outputs.proceed == 'true'
      - name: Build the bundle, the schema, and the library
        if: steps.token.outputs.proceed == 'true'
        run: |
          bun run build:bundle
          bun run build:schema
          bun run build:lib
      - name: Package this commit under its build tag, prune the window, and point latest at the newest main source
        if: steps.token.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts package-commit

# Repo-owned, never overwritten by sync; ci.yml calls it after the all-green gate, before the release, with the
# judged sha. Pending runs coalesce (ci.yml's concurrency group), so jobs here reconcile current state and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No permissions key: the job inherits the caller's grant, which is enough because chain commits carry no .github/workflows/.
  #   GITHUB_TOKEN at contents: write, or a PAT  -> pushes build and latest
  #   a read ceiling and no PAT                  -> warns and skips; the release hook publishes the release's chain commit and latest itself
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The script judges whether build's recorded sources lie on this commit's history; a shallow checkout cannot.
          fetch-depth: 0
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # A dry-run push asks origin for its receive-pack advertisement over the channel the real push uses, which a
      # token without write access is refused; nothing is created. The target is a ref that never exists: HEAD is no
      # descendant of build's tip, so a dry run against build itself would be rejected locally whatever the token.
      #
      # git's refusal is remote-supplied text, so it is printed inside a stop-commands fence keyed by a per-run token
      # and never inside a workflow command.
      #   the runner acts on any line whose first non-blank text is "::"  -> the fence disarms every such line
      #   only the fence's own token resumes command processing           -> the text can neither forge a command nor swallow the error after it
      #   awk, not sed                                                     -> ends the last line even when git did not, so the fence stays alone
      - name: Check the token can push to build
        id: token
        env:
          PAT_SET: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
        run: |
          if git push --dry-run --quiet origin HEAD:refs/dry-run/token-probe 2>probe.err; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PAT_SET" = "true" ]; then
            fence=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "::stop-commands::$fence"
            echo "probe stderr:"
            awk '{ print "  " $0 }' probe.err
            echo "::$fence::"
            echo "::error::REPO_PLATFORM_TOKEN cannot push to this repository; git's refusal is in the probe stderr lines above."
            rm -f probe.err
            exit 1
          else
            echo "::warning::this run's token cannot push (the caller grants contents: read); the build branch and the latest tag were not advanced here (the release hook advances them on each release)." \
              "Raise the caller's ceiling to contents: write, or add a REPO_PLATFORM_TOKEN PAT secret with Contents (read and write) on this repository, to publish every green push to @latest."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f probe.err
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.proceed == 'true'
        with:
          bun-version-file: .bun-version
      - name: Build the bundle
        if: steps.token.outputs.proceed == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:bundle
      - name: Append this commit's packaged commit to build and point latest at the newest main source
        if: steps.token.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts advance-build

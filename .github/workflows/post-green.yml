# Repo-owned: generated once by Vivswan/repo-platform, never overwritten by
# sync. ci.yml calls it after the all-green gate, before the release, with
# the judged sha. Pending runs coalesce (ci.yml's concurrency group), so
# jobs here reconcile current state and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No lane here: the called workflow holds apply-settings-<repo>. The apply
  # writes with APPLY_SETTING_TOKEN via inherit; the ceiling is contents: read.
  apply-settings:
    uses: ./.github/workflows/apply-settings.yml
    with:
      sha: ${{ inputs.sha }}
    secrets: inherit

  # Appends the green commit's packaged child to the `build` branch and moves
  # the `latest` tag (release-pipeline.ts advance-build). Beside
  # apply-settings, not behind it: a settings skip must not hold build back.
  # No permissions key: the job inherits the caller's grant and pushes with
  # GITHUB_TOKEN when that is contents: write, which suffices because chain
  # commits carry no .github/workflows/ (the same fact update-release.yml's
  # append relies on); with a read ceiling and no PAT it warns and skips, and
  # the release hook publishes the release's chain commit and latest itself.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          # The script judges whether build's recorded sources lie on this
          # commit's history; a shallow checkout cannot answer that.
          fetch-depth: 0
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # A dry-run push asks origin for its receive-pack advertisement over
      # the very channel the real push uses, which a token without write
      # access is refused; nothing is created. The target is a ref that never
      # exists, not build itself: HEAD is no descendant of build's tip, so a
      # dry run against build would be rejected locally as a non-fast-forward
      # whatever the token.
      - name: Check the token can push to build
        id: token
        env:
          PAT_SET: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
        run: |
          if git push --dry-run --quiet origin HEAD:refs/dry-run/token-probe 2>probe.err; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PAT_SET" = "true" ]; then
            echo "::error::REPO_PLATFORM_TOKEN cannot push to this repository: $(tr '\n' ' ' <probe.err)"
            rm -f probe.err
            exit 1
          else
            echo "::warning::this run's token cannot push (the caller grants contents: read); the build branch and the latest tag were not advanced here (the release hook advances them on each release)." \
              "Raise the caller's ceiling to contents: write, or add a REPO_PLATFORM_TOKEN PAT secret with Contents (read and write) on this repository, to publish every green push to @latest."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f probe.err
      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.proceed == 'true'
        with:
          bun-version-file: .bun-version
      - name: Build the bundle
        if: steps.token.outputs.proceed == 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:bundle
      - name: Append this commit's packaged child to build and point latest at the newest main source
        if: steps.token.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts advance-build

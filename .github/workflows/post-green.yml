# Repo-owned, never overwritten by sync; ci.yml calls it after the all-green gate, before the release, with the
# judged sha. Main runs are keyed by sha (ci.yml's concurrency group), so runs for different shas never coalesce
# and successive merges can overlap; the job here reconciles current state and stays idempotent. Its one job packages
# the judged commit; the npm pre-release publishes from update-release-pr.yml, on release-please's refresh of the
# release PR, not from every green push.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No permissions key: the job inherits the caller's grant, which is enough because a packaged commit changes no
  # workflow file against its parent (the main commit), the diff GitHub judges a token's workflows grant on.
  #   GITHUB_TOKEN at contents: write, or a PAT  -> pushes the build tag and latest
  #   a read ceiling and no PAT                  -> warns and skips; the release hook packages each release and moves latest itself
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The script names the tag by this commit's position on main and judges latest's source against its history; a shallow checkout can do neither.
          fetch-depth: 0
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # A dry-run push asks origin for its receive-pack advertisement over the channel the real push uses, which a
      # token without write access is refused; nothing is created. The target is a ref that never exists, so the dry
      # run judges the token alone: against an existing tag git would refuse the non-fast-forward locally whatever the token.
      #
      # git's refusal is remote-supplied text, so it is printed inside a stop-commands fence keyed by a per-run token
      # and never inside a workflow command.
      #   the runner acts on any line whose first non-blank text is "::"  -> the fence disarms every such line
      #   only the fence's own token resumes command processing           -> the text can neither forge a command nor swallow the error after it
      #   awk, not sed                                                     -> ends the last line even when git did not, so the fence stays alone
      - name: Check the token can push
        id: token
        env:
          PAT_SET: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
        run: |
          if git push --dry-run --quiet origin HEAD:refs/dry-run/token-probe 2>probe.err; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PAT_SET" = "true" ]; then
            fence=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
            echo "::stop-commands::$fence"
            echo "probe stderr:"
            awk '{ print "  " $0 }' probe.err
            echo "::$fence::"
            echo "::error::REPO_PLATFORM_TOKEN cannot push to this repository; git's refusal is in the probe stderr lines above."
            rm -f probe.err
            exit 1
          else
            echo "::warning::this run's token cannot push (the caller grants contents: read);" \
              "this commit was not packaged and the latest tag was not moved here (the release hook packages each release and moves latest itself)." \
              "Raise the caller's ceiling to contents: write, or add a REPO_PLATFORM_TOKEN PAT secret" \
              "with Contents (read and write) on this repository, to publish every green push to @latest."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f probe.err
      - uses: ./.github/actions/setup
        if: steps.token.outputs.proceed == 'true'
      - name: Build the bundle, the schema, and the library
        if: steps.token.outputs.proceed == 'true'
        run: |
          bun run build:bundle
          bun run build:schema
          bun run build:lib
      - name: Package this commit under its build tag, prune the window, and point latest at the newest main source
        if: steps.token.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts package-commit

# The release-PR hook of the release pipeline: repo-owned (a generated-once
# starter upstream, so template sync never overwrites it), called by the
# managed release.yml whenever release-please creates or refreshes the
# release PR, independently of any release cut.
#
# This repository's job here is the single-tag scheme's boundary anchor
# (see .github/scripts/release-pipeline.ts): called in the same run that
# refreshed the release PR, GITHUB_SHA is exactly the main head the refresh
# was built on, and the anchor commits it into the PR branch as
# last-release-sha. The script re-verifies against origin - main still at
# this head, the branch built on it - before committing, and rechecks main
# before pushing; a push a release-please refresh overtakes is reapplied on
# the refreshed branch, any other push failure stops the job.
# Token caveat: pushes to the PR branch made with the default github.token
# do NOT re-trigger the PR's CI checks (the close/reopen note in
# release.yml); with REPO_PLATFORM_TOKEN they do.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Anchor the boundary inside the release PR branch
        run: bun .github/scripts/release-pipeline.ts anchor

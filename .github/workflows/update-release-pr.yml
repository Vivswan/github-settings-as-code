# The release-PR hook of the release pipeline: repo-owned (a generated-once starter, never overwritten by sync),
# called by the managed ci.yml whenever release-please creates or refreshes the release PR, independently of any
# release cut. Its one job is the boundary anchor (anchorReleasePr in .github/scripts/release-pipeline.ts): called
# in the run that refreshed the PR, GITHUB_SHA is exactly the main head the refresh was built on.
#
# The anchor is pushed with the default github.token, which starts no workflows, so the PR's checks do not re-run
# on the anchored head; anchor-check's failure message says to close and reopen the PR.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Anchor the boundary inside the release PR branch
        run: bun .github/scripts/release-pipeline.ts anchor

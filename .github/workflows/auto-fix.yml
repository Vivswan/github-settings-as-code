# The commit-back fixes a same-repo PR can need, pushed to its branch; an already-clean tree gets no commit. A PR
# with unrelated type errors fails the build job by design: the graduation script refuses to half-fix a red build.
#   README, action.yml, docs/ regions           -> build:docs, build:action-docs, build:inputs-table
#   src/upstream-gaps/                           -> graduate-upstream-gaps.ts retires the gap files @octokit/types caught up with;
#                                                   gen-gaps-index.ts re-renders index.ts
#   lib/                                         -> never: main carries no bundle, library, or schema
#
# Regenerating the generated files executes PR-controlled code, so the fix is computed in an unprivileged job and crosses to
# the push job as a git patch over the fix-owned paths only; applying a patch executes nothing, and the push job
# re-checks the applied paths before committing. Both steps' logic is .github/scripts/auto-fix-steps.ts.
#   --ignore-scripts on the build job's install  -> lefthook and dependency lifecycle scripts never run
#   no install at all on the push job            -> no git hooks exist where the write token is; bun alone is set up
#   the push script from the default branch      -> bun starts in and imports only default-branch code, so no bunfig,
#                                                   .env, hook, or script of the PR branch runs there; the fix-owned
#                                                   list the job enforces is main's (a same-repo author can still edit
#                                                   this workflow file, which predates the split)
#
# Dependabot-triggered runs read the Dependabot secrets store, not the Actions one, so REPO_PLATFORM_TOKEN goes in
# both. A push made with github.token starts no workflows.
#   no token, install succeeds   -> the fix lands but CI does not re-run; the job posts a PR comment and a warning (close/reopen the PR)
#   no token, Dependabot bun PR  -> a bun.lock the Bun updater left stale fails the frozen install here; a close/reopen
#                                   re-runs it against the same stale lockfile; only a push made with a real token brings a fresh one

name: Auto Fix

on:
  pull_request:
    paths:
      - "src/**"
      - "README.md"
      - "action.yml"
      - "docs/reference/undeclared-policy.md"
      - "docs/reference/permissions.md"
      - "docs/reference/sections.md"
      - "docs/reference/inputs.md"
      - "docs/reference/architecture.md"
      - "architecture.yml"
      - "docs/operate/check-mode.md"
      - "docs/start/getting-started.md"
      - ".github/scripts/gen-action-docs.ts"
      - ".github/scripts/gen-inputs-table.ts"
      - "docs/reference/coverage.md"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".bun-version"
      - ".github/scripts/graduate-upstream-gaps.ts"
      - ".github/scripts/gen-gaps-index.ts"
      - ".github/scripts/gen-openapi.ts"
      - ".github/scripts/gen-docs.ts"
      - ".github/scripts/arch-lint.ts"
      - ".github/scripts/lib/**"
      - ".github/scripts/coverage-data.ts"
      - ".github/scripts/coverage-data.yml"
      - ".github/scripts/endpoint-docs.ts"
      - ".github/scripts/endpoint-docs.yml"
      - "test/e2e/openapi/validate.ts"

permissions:
  contents: read

# Only the newest run per PR proceeds; a superseded run's push would race the new head (its push job skips on the
# head-moved guard anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # The push job's token cannot push to a fork's branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebuild.outputs.changed }}
      pruned: ${{ steps.rebuild.outputs.pruned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Graduate upstream gaps octokit now ships
        shell: bash
        run: bun .github/scripts/graduate-upstream-gaps.ts
      - name: Regenerate the gaps index, docs, and inputs table and stage the fix patch
        id: rebuild
        shell: bash
        run: bun .github/scripts/auto-fix-steps.ts rebuild
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.rebuild.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write # the sticky no-retrigger comment below
    steps:
      # The script that holds the write token comes from the default branch, so nothing checked out from the PR
      # branch is executed here; that branch is checked out beside it, as the tree the patch applies to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: branch
          persist-credentials: false
      # The patch lands OUTSIDE both checkouts so nothing in a work tree can shadow or stage it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix
      # bun alone, no install: no git hook or lifecycle script exists where the write token is. It starts in the
      # trusted checkout, so the bunfig.toml and .env it reads at startup are main's, never the PR branch's.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: trusted/.bun-version
      - name: Commit and push the fix
        id: push
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRUNED: ${{ needs.build.outputs.pruned }}
          PR_CHECKOUT: ${{ github.workspace }}/branch
        shell: bash
        working-directory: trusted
        run: bun .github/scripts/auto-fix-steps.ts push
      # One sticky comment per PR (the header is its identity), updated in place on later pushes; a failed post fails
      # this step, not the push.
      - name: Tell the PR its checks will not re-run
        if: steps.push.outputs.notify == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: auto-fix
          message: >-
            Pushed an auto-fix commit with the default workflow token, which
            starts no workflows, so checks will not re-run on the new head.
            Close and reopen this PR to re-run them, or register
            `REPO_PLATFORM_TOKEN` (as an Actions secret, and as a Dependabot
            secret for Dependabot PRs) so future fixes re-trigger CI
            automatically.

# The commit-back fixes a same-repo PR can need, pushed to its branch; an already-clean tree gets no commit. A PR
# with unrelated type errors fails the build job by design: the graduation script refuses to half-fix a red build.
#   lib/settings.schema.json                     -> build:schema (a Dependabot generator bump changes its bytes on a branch nobody builds)
#   README, COVERAGE, action.yml, docs/ regions  -> build:docs, build:action-docs
#   src/upstream-gaps/                           -> graduate-upstream-gaps.ts retires the gap files @octokit/types caught up with
#   lib/index.js                                 -> never: main carries no bundle
#
# Regenerating the schema executes PR-controlled code, so the fix is computed in an unprivileged job and crosses to
# the push job as a git patch over the fix-owned paths only; applying a patch executes nothing, and the push job
# re-checks the applied paths before committing.
#   --ignore-scripts on the build job's install  -> lefthook and dependency lifecycle scripts never run
#   no install at all on the push job            -> no git hooks exist where the write token is
#
# Dependabot-triggered runs read the Dependabot secrets store, not the Actions one, so REPO_PLATFORM_TOKEN goes in
# both. A push made with github.token starts no workflows.
#   no token, install succeeds   -> the fix lands but CI does not re-run; the job posts a PR comment and a warning (close/reopen the PR)
#   no token, Dependabot bun PR  -> the stale lockfile fails the frozen install here until dependabot-bun-lockfile.yml's
#                                   dedupe push retriggers this workflow, which only a real token does

name: Auto Fix

on:
  pull_request:
    paths:
      - "src/**"
      - "lib/settings.schema.json"
      - "README.md"
      - "action.yml"
      - "docs/reference/undeclared-policy.md"
      - "docs/reference/permissions.md"
      - "docs/reference/sections.md"
      - "docs/reference/inputs.md"
      - "docs/operate/check-mode.md"
      - "docs/start/getting-started.md"
      - ".github/scripts/gen-action-docs.ts"
      - "COVERAGE.md"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".bun-version"
      - ".github/scripts/gen-settings-schema.ts"
      - ".github/scripts/graduate-upstream-gaps.ts"
      - ".github/scripts/gen-gaps-index.ts"
      - ".github/scripts/gen-docs.ts"
      - ".github/scripts/lib/**"
      - ".github/scripts/coverage-data.ts"

permissions:
  contents: read

# Only the newest run per PR proceeds; a superseded run's push would race the new head (its push job skips on the
# head-moved guard anyway).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # The push job's token cannot push to a fork's branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.rebuild.outputs.changed }}
      pruned: ${{ steps.rebuild.outputs.pruned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Graduate upstream gaps octokit now ships
        shell: bash
        # Old branches cut before the graduate script landed lack it; the schema regeneration below still runs for them.
        run: |
          if [ -f .github/scripts/graduate-upstream-gaps.ts ]; then
            bun .github/scripts/graduate-upstream-gaps.ts
          else
            echo "graduate script not on this branch; skipping"
          fi
      - name: Regenerate the schema and docs and stage the fix patch
        id: rebuild
        shell: bash
        run: |
          bun run build:schema
          # Old branches cut before the docs generators landed lack them.
          if [ -f .github/scripts/gen-docs.ts ]; then
            bun run build:docs
          fi
          if [ -f .github/scripts/gen-action-docs.ts ]; then
            bun run build:action-docs
          fi
          # Anything the earlier steps left staged is not this workflow's fix: start from an empty index so the
          # patch holds exactly the allowed paths.
          git reset -q
          git add -A -- lib/settings.schema.json README.md COVERAGE.md action.yml \
            docs/reference/undeclared-policy.md docs/reference/permissions.md docs/operate/check-mode.md \
            docs/reference/sections.md docs/reference/inputs.md docs/start/getting-started.md
          # Old branches lack the gaps directory, and an unmatched pathspec would fail the add.
          if [ -d src/upstream-gaps ]; then
            git add -A -- src/upstream-gaps/
          fi
          git diff --cached --binary > "$RUNNER_TEMP/autofix.patch"
          if [ ! -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "schema and upstream gaps already fresh"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pruned=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # A patch touching src/ means gap files graduated; the push job picks the commit subject from this.
            # --quiet exits 1 on a staged src/ change and, unlike piping --name-only into grep -q, cannot trip
            # pipefail on an early-exiting reader.
            if git diff --cached --quiet -- src/; then
              echo "pruned=false" >> "$GITHUB_OUTPUT"
            else
              echo "pruned=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.rebuild.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          if-no-files-found: error

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write # the sticky no-retrigger comment below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # The patch lands OUTSIDE the checkout so nothing in the work tree can shadow or stage it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix
      - name: Commit and push the fix
        id: push
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRUNED: ${{ needs.build.outputs.pruned }}
        shell: bash
        run: |
          # The branch can move between the build and this push (a Dependabot rebase, or dependabot-bun-lockfile.yml's
          # dedupe commit, which also invalidates the fix): the patch belongs to HEAD_SHA only, and the newer head's
          # own run owns the rebuild.
          superseded() {
            git fetch --quiet origin "$HEAD_REF"
            [ "$(git rev-parse "origin/$HEAD_REF")" != "$HEAD_SHA" ]
          }
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::head moved since the build; skipping the stale fix push"
            exit 0
          fi
          git apply --index --binary "$RUNNER_TEMP/autofix/autofix.patch"
          # The patch was cut on a runner PR code ran on, so it is untrusted: nothing staged outside the fix-owned
          # paths may be committed. --no-renames lists a staged rename as its delete and add halves, so a rename OUT
          # of a protected path cannot hide behind an allowed destination.
          while IFS= read -r -d '' path; do
            case "$path" in
              lib/settings.schema.json | README.md | COVERAGE.md | action.yml | \
              docs/reference/undeclared-policy.md | docs/reference/permissions.md | \
              docs/operate/check-mode.md | docs/reference/sections.md | docs/reference/inputs.md | \
              docs/start/getting-started.md | src/upstream-gaps/*) ;;
              *)
                echo "::error::the fix patch staged '$path', outside lib/settings.schema.json, the generated docs" \
                  "(README.md, COVERAGE.md, action.yml, docs/reference/undeclared-policy.md," \
                  "docs/reference/permissions.md, docs/operate/check-mode.md, docs/reference/sections.md," \
                  "docs/reference/inputs.md, docs/start/getting-started.md), and src/upstream-gaps/; refusing to push"
                exit 1
                ;;
            esac
          done < <(git diff --cached --no-renames --name-only -z)
          if git diff --cached --quiet; then
            echo "the fix patch stages nothing against the head commit; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          subject="build: regenerate settings schema"
          if git diff --cached --quiet -- lib/settings.schema.json src/upstream-gaps/; then
            subject="docs: regenerate generated docs"
          fi
          if [ "$PRUNED" = "true" ]; then
            subject="fix: graduate upstream gaps octokit now ships"
          fi
          # [dependabot skip] keeps Dependabot rebasing and updating the PR over this commit; without it Dependabot
          # stops touching a PR once someone else pushes to it.
          git commit --no-verify -m "$subject" -m "[dependabot skip]"
          # The lease pins the remote to the exact commit the fix was built from, so a concurrent push (even a
          # force-reset to an ancestor) rejects this one instead of racing it.
          if ! git push --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}" \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:"refs/heads/${HEAD_REF}"; then
            if superseded; then
              echo "::notice::head moved during the push; skipping the stale fix push"
              exit 0
            fi
            exit 1
          fi
          if [ "$CAN_RETRIGGER" = "true" ]; then
            exit 0
          fi
          # The fix landed via github.token, which starts no workflows, so the PR's checks will not re-run on the new
          # head: surface that here and, in the step below, on the PR.
          echo "notify=true" >> "$GITHUB_OUTPUT"
          echo "::warning::auto-fix pushed without REPO_PLATFORM_TOKEN - checks will not re-run on the new head;" \
            "close/reopen the PR or register the token"
      # One sticky comment per PR (the header is its identity), updated in place on later pushes; a failed post fails
      # this step, not the push.
      - name: Tell the PR its checks will not re-run
        if: steps.push.outputs.notify == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: auto-fix
          message: >-
            Pushed an auto-fix commit with the default workflow token, which
            starts no workflows, so checks will not re-run on the new head.
            Close and reopen this PR to re-run them, or register
            `REPO_PLATFORM_TOKEN` (as an Actions secret, and as a Dependabot
            secret for Dependabot PRs) so future fixes re-trigger CI
            automatically.

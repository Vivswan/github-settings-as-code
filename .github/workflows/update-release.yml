# The update stage of the release pipeline: repo-owned, called by the managed ci.yml between release-please
# cutting the DRAFT release and the attested publish. release-please names the draft source-vX.Y.Z and creates that
# tag, the marker, on the merge commit on main (release-please-config.json: `draft`, `force-tag-creation`, component
# `source`); it finds its previous release by it. This hook mints the tags a user pins: main is source-only, so each
# points at a packaged commit, the merge commit's child carrying its build (the topology is in
# .github/scripts/release-pipeline/tags.ts).
#
#   resolve-source -> the handed source-vX.Y.Z parsed ONCE into vX.Y.Z, and the merge commit read from the draft's target commitish
#   package        -> the marker held to the merge commit, then its packaged commit found or minted under its build tag, vX.Y.Z minted there ONCE, latest moved forward
#   retag-major    -> move vX there (forward only), then upload bundle and schema to the draft (a published release freezes its assets)
#   verify-release -> confirm the draft's assets, then give the draft vX.Y.Z as its tag and title; the managed publish stage attests and publishes it
#   publish-npm    -> publish the library build to npm as the stable version through trusted publishing, once the assets check out
#
# Only ci.yml reaches this workflow, with the tag release-please just cut from its own merged PR, so a hand-edited
# manifest never mints a tag. A rerun of the failed jobs converges: a version npm already holds is skipped, and once a
# NEWER release shipped, the major stays on it. The draft answers to source-vX.Y.Z until the rename, to vX.Y.Z after.

# Finishing a dead run by hand (prefer re-running its FAILED jobs: a hand run has no attestation.json, a packaged
# commit it mints carries no run trailer, and only the workflow's OIDC identity may publish to npm). NEVER rename or
# publish the draft before `package` has minted the tag: GitHub creates a missing vX.Y.Z on main when the draft publishes.
#   git checkout <merge sha>                    (the draft's target commitish)
#   bun install --frozen-lockfile --ignore-scripts && bun run build
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts package
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts retag-major
#   gh release upload source-vX.Y.Z lib/settings.schema.json lib/index.js --clobber
#   MARKER=source-vX.Y.Z TAG=vX.Y.Z bun .github/scripts/release-pipeline.ts rename-draft
#   gh release edit vX.Y.Z --draft=false

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag release-please cut the draft under, source-vX.Y.Z (the marker, on the merge commit)
        required: true
        type: string

jobs:
  package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Tag pushes, and the packaged commit when post-green did not mint it: a packaged commit changes no workflow
      # file against its parent, so the default token needs no workflows grant. Also what makes the draft visible to gh.
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      # The run's own head, on main, supplies the script that resolves the release; the checkout below replaces it
      # with the release's source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # The release's identity is the draft's target commitish, never this run's GITHUB_SHA: the managed head-check
      # lets a newer push's run recover an older merge's pending release.
      - name: Resolve the release's merge commit from the draft
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARKER: ${{ inputs.tag }}
        run: bun .github/scripts/release-pipeline.ts resolve-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          # The script proves the merge commit sits on main, compares it with latest's source (latest only moves forward), and on a
          # new version tag names the build tag by the commit's position; a shallow checkout can do none of that.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build the bundle, the schema, and the library
        run: bun run build
      # Both paths (mint, or byte-verify on a rerun) leave the worktree bundle equal to the tagged one, which the
      # upload below relies on.
      - name: Create or verify the version tag on the build commit
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts package
      - name: Move the major tag to the packaged commit
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts retag-major
      - name: Upload the packaged artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ inputs.tag }}
        run: gh release upload "$MARKER" lib/settings.schema.json lib/index.js --clobber

  verify-release:
    needs: [package-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # drafts are visible to gh under write alone, and the last step edits the draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # Publishing freezes the asset list, so an incomplete one must stop here while the release is still a draft
      # (v2.0.0 shipped assetless exactly this way). attestation.json is the managed publish stage's asset, attached
      # after this job, so the check ignores it.
      - name: Confirm the release carries both packaged assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARKER: ${{ inputs.tag }}
        run: bun .github/scripts/release-pipeline.ts verify-assets
      # The hook's last write to the draft, after the mint: the managed publish stage publishes the draft under the
      # tag it carries, and GitHub creates a tag origin lacks on main, at the draft's target.
      - name: Give the draft the version tag as its tag and title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MARKER: ${{ inputs.tag }}
          TAG: ${{ needs.package-release.outputs.tag }}
        run: bun .github/scripts/release-pipeline.ts rename-draft

  # Publishes the release's library build to npm as the stable version through trusted publishing: no registry
  # token, provenance attached by npm. Behind verify-release, so nothing reaches the registry before the draft's
  # assets check out. Until the owner's one-time npm setup exists this job fails and holds the draft; a rerun converges.
  # package-release sits in needs for its outputs alone (a job reads outputs only from its direct dependencies).
  # The lane is the one update-release-pr.yml's publish-next takes: the registry has no compare-and-set, so the two
  # publishers never overlap and a verdict still holds when its publish lands; queue: max keeps every queued
  # publish (a lane drops all but one pending job by default).
  publish-npm:
    if: github.repository == 'Vivswan/github-settings-as-code'
    needs: [package-release, verify-release]
    concurrency:
      group: npm-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-release.outputs.source-sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # registry-url writes the .npmrc npm publishes through; with no
      # NODE_AUTH_TOKEN the action leaves a placeholder there, which npm's
      # OIDC exchange replaces.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an
      # older bundled npm is upgraded once, then held to the floor.
      - name: Require an npm that publishes through OIDC
        run: bun .github/scripts/release-pipeline.ts npm-floor
      # The tarball's files list names the schema beside lib/pkg/.
      - name: Build the library
        run: bun run build:schema && bun run build:lib
      # The verdict holds the built package.json to the tag and reads the registry: a version already there (a rerun) or
      # a latest that is a newer release (an older release's job rerun after it) publishes nothing, so no release displaces
      # a newer one from latest (the first publish's placeholder or pre-release there is taken over). GITHUB_SHA sets only
      # the SLSA predicate's source digest; the sigstore certificate still carries this run's own head, so a release
      # recovered by a newer push's run has provenance naming two commits.
      - name: Publish the release to npm
        env:
          TAG: ${{ needs.package-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.package-release.outputs.source-sha }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-publish stable

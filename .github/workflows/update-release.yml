# The update stage of the release pipeline: repo-owned, called by the managed ci.yml between release-please
# cutting the DRAFT release and the attested publish. This hook, not release-please, mints the tag: main is
# source-only, so every consumable ref must point at a packaged commit on the `build` branch (the topology is in
# .github/scripts/release-pipeline.ts; release-please-config.json sets `draft` and pins `force-tag-creation` off).
#
#   resolve the merge commit from the draft's target commitish -> rebuild the bundle, verify the committed schema byte-for-byte
#   package      -> find or append the build commit whose source is the merge commit, mint vX.Y.Z there ONCE, reconcile latest
#   retag-major  -> force-move vX there, then upload bundle and schema to the draft (a published release freezes its assets)
#   verify       -> confirm origin's refs and the draft's assets; the managed publish stage then attests and flips the release live
#   publish-npm  -> publish the library build to npm as the stable version through trusted publishing, once the refs check out
#
# Only ci.yml reaches this workflow, with the tag release-please just cut from its own merged PR, so a hand-edited
# manifest never mints a tag. A rerun converges while this release is its line's newest (a version npm already holds
# is skipped); once a NEWER release shipped, the major move stops by design.

# Finishing a dead run by hand (prefer re-running its FAILED jobs: a hand run has no attestation.json, a chain commit
# it appends carries no run trailer, and the npm publish has no hand path at all, only the workflow's OIDC identity may
# publish). NEVER publish before `package` has minted the tag: a tagless draft makes GitHub create vX.Y.Z lazily on main.
#   git checkout <merge sha>                    (the draft's target commitish)
#   bun install --frozen-lockfile --ignore-scripts && bun run build
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts package
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts retag-major
#   TAG=vX.Y.Z GITHUB_SHA=<merge sha> bun .github/scripts/release-pipeline.ts verify
#   gh release upload vX.Y.Z lib/settings.schema.json lib/index.js --clobber
#   gh release edit vX.Y.Z --draft=false

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (recorded on the release; the ref itself is created here, on the build commit)
        required: true
        type: string

jobs:
  package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Tag pushes, and the append to build when post-green did not run it: chain commits carry no
      # .github/workflows/, so the default token needs no workflows grant. Also what makes the draft visible to gh.
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      # The release's identity is the draft's target commitish, never this run's GITHUB_SHA: the managed head-check
      # lets a newer push's run recover an older merge's pending release.
      - name: Resolve the release's merge commit from the draft
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          if ! grep -qxE '[0-9a-f]{40}' <<< "$sha"; then
            echo "::error::draft $TAG's target commitish is '$sha', not a commit SHA; refusing to package an unidentified source."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          # The script judges whether the build tip's source lies on main; a shallow checkout cannot answer that.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Build the bundle and the schema
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          # The schema asset and the raw URLs at the tags must serve the bytes committed at the merge commit; a
          # divergent regeneration (generator drift, or a compromised generator) stops the release here.
          git diff --exit-code lib/settings.schema.json
      # Both paths (mint, or byte-verify on a rerun) leave the worktree bundle equal to the tagged one, which the
      # upload below relies on.
      - name: Create or verify the version tag on the build commit
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts package
      - name: Move the major tag to the packaged commit
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts retag-major
      - name: Upload the packaged artifacts to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" lib/settings.schema.json lib/index.js --clobber

  verify-release:
    needs: [package-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # read-only in spirit; write is what makes drafts visible to gh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Confirm the published refs carry the build outputs
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.package-release.outputs.source-sha }}
        run: GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts verify
      # Publishing freezes the asset list, so an incomplete one must stop here while the release is still a draft
      # (v2.0.0 shipped assetless exactly this way).
      #   attestation.json   -> the managed publish stage's asset, attached after this job; ignored by the check
      #   attestation.jsonl  -> stale provenance under the old name, which that stage no longer cleans up; deleted first
      # COMPAT(v3): a draft still carrying attestation.jsonl under the old asset name passes; delete the delete-asset branch.
      - name: Confirm the release carries both packaged assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'attestation.jsonl'; then
            gh release delete-asset "$TAG" attestation.jsonl --yes
          fi
          assets="$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name | select(. != "attestation.json")] | sort | join(" ")')"
          expected="index.js settings.schema.json"
          if [ "$assets" != "$expected" ]; then
            echo "::error::release $TAG carries assets [$assets], expected [$expected]; re-run package-release before anything publishes."
            exit 1
          fi

  # Publishes the release's library build to npm as the stable version through trusted publishing: no registry
  # token, provenance attached by npm. Behind verify-release, so nothing reaches the registry before origin's refs
  # check out. Until the owner's one-time npm setup exists this job fails and holds the draft; a rerun converges.
  # package-release sits in needs for its output alone (a job reads outputs only from its direct dependencies).
  # The lane is the one post-green.yml's publish-next takes: the registry has no compare-and-set, so the two
  # publishers never overlap and a verdict still holds when its publish lands; queue: max keeps every queued
  # publish (a lane drops all but one pending job by default).
  publish-npm:
    if: github.repository == 'Vivswan/github-settings-as-code'
    needs: [package-release, verify-release]
    concurrency:
      group: npm-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package-release.outputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # registry-url writes the .npmrc npm publishes through; with no
      # NODE_AUTH_TOKEN the action leaves a placeholder there, which npm's
      # OIDC exchange replaces.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an
      # older bundled npm is upgraded once, then held to the floor.
      - name: Require an npm that publishes through OIDC
        run: |
          floor=11.5.1
          below_floor() { [ "$(printf '%s\n' "$floor" "$(npm --version)" | sort -V | head -n1)" != "$floor" ]; }
          if below_floor; then
            npm install -g npm@latest
          fi
          if below_floor; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs npm $floor or newer."
            exit 1
          fi
      - name: Build the library
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:lib
      # scripts.prepare is dropped from the published manifest, as in
      # post-green.yml's publish-next.
      # The verdict holds the built package.json to the tag and reads the
      # registry: a version already there (a rerun) or a latest that is a
      # newer release (an older release's job rerun after a newer release)
      # publishes nothing, so no release ever displaces a newer one from
      # latest (a pre-release there, the bootstrap's, is taken over). GITHUB_SHA on the
      # publish line sets only the SLSA predicate's source digest; the
      # sigstore certificate still carries this run's own head, so a release
      # recovered by a newer push's run has provenance naming two commits.
      - name: Publish the release to npm
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.package-release.outputs.source-sha }}
        run: |
          verdict="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-verdict stable)"
          case "$verdict" in
            publish\ *)
              npm pkg delete scripts.prepare
              GITHUB_SHA="$SOURCE_SHA" npm publish ;;
            skip\ *) echo "::warning::${verdict#skip }" ;;
            *)
              echo "unexpected npm-verdict output: $verdict"
              echo "::error::npm-verdict printed neither publish nor skip; see the line above."
              exit 1 ;;
          esac

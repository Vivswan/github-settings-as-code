# Restores the two fetched, gitignored test artifacts (trimmed OpenAPI spec, GraphQL schema)
# from cache, fetching each on a miss: the ONE place an artifact is cached (the drift-tripwire
# nightlies fetch uncached by design). Needs setup-bun and `bun install` earlier in the job.
name: Fetch the test artifacts
description: Restore the trimmed OpenAPI spec and the GraphQL schema from cache, fetching each on a miss

runs:
  using: composite
  steps:
    # Hashes every input that changes the output: the trim script (UPSTREAM_REF),
    # USED_PATHS and its route-data imports, and the DEFAULT_API_VERSION source.
    - name: Cache the trimmed OpenAPI spec
      id: openapi-cache
      uses: actions/cache@v6
      with:
        path: test/e2e/openapi/github-openapi.trimmed.json
        key: openapi-trimmed-${{ hashFiles('.github/scripts/trim-openapi.ts', 'test/e2e/openapi/paths.ts', 'src/report/issue-report.ts', 'src/sections/**', 'src/upstream-gaps/**', 'src/schema.ts', 'src/github/api.ts') }}
    - name: Fetch the trimmed OpenAPI spec (cache miss)
      if: steps.openapi-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun .github/scripts/trim-openapi.ts
    # The key hashes only the fetch script: it carries the pinned
    # UPSTREAM_REF, the sole input that changes the output.
    - name: Cache the GraphQL schema
      id: graphql-schema-cache
      uses: actions/cache@v6
      with:
        path: test/e2e/graphql/schema.docs.graphql
        key: graphql-schema-${{ hashFiles('.github/scripts/fetch-graphql-schema.ts') }}
    - name: Fetch the GraphQL schema (cache miss)
      if: steps.graphql-schema-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun .github/scripts/fetch-graphql-schema.ts

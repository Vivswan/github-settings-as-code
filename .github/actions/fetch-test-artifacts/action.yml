# Restores the two fetched, gitignored test artifacts (trimmed OpenAPI spec, GraphQL schema)
# from cache, fetching each on a miss: the ONE place an artifact is cached (the drift-tripwire
# nightlies fetch uncached by design). Needs ./.github/actions/setup (bun and the install) earlier in the job.
name: Fetch the test artifacts
description: Restore the trimmed OpenAPI spec and the GraphQL schema from cache, fetching each on a miss

runs:
  using: composite
  steps:
    # Hashes every input that changes the output: the trim script (UPSTREAM_REF), its fetch helper
    # and the staleness helper (the recorded source-URL key), USED_PATHS and its route-data imports, and
    # the DEFAULT_API_VERSION source.
    - name: Cache the trimmed OpenAPI spec
      id: openapi-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: test/e2e/openapi/github-openapi.trimmed.json
        key: >-
          openapi-trimmed-${{ hashFiles('.github/scripts/trim-openapi.ts',
          '.github/scripts/lib/fetch-retry.ts', '.github/scripts/lib/fetched-artifact.ts',
          'test/e2e/openapi/paths.ts', 'src/report/issue-report.ts', 'src/sections/**',
          'src/upstream-gaps/**', 'src/schema.ts', 'src/github/api.ts') }}
    - name: Fetch the trimmed OpenAPI spec (cache miss)
      if: steps.openapi-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun .github/scripts/trim-openapi.ts
    # The key hashes the fetch script (it carries the pinned UPSTREAM_REF and the source-URL marker line),
    # the fetch helper the bytes come through, and the staleness helper.
    - name: Cache the GraphQL schema
      id: graphql-schema-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: test/e2e/graphql/schema.docs.graphql
        key: >-
          graphql-schema-${{ hashFiles('.github/scripts/fetch-graphql-schema.ts',
          '.github/scripts/lib/fetch-retry.ts', '.github/scripts/lib/fetched-artifact.ts') }}
    - name: Fetch the GraphQL schema (cache miss)
      if: steps.graphql-schema-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun .github/scripts/fetch-graphql-schema.ts

name: Set up bun
description: |
  Installs the pinned bun and, unless told not to, the locked dependencies.

  The bun version is the one .bun-version pins.

  The install runs bun install --frozen-lockfile --ignore-scripts, so the lockfile never changes and the prepare
  script (lefthook, a git hook no runner uses) never runs.

  The caller keeps its own checkout and setup-node steps, whose options differ per job.

inputs:
  install:
    description: '"false" (in any letter case, as GitHub compares) sets up bun alone, and any other value installs the locked dependencies too.'
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Install dependencies
      if: inputs.install != 'false'
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

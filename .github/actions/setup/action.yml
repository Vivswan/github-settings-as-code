# The bun setup and the dependency install of every repo-owned workflow job (checks.yml, post-green.yml, the release
# hooks, the nightlies, auto-fix, auto-format, copilot-setup-steps). The caller keeps its own checkout (ref, depth,
# and token differ per job) and its own setup-node where a step needs node.
#   bun               -> the version in .bun-version, never latest
#   install           -> bun install --frozen-lockfile --ignore-scripts: scripts.prepare installs lefthook, a git hook
#                        no runner uses, and no dependency here needs a lifecycle script (the whole gate runs without them)
#   install: "false"  -> bun alone, for a job that runs a bare .github/scripts entry or resolves the lockfile itself;
#                        any other value installs (GitHub compares without regard to letter case), so a typo can only
#                        add an install, never lose one
#   yamllint: "true"  -> the pinned yamllint behind `bun run lint:yaml`, which fails a CI run where it is missing
# Timeouts: every job of a repo-owned workflow carries timeout-minutes: 15 unless its comment says why it needs more.
name: Set up bun
description: The pinned bun, the locked dependencies unless told not to, and yamllint for the jobs that lint YAML

inputs:
  install:
    description: '"false" sets up bun alone; anything else runs bun install --frozen-lockfile --ignore-scripts'
    default: "true"
  yamllint:
    description: '"true" installs the pinned yamllint for lint:yaml'
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Install dependencies
      if: inputs.install != 'false'
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    # pipx ships on the ubuntu runner image with its bin directory on PATH; a venv of its own leaves the runner's
    # python untouched.
    - name: Install yamllint
      if: inputs.yamllint == 'true'
      shell: bash
      run: pipx install yamllint==1.38.0

# A known rule type's parameter in the wrong casing is refused when the settings
# file is parsed, naming the rule and the accepted values, before any request;
# GitHub would answer the same body with a 422 after the sections before
# rulesets had written. The casing traps: merge_queue spells MERGE|SQUASH|REBASE
# and ALLGREEN|HEADGREEN, pull_request spells merge|squash|rebase, a pattern
# operator is starts_with|ends_with|contains|regex. An unknown rule type still
# passes through to GitHub: rulesets-invalid-rule-type.
name: rulesets-known-rule-parameters-rejected
settings:
  rulesets:
    - name: main-protection
      rules:
        - type: merge_queue
          parameters:
            check_response_timeout_minutes: 60
            grouping_strategy: allgreen
            max_entries_to_build: 5
            max_entries_to_merge: 5
            merge_method: squash
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
        - type: pull_request
          parameters:
            allowed_merge_methods: [SQUASH]
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: false
            require_last_push_approval: false
            required_approving_review_count: 1
            required_review_thread_resolution: false
        - type: branch_name_pattern
          parameters:
            operator: startsWith
            pattern: feat/
inputs:
  mode: apply
token_permissions:
  administration: write
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'rulesets[0].rules[0]: parameters.grouping_strategy: Invalid option: expected one of "ALLGREEN"|"HEADGREEN"; parameters.merge_method: Invalid option: expected one of "MERGE"|"SQUASH"|"REBASE"'
    - 'rulesets[0].rules[1]: parameters.allowed_merge_methods[0]: Invalid option: expected one of "merge"|"squash"|"rebase"'
    - 'rulesets[0].rules[2]: parameters.operator: Invalid option: expected one of "starts_with"|"ends_with"|"contains"|"regex"'

name: teams-apply-permission-change
description: >-
  A team that already has access holds a role below the declared one. Apply
  PUTs the declared permission over the existing grant (GitHub's grant call
  is also its role change) and revokes nothing; a check rerun over the
  mutated state converges.
settings:
  teams:
    - name: platform
      permission: maintain
owner_kind: org
live_state:
  teams:
    platform:
      role_name: read
expect:
  exit_code: 0
  result: applied
  outcomes:
    teams: applied
  mutations:
    - "PUT /orgs/e2e-owner/teams/platform/repos/{repo}"
  never:
    - "DELETE /orgs/e2e-owner/teams/platform/repos/{repo}"
  stdout_contains:
    - "granted team \"platform\" maintain"
  fixpoint: converges

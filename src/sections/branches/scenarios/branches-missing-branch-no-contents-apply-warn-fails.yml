# The same missing branch and token as branches-missing-branch-no-contents-apply-fails, under
# on-missing-permission: warn. The PUT's 404 "Branch not found" is a definitive rejection, not a
# denial, so the warn policy has nothing to skip: the section fails and the run exits 1, exactly as
# under the default policy. A denial here would have been skipped with a warning and exit 0.
name: branches-missing-branch-no-contents-apply-warn-fails
settings:
  branches:
    - name: release
      protection:
        enforce_admins: true
inputs:
  mode: apply
  on_missing_permission: warn
denial_style: fine_grained
live_state:
  branches: ["main"]
  branch_protection: {}
token_permissions:
  administration: write
  contents: none
expect:
  exit_code: 1
  result: failed
  outcomes:
    branches: failed
  skipped_sections: []
  requests_contain:
    - "PUT /repos/e2e-owner/e2e-repo/branches/release/protection"
  stdout_contains:
    - '::error::branches: replacing protection for branch "release" failed - PUT /repos/e2e-owner/e2e-repo/branches/release/protection: 404 Branch not found. The declared branch does not exist on the repo, so its protection cannot be applied; create the branch, or remove it from the settings file'
  stdout_lacks:
    - "::warning::branches: skipped"
  summary_lacks:
    - "the token was denied"

name: actions_variables-snapshot-roundtrip
description: "mode: snapshot reads the live actions_variables back into snapshot.yml and writes nothing to GitHub. The actions_variables read back as name and value, the timestamps dropped. The written file, fed back to a check run against the same state, reads clean."
settings: {}
live_state:
  actions_variables:
    - name: REGION
      value: eu-west-1
      created_at: 2026-01-01T00:00:00Z
      updated_at: 2026-01-01T00:00:00Z
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: actions_variables
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    actions_variables: snapshot
  snapshot:
    actions_variables:
      _undeclared: delete
      entries:
        - name: REGION
          value: eu-west-1
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

name: actions-variables-undeclared-keep
description: >-
  The wrapped actions_variables form with "undeclared: keep" softens the
  section's delete default: a live variable the settings file does not
  declare is KEPT and surfaced as a note instead of being deleted. The
  declared variable still updates, apply stays green, and a check rerun
  converges (the kept variable is a note, not drift).
settings:
  actions_variables:
    undeclared: keep
    entries:
      - name: DEPLOY_REGION
        value: eu-west-1
live_state:
  actions_variables:
    - name: DEPLOY_REGION
      value: us-east-1
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
    - name: RETIRED_FLAG
      value: "off"
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_variables: applied
  mutations:
    - "PATCH /repos/{repo}/actions/variables/DEPLOY_REGION"
  never:
    - "DELETE /repos/{repo}/actions/variables"
  stdout_contains:
    - "kept under \"undeclared: keep\""
    - RETIRED_FLAG
  converges: true

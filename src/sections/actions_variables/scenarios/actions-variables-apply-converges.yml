name: actions-variables-apply-converges
description: >
  Apply exercises all three Actions-variable operations at once: update an
  existing variable whose value drifted (declared with a lowercase name, so
  the case-insensitive match against the uppercase-stored live name is
  exercised), create a new one, and delete a live variable the settings file
  does not declare. The apply-idempotence proof then pins the uppercase
  round-trip: the section compares before writing, so a second apply over
  the lowercase declaration must issue ZERO writes against the
  uppercase-stored live names.
settings:
  actions_variables:
    - name: deploy_region
      value: eu-west-1
    - name: BUILD_MODE
      value: release
live_state:
  actions_variables:
    - name: DEPLOY_REGION
      value: us-east-1
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
    - name: RETIRED_FLAG
      value: "off"
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_variables: applied
  mutations:
    - PATCH /repos/{repo}/actions/variables/DEPLOY_REGION
    - POST /repos/{repo}/actions/variables
    - DELETE /repos/{repo}/actions/variables/RETIRED_FLAG
  requests_contain:
    - GET /repos/e2e-owner/e2e-repo/actions/variables?per_page=30&page=1
  apply_idempotent: true

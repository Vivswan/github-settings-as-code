name: agents-variables-undeclared-delete
description: >-
  The section's delete default: a live Copilot agents variable the plain-array
  form does not declare is DELETED while the declared variable updates. Apply
  stays green, and a check rerun over the mutated state converges.
settings:
  agents_variables:
    - name: AGENT_MODEL
      value: extended
live_state:
  agents_variables:
    - name: AGENT_MODEL
      value: default
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
    - name: RETIRED_FLAG
      value: "off"
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    agents_variables: applied
  mutations:
    - "PATCH /repos/{repo}/agents/variables/AGENT_MODEL"
    - "DELETE /repos/{repo}/agents/variables/RETIRED_FLAG"
  never:
    - "DELETE /repos/{repo}/agents/variables/AGENT_MODEL"
    - "POST /repos/{repo}/agents/variables"
  stdout_contains:
    - 'DELETED undeclared Copilot agents variable "RETIRED_FLAG"'
  fixpoint: converges

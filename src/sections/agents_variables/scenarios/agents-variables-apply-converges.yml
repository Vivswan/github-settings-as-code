name: agents-variables-apply-converges
description: >
  Apply exercises all three Copilot agents variable operations at once:
  update an existing variable whose value drifted (declared with a lowercase
  name, so the case-insensitive match against the uppercase-stored live name
  is exercised), create a new one, and delete a live variable the settings
  file does not declare. The apply-idempotence proof then pins the uppercase
  round-trip: the section compares before writing, so a second apply over
  the lowercase declaration must issue ZERO writes against the
  uppercase-stored live names.
settings:
  agents_variables:
    - name: agent_model
      value: extended
    - name: FIREWALL_MODE
      value: strict
live_state:
  agents_variables:
    - name: AGENT_MODEL
      value: default
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
    - name: RETIRED_FLAG
      value: "off"
      created_at: "2026-01-01T00:00:00Z"
      updated_at: "2026-01-01T00:00:00Z"
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    agents_variables: applied
  mutations:
    - PATCH /repos/{repo}/agents/variables/AGENT_MODEL
    - POST /repos/{repo}/agents/variables
    - DELETE /repos/{repo}/agents/variables/RETIRED_FLAG
  requests_contain:
    - GET /repos/e2e-owner/e2e-repo/agents/variables?per_page=30&page=1
  apply_idempotent: true

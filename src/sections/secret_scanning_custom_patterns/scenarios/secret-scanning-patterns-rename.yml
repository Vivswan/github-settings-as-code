name: secret-scanning-patterns-rename
description: >
  The pattern name is immutable upstream (the PATCH takes no name field),
  so a rename is applied as delete plus create - and there is no rename
  inference: the declared name matches nothing even though an undeclared
  live pattern carries the identical regex, so the section bulk-creates the
  new name and, under "undeclared: delete", bulk-deletes the old one. No
  PATCH may ever fire. The check rerun proves the pair converged.
settings:
  secret_scanning_custom_patterns:
    undeclared: delete
    entries:
      - name: internal-api-token-v2
        pattern: "int_[a-z0-9]{32}"
live_state:
  secret_scanning_patterns:
    - id: 601
      name: internal-api-token
      slug: internal-api-token
      pattern: "int_[a-z0-9]{32}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v4
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    secret_scanning_custom_patterns: applied
  mutations:
    - POST /repos/{repo}/secret-scanning/custom-patterns
    - DELETE /repos/{repo}/secret-scanning/custom-patterns
  never:
    - PATCH /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - 'created secret scanning custom pattern "internal-api-token-v2"'
    - 'DELETED undeclared secret scanning custom pattern "internal-api-token" (alerts resolved, not deleted)'
  converges: true

name: secret-scanning-patterns-check
description: >
  Check mode reports every custom-pattern divergence without writing: a
  per-field drift line for the changed regex, a missing declared pattern
  (apply would bulk-create it), and an undeclared live pattern that the
  wrapped "undeclared: delete" form turns into deletion drift. No mutation
  of any kind may reach the mock.
settings:
  secret_scanning_custom_patterns:
    undeclared: delete
    entries:
      - name: internal-api-token
        pattern: "int_[a-z0-9]{32}"
      - name: vendor-license-key
        pattern: "lic-[0-9]{6}"
live_state:
  secret_scanning_patterns:
    - id: 501
      name: internal-api-token
      slug: internal-api-token
      pattern: "int_[a-z0-9]{16}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 502
      name: retired-pattern
      slug: retired-pattern
      pattern: "old_[0-9]{4}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v2
inputs:
  mode: check
expect:
  exit_code: 1
  result: drift
  outcomes:
    secret_scanning_custom_patterns: drift
  never:
    - POST /repos/{repo}/secret-scanning/custom-patterns
    - PATCH /repos/{repo}/secret-scanning/custom-patterns
    - DELETE /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - "secret_scanning_custom_patterns[internal-api-token].pattern"
    - "secret_scanning_custom_patterns[vendor-license-key]: missing"
    - "secret_scanning_custom_patterns[retired-pattern]: undeclared"

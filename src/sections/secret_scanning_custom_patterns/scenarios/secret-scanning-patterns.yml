name: secret-scanning-patterns
description: >
  Apply exercises every custom-pattern operation at once: one bulk POST
  creates the missing pattern, a PATCH (carrying the live pattern's
  custom_pattern_version plus only the divergent field) fixes the drifted
  regex, and one bulk DELETE removes the pattern the file does not declare
  under the wrapped "undeclared: delete" form - the DELETE's body always
  carries post_delete_action "resolve_alerts", pinned by the section's unit
  test (the request log matches method and path only). The mock enforces
  the version check on both writes, so a stale-version reuse would answer
  412 and fail this run. The apply-idempotence proof then pins that a
  second apply issues ZERO writes (the section compares before writing).
settings:
  secret_scanning_custom_patterns:
    undeclared: delete
    entries:
      - name: internal-api-token
        pattern: "int_[a-z0-9]{32}"
        start_delimiter: '\b'
      - name: vendor-license-key
        pattern: "lic-[0-9]{6}"
        must_not_match:
          - example
live_state:
  secret_scanning_patterns:
    - id: 501
      name: internal-api-token
      slug: internal-api-token
      pattern: "int_[a-z0-9]{16}"
      start_delimiter: '\b'
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 502
      name: retired-pattern
      slug: retired-pattern
      pattern: "old_[0-9]{4}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v2
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    secret_scanning_custom_patterns: applied
  mutations:
    - POST /repos/{repo}/secret-scanning/custom-patterns
    - PATCH /repos/{repo}/secret-scanning/custom-patterns/501
    - DELETE /repos/{repo}/secret-scanning/custom-patterns
  requests_contain:
    - GET /repos/e2e-owner/e2e-repo/secret-scanning/custom-patterns?per_page=100&page=1
  stdout_contains:
    - 'DELETED undeclared secret scanning custom pattern "retired-pattern" (alerts resolved, not deleted)'
  apply_idempotent: true

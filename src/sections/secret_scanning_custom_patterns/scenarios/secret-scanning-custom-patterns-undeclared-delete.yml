name: secret-scanning-custom-patterns-undeclared-delete
description: >
  Under the wrapped "_undeclared: delete" form a live custom pattern the
  settings file does not declare is removed through the bulk DELETE (whose
  body resolves its alerts rather than deleting them); the declared pattern
  is already converged and untouched. Apply stays green, and the idempotence
  re-run issues zero writes.
settings:
  secret_scanning_custom_patterns:
    _undeclared: delete
    entries:
      - name: internal-api-token
        pattern: "int_[a-z0-9]{16}"
live_state:
  secret_scanning_patterns:
    - id: 501
      name: internal-api-token
      slug: internal-api-token
      pattern: "int_[a-z0-9]{16}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 502
      name: retired-pattern
      slug: retired-pattern
      pattern: "old_[0-9]{4}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v2
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    secret_scanning_custom_patterns: applied
  mutations:
    - DELETE /repos/{repo}/secret-scanning/custom-patterns
  never:
    - POST /repos/{repo}/secret-scanning/custom-patterns
    - PATCH /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - 'DELETED undeclared secret scanning custom pattern "retired-pattern" (alerts resolved, not deleted)'
  fixpoint: apply_idempotent

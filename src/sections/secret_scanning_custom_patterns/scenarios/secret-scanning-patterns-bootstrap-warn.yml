name: secret-scanning-patterns-bootstrap-warn
description: >
  The bootstrap shape for a repository whose secret scanning is off: under
  on-missing-permission warn the first apply enables scanning through the
  repository section's security_and_analysis passthrough and SKIPS the
  patterns section with a warning when its list 404s. The 404 is modeled
  here as a missing grant - on the wire it is IDENTICAL to "secret
  scanning is not enabled" (the mock does not model scanning enablement),
  so this pins the skip-and-proceed ordering; on real GitHub, once
  scanning is on, the next apply converges the patterns. Mirrors the
  troubleshooting guide's advice.
settings:
  repository:
    security_and_analysis:
      secret_scanning:
        status: enabled
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "int_[a-z0-9]{32}"
denial_style: fine_grained
token_permissions:
  secret_scanning_alerts: none
inputs:
  mode: apply
  on_missing_permission: warn
expect:
  exit_code: 0
  result: partial
  outcomes:
    repository: applied
    secret_scanning_custom_patterns: skipped
  mutations:
    - PATCH /repos/{repo}
  never:
    - POST /repos/{repo}/secret-scanning/custom-patterns

name: secret-scanning-patterns-bootstrap-fail
description: >
  Enabling secret scanning and declaring patterns cannot land in ONE apply
  under the default on-missing-permission fail: preflight probes every
  declared section read-only BEFORE any write, so the patterns list 404s
  and aborts the run before the repository section could enable scanning
  via security_and_analysis. The 404 is modeled here as a missing grant -
  on the wire it is IDENTICAL to "secret scanning is not enabled", which
  is the point of the shared denial hint - so this scenario pins the
  preflight ordering and the hint, not the feature toggle itself (the mock
  does not model scanning enablement). Nothing is written at all. The
  warn-policy bootstrap that DOES proceed is the sibling scenario.
settings:
  repository:
    security_and_analysis:
      secret_scanning:
        status: enabled
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "int_[a-z0-9]{32}"
denial_style: fine_grained
token_permissions:
  secret_scanning_alerts: none
inputs:
  mode: apply
  on_missing_permission: fail
expect:
  exit_code: 1
  result: failed
  mutations: []
  never:
    - PATCH /repos/{repo}
    - POST /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - "preflight"
    - secret scanning is not enabled

name: secret-scanning-patterns-uncompilable-regex-rejected
description: >
  A regex field no dialect parses (an unterminated character class here,
  and a dangling quantifier in a must_match entry) is refused when the
  settings file is parsed, naming every offending field, before any API
  contact. Without this the run reaches the bulk create and reads a 422
  whose hint only guesses at the cause.
settings:
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "([a-z"
      must_match:
        - "[0-9]"
        - "*prod"
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - "secret_scanning_custom_patterns[0].pattern: cannot be compiled as a regular expression"
    - "secret_scanning_custom_patterns[0].must_match[1]: cannot be compiled as a regular expression"
    - Hyperscan

name: secret-scanning-patterns-read-denied
description: >
  A fine-grained token without the "Secret scanning alerts" grant answers
  the list read with 404, which the section's throwFor path classifies as
  a permission denial ("denied" semantics) - check mode fails before any
  other call, and the advice names the exact grant plus the ambiguity note
  (a 404 can also mean secret scanning is not enabled).
settings:
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "int_[a-z0-9]{32}"
inputs:
  mode: check
denial_style: fine_grained
token_permissions:
  secret_scanning_alerts: none
expect:
  exit_code: 1
  result: failed
  outcomes:
    secret_scanning_custom_patterns: failed
  stdout_contains:
    - '"Secret scanning alerts"'
    - secret scanning is not enabled

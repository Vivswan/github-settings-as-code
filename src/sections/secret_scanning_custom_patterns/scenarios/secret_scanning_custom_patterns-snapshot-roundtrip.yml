name: secret_scanning_custom_patterns-snapshot-roundtrip
description: "mode: snapshot reads the live secret_scanning_custom_patterns back into snapshot.yml and writes nothing to GitHub. A published custom pattern reads back as its declarable fields; the server-assigned id, slug, version, and state fall away. The written file, fed back to a check run against the same state, reads clean."
settings: {}
live_state:
  secret_scanning_patterns:
    - id: 1
      name: acme-token
      slug: acme-token
      pattern: acme_[a-z0-9]{32}
      start_delimiter: \A|[^0-9A-Za-z]
      must_match:
        - "[a-z]"
      must_not_match: null
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: secret_scanning_custom_patterns
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    secret_scanning_custom_patterns: snapshot
  snapshot:
    secret_scanning_custom_patterns:
      _undeclared: keep
      entries:
        - name: acme-token
          pattern: acme_[a-z0-9]{32}
          start_delimiter: \A|[^0-9A-Za-z]
          must_match:
            - "[a-z]"
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

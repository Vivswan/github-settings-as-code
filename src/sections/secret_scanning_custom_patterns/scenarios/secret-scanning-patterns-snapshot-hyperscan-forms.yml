name: secret-scanning-patterns-snapshot-hyperscan-forms
description: >-
  mode: snapshot reads a live pattern spelled in the PCRE-only forms Hyperscan accepts (a
  Python-style named group, an inline comment, a braced hex escape) back verbatim, so a value
  GitHub holds never fails the snapshot. A live pattern PCRE refuses too (an unbalanced group,
  which GitHub would not hold but the mock can) is left out with a note, and the rest is written.
settings: {}
live_state:
  secret_scanning_patterns:
    - id: 1
      name: vendor-key
      slug: vendor-key
      pattern: (?P<token>key_[A-Z0-9]{32})
      start_delimiter: (?#word edge)\A|[^0-9A-Za-z]
      must_match:
        - "[\\x{41}-\\x{5A}]"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 2
      name: odd-one
      slug: odd-one
      pattern: (key_[A-Z0-9]{32}
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: secret_scanning_custom_patterns
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    secret_scanning_custom_patterns: snapshot
  snapshot:
    secret_scanning_custom_patterns:
      _undeclared: keep
      entries:
        - name: vendor-key
          pattern: (?P<token>key_[A-Z0-9]{32})
          start_delimiter: (?#word edge)\A|[^0-9A-Za-z]
          must_match:
            - "[\\x{41}-\\x{5A}]"
  summary_contains:
    - "secret_scanning_custom_patterns[odd-one]: left out of the snapshot - its pattern (Invalid regular expression:"
    - cannot be verified as a regular expression by this tool; the pattern stays live and undeclared under the keep default
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

sections_table:
  endpoints: >-
    secret-scanning custom patterns: paginated list + bulk POST + PATCH by id + bulk DELETE
  notes: >-
    matched by name (immutable upstream); `state` and `push_protection_enabled` are not declarable;
    deletes always resolve alerts
coverage:
  - area: >-
      [Secret scanning custom
      patterns](https://docs.github.com/en/rest/secret-scanning/custom-patterns)
    endpoints: [list, create, update, remove]
    notes:
      - >-
        Repository-level patterns. GET /repos/{owner}/{repo}/secret-scanning/custom-patterns
        (paginated), bulk POST on the same path ({patterns: [...]}), PATCH
        .../custom-patterns/{pattern_id}, and bulk DELETE on the collection path (ids in the request
        body).
      - >-
        Patterns are matched by name; the name is immutable upstream (the PATCH takes no name field),
        so a rename creates the new name and the old pattern follows the undeclared policy - deleted
        under `_undeclared: delete`, kept and noted under the default keep.
      - >-
        The declarable surface is name, pattern, start_delimiter, end_delimiter, and the
        must_match/must_not_match regex lists; `state` and `push_protection_enabled` are READABLE in
        the GET but NOT writable through these endpoints (no field in the POST/PATCH bodies, no
        sub-endpoint), so they cannot be declared and the validator says so.
      - >-
        CAVEAT (state is invisible to drift): an UNPUBLISHED live pattern whose fields match the
        declaration reads as converged even though it is not enforcing - no publish endpoint exists,
        so publishing stays a UI action, and that includes a pattern this action just created.
      - >-
        GitHub does not document the state a bulk-created pattern lands in, so verify the first apply
        in the UI.
      - >-
        A delimiter, once set, cannot be cleared back to GitHub's default through the PATCH (it
        updates provided fields only); delete and redeclare the pattern without the field instead.
      - >-
        Every regex field passes a syntax check at parse or the file is refused naming the field,
        before any pattern is read or written.
      - >-
        The check translates the PCRE-only forms Hyperscan accepts (`(?P<name>`, `(?#comment)`,
        `\x{HH}`, inline modifiers such as `(?i)`, atomic groups, possessive quantifiers, `\Q...\E`,
        POSIX classes, the start-of-pattern control verbs `(*UTF8)`, `(*UTF)` and `(*UCP)`) and
        compiles the result as a flagless JavaScript RegExp.
      - >-
        It refuses what PCRE syntax refuses (an unbalanced group or class, a dangling quantifier, a
        quantifier on an anchor, a trailing backslash, a range out of order, a group name declared
        twice) and the `(?` openings it does not know, such as the subroutine call `(?1)`, which
        Hyperscan refuses as well.
      - >-
        It cannot see what Hyperscan alone refuses (lookbehind, backreferences, the option modifiers
        GitHub documents as unsupported), and it leaves an extended-mode pattern (`(?x)`) unchecked,
        so GitHub can still refuse an expression at apply.
      - >-
        A live pattern the check cannot verify is left out of a snapshot with a note naming it, never
        a failed snapshot.
      - >-
        Writes ride optimistic concurrency whenever GitHub supplies a version: the list GET carries
        each pattern's custom_pattern_version, the PATCH/DELETE send it back, and a 412 means the
        pattern changed mid-run (re-run the workflow); a version-less pattern (the field is optional
        and nullable upstream) writes without the check, as the API allows.
      - >-
        Undeclared patterns are KEPT by default (removing a pattern disposes of its alerts, so it
        stays a human opt-in; `_undeclared: delete` opts in), and every delete this action issues
        sends post_delete_action: "resolve_alerts" - never upstream's alert-deleting default - so the
        audit trail survives.
      - >-
        Needs secret scanning enabled (GitHub Advanced Security on private repositories); a 404 can
        mean that rather than a missing grant.
      - >-
        Snapshot reads the live patterns back (name, pattern, delimiters, must_match lists) under the
        keep default.
schema:
  SettingsFile.secret_scanning_custom_patterns: >-
    Repository-level secret scanning custom patterns, matched by name. The name is immutable
    upstream (the update PATCH takes no name field), so a renamed entry is applied as a create of
    the new name - plus, under `_undeclared: delete`, deletion of the old one; under the default keep
    policy the old pattern stays live and is surfaced as a note. Undeclared patterns are kept by
    default: removing a pattern disposes of its alerts, so deletion stays a human opt-in (the
    wrapped form can set `_undeclared: delete`). When this action deletes a pattern it always asks
    GitHub to RESOLVE the pattern's alerts rather than delete them, keeping the audit trail.
  SecretScanningPatternConfig: >-
    One secret scanning custom pattern, matched by exact name. Only the fields below are accepted:
    `state` and `push_protection_enabled` are readable but NOT writable through the custom-pattern
    endpoints, so they cannot be declared. A delimiter, once set, cannot be cleared back to GitHub's
    default through the update PATCH (the endpoint updates provided fields only); remove the pattern
    and redeclare it without the field instead.
  SecretScanningPatternConfig.name: >-
    The pattern name, the natural key; immutable upstream, so a rename creates the new name (the old
    one follows the undeclared policy).
  SecretScanningPatternConfig.pattern: >-
    The regular expression the secret format must match. Like every regex field here it passes a
    syntax check at parse, or the file is refused naming the field: the PCRE-only forms Hyperscan
    accepts (`(?P<name>`, `(?#comment)`, `\x{HH}`, `(?i)`, atomic and possessive forms, `\Q...\E`, a
    leading `(*UTF8)`, `(*UTF)` or `(*UCP)`) are translated, then the result must compile as a
    flagless JavaScript RegExp. GitHub can still
    refuse at apply what Hyperscan alone refuses (lookbehind, backreferences, option modifiers).
  SecretScanningPatternConfig.start_delimiter: >-
    Regular expression for the characters that must come before the secret; it passes the syntax
    check, like `pattern`. An empty string is rejected: a delimiter cannot be cleared through the update call -
    remove the pattern and redeclare it without the field instead.
  SecretScanningPatternConfig.end_delimiter: >-
    Regular expression for the characters that must come after the secret; it passes the syntax
    check, like `pattern`. An empty string is rejected, like start_delimiter.
  SecretScanningPatternConfig.must_match: >-
    Additional regular expressions a match must also satisfy, compared in order; each passes the
    syntax check, like `pattern`.
  SecretScanningPatternConfig.must_not_match: >-
    Regular expressions a match must NOT satisfy, compared in order; each passes the syntax check,
    like `pattern`.

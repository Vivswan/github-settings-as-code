name: milestones-snapshot-roundtrip
description: "mode: snapshot reads the live milestones back into snapshot.yml and writes nothing to GitHub. Open and closed milestones read back by title, description, and state; a null description is omitted. The written file, fed back to a check run against the same state, reads clean."
settings: {}
live_state:
  milestones:
    - id: 1
      number: 1
      title: v1.0
      state: open
      description: First stable release.
    - id: 2
      number: 2
      title: v2.0
      state: closed
      description: null
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: milestones
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    milestones: snapshot
  snapshot:
    milestones:
      _undeclared: keep
      entries:
        - title: v1.0
          description: First stable release.
          state: open
        - title: v2.0
          state: closed
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

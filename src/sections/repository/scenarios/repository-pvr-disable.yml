name: repository-pvr-disable
description: >
  Declaring enable_private_vulnerability_reporting false against a repo where it
  is live enabled issues the disabling DELETE and reports the change. The
  DELETE's tolerated 404/422 ("not applicable, so already off") is not
  reachable through this mock, which answers the DELETE 204 on an enabled
  feature; the section's unit test pins that tolerance instead.
settings:
  repository:
    enable_private_vulnerability_reporting: false
live_state:
  repo:
    private_vulnerability_reporting_enabled: true
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    repository: applied
  mutations:
    - DELETE /repos/{repo}/private-vulnerability-reporting
  summary_contains:
    - private vulnerability reporting
  converges: true

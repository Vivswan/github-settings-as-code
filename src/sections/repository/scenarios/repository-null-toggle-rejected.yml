name: repository-null-toggle-rejected
description: >
  A repository toggle declared as null (has_wiki with no value) is refused when the
  file is parsed, before any API contact: the PATCH takes true or false and answers
  422 to null. The message names the two legal values.
settings:
  repository:
    has_issues: true
    has_wiki: null
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - repository.has_wiki
    - a toggle has no empty state; write true or false

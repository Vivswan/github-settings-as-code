sections_table:
  endpoints: >-
    PATCH repo, PUT topics, vulnerability-alerts, automated-security-fixes,
    private-vulnerability-reporting, lfs, immutable-releases, GraphQL RepositoryFeatures +
    UpdateRepositoryFeatures
  notes: >-
    Probot repository payload plus `enable_*` feature toggles; `topics` as string or list;
    `enable_sponsorships` and `issue_creation_policy` (`all`/`collaborators_only`) route through
    GraphQL - REST has no surface for them; declared fields only, undeclared siblings untouched
coverage:
  - area: >-
      [Repository core settings](https://docs.github.com/en/rest/repos/repos) (name, description,
      homepage, visibility/private, has_issues, has_wiki, has_projects, has_discussions,
      merge-strategy toggles, squash/merge commit title+message, delete_branch_on_merge,
      allow_update_branch, allow_auto_merge, web_commit_signoff_required, is_template, archived,
      default_branch)
    notes: >-
      PATCH /repos/{owner}/{repo} passthrough: documented fields are typed (toggles true or false;
      description and homepage also null, the API's clear); a field GitHub adds later works day one.
      GET-only fields, a commit message without its title, and illegal squash pairs are refused at
      parse: each would drift or 422 every run. Check diffs the declared keys against GET /repos;
      snapshot reads back the PATCH fields, topics, toggles, and GraphQL keys (docs/operate/snapshot.md).
  - area: >-
      [security_and_analysis](https://docs.github.com/en/rest/repos/repos) (GitHub Advanced
      Security, secret scanning, push protection, delegated bypass, validity checks)
    notes: >-
      Nested in the same PATCH, closed to the sub-keys the PATCH accepts (GitHub 422s any other):
      each feature is {status: enabled/disabled}, delegated-bypass reviewers are {reviewer_id,
      reviewer_type: TEAM/ROLE, mode: ALWAYS/EXEMPT}, and the GET-only dependabot_security_updates
      points at enable_automated_security_fixes. secret_scanning_validity_checks nests here too
      (documented in the GHEC flavor of the spec). The GET echoes all of it, so check verifies it.
  - area: "[Topics](https://docs.github.com/en/rest/repos/repos)"
    keys: topics key
    notes: >-
      PUT /repos/{owner}/{repo}/topics, with string-to-list splitting (normalizeTopics), lowercasing,
      and order-insensitive compare in check mode. GitHub's topic rule (1 to 50 letters, digits, and
      hyphens, starting with a letter or digit; at most 20 distinct topics) is checked at parse on
      every entry, empty ones included, and the grammar is published in the settings schema while the
      cap is the runtime's alone. `topics: []` is the one spelling of the wholesale clear.
  - area: >-
      [Dependabot alerts](https://docs.github.com/en/rest/repos/repos) (vulnerability alerts)
    keys: enable_vulnerability_alerts
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/vulnerability-alerts; check mode probes GET and treats 404 as
      disabled. GitHub couples the dependency graph to this endpoint: the PUT/DELETE also
      enable/disable the graph as a side effect (the graph toggle itself has no API of its own; see
      No public API).
  - area: >-
      [Dependabot security updates](https://docs.github.com/en/rest/repos/repos) (automated security
      fixes)
    keys: enable_automated_security_fixes
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/automated-security-fixes; check handles both 204-empty and
      {enabled} body shapes.
  - area: "[Private vulnerability reporting](https://docs.github.com/en/rest/repos/repos)"
    keys: enable_private_vulnerability_reporting
    notes: >-
      PUT/DELETE /repos/{owner}/{repo}/private-vulnerability-reporting; check reads the {enabled}
      body from GET. Repositories where the feature does not apply (observed: private repos) answer
      404 or 422, which check treats as "not enabled" and disable treats as already done.
  - area: "[Git LFS enable/disable](https://docs.github.com/en/rest/repos/lfs)"
    keys: enable_git_lfs
    notes: >-
      PUT /repos/{owner}/{repo}/lfs (202) or DELETE (204). GitHub exposes NO endpoint to read the
      state back, so check mode emits a cannot-verify note instead of drift, apply re-asserts the
      declared state on every run, and the apply-mode preflight cannot probe it (a denied LFS write
      surfaces only after the section's other writes landed). A 403 can mean LFS is disabled
      account-wide or for the root of the repository network, or a credential without billing
      access, rather than a missing token grant; the error says so. GitHub's OpenAPI descriptor does
      not document this endpoint (real per the REST docs), so the e2e validator carries it in
      UNDOCUMENTED_ROUTES.
  - area: "[Immutable releases](https://docs.github.com/en/rest/repos/repos)"
    keys: enable_immutable_releases
    notes: >-
      GET/PUT/DELETE /repos/{owner}/{repo}/immutable-releases; check mode probes GET and treats 404
      as disabled. CAVEAT: enforced_by_owner in the GET body is read-only owner-level enforcement -
      both writes then answer 409, which apply surfaces as a note rather than a failure or a false
      change line, and check mode still reports a mismatched declaration as drift while saying apply
      cannot change it from the repository.
  - area: >-
      [Sponsor button](https://docs.github.com/en/graphql/reference/mutations#updaterepository) (the
      "Display a Sponsor button" checkbox under Settings > General > Features)
    keys: enable_sponsorships
    notes: >-
      GraphQL only: read via Repository.hasSponsorshipsEnabled, written via the updateRepository
      mutation's hasSponsorshipsEnabled input field - the PATCH /repos body carries no such field
      and no REST GET returns one. One RepositoryFeatures query serves this key,
      issue_creation_policy, and the node id the UpdateRepositoryFeatures mutation addresses; apply
      compares first, mutates only on divergence, and verifies the mutation's echoed state. A stored
      repository boolean independent of FUNDING.yml (repo content, out of scope).
  - area: >-
      [Issue creation
      policy](https://docs.github.com/en/graphql/reference/input-objects#updaterepositoryinput) (the
      Issues "Creation allowed by" control: everyone vs collaborators only)
    keys: issue_creation_policy
    notes: >-
      GraphQL only, sharing the Sponsor button's RepositoryFeatures query and updateRepository
      mutation: declared lowercase ("all"/"collaborators_only") and mapped to GitHub's
      ALL/COLLABORATORS_ONLY IssueCreationPolicy enum at the boundary. Live-probed before building:
      the REST PATCH ACCEPTS an issue_creation_policy field and silently ignores it (HTTP 200, no
      echo, no effect), and no REST GET carries it (the GET has pull_request_creation_policy but not
      the issue twin) - so GraphQL is the only read and write surface and the passthrough cannot
      absorb the key. A persistent two-value enum with full read-back, so check mode diffs it
      exactly.
  - area: "[Forking policy](https://docs.github.com/en/rest/repos/repos)"
    keys: allow_forking, fork-related PATCH fields
    notes: >-
      allow_forking and any other fork-policy fields on the repo object ride the PATCH passthrough.
      (Org-side 'members can fork' policy is org-scoped, out of scope.)
schema:
  SettingsFile.repository: >-
    Repo fields sent verbatim to PATCH /repos/{r}, plus the special keys RepositoryConfig documents.
  RepositoryConfig: >-
    The `repository:` section, where only declared keys are ever applied or compared. A field not
    documented here is sent verbatim to PATCH /repos/{r}, so a field GitHub adds later works
    unchanged; the keys below carry GitHub's types (a toggle is true or false, never null or quoted)
    or route to their own endpoints. GET-only fields (ids, urls, counts, has_downloads, has_pages,
    custom_properties) are refused, since they would drift on every run.
  RepositoryConfig.topics: >-
    Repository topics, replaced wholesale via PUT /repos/{r}/topics; a comma-separated string or a
    list, lowercased and deduped. Each topic is 1 to 50 letters, digits, and hyphens, starting with a
    letter or digit (uppercase is lowercased on the wire); at most 20 distinct topics. An empty entry
    is refused; an empty list removes every topic.
  RepositoryConfig.description: >-
    A short description of the repository; null clears it.
  RepositoryConfig.homepage: >-
    A URL with more information about the repository; null clears it.
  RepositoryConfig.visibility: >-
    public, private, or internal (Enterprise); a free string, since the spec omits internal.
  RepositoryConfig.default_branch: The default branch; an existing branch name.
  RepositoryConfig.pull_request_creation_policy: >-
    Who may create pull requests: "all" (everyone) or "collaborators_only".
  RepositoryConfig.private: Make the repository private (true) or public (false).
  RepositoryConfig.has_issues: Enable issues (true) or disable them (false).
  RepositoryConfig.has_projects: >-
    Enable projects (true) or disable them (false); an organization that disabled repository projects rejects true.
  RepositoryConfig.has_wiki: Enable the wiki (true) or disable it (false).
  RepositoryConfig.has_discussions: >-
    Enable discussions (true) or disable them (false); accepted by the PATCH though the descriptor omits it.
  RepositoryConfig.has_pull_requests: Allow pull requests (true) or prevent them (false).
  RepositoryConfig.is_template: Offer the repository as a template (true) or not (false).
  RepositoryConfig.allow_squash_merge: Allow squash-merging pull requests (true) or not (false).
  RepositoryConfig.allow_merge_commit: Allow merge commits on pull requests (true) or not (false).
  RepositoryConfig.allow_rebase_merge: Allow rebase-merging pull requests (true) or not (false).
  RepositoryConfig.allow_auto_merge: Allow auto-merge on pull requests (true) or not (false).
  RepositoryConfig.delete_branch_on_merge: Delete head branches when pull requests merge (true) or keep them (false).
  RepositoryConfig.allow_update_branch: Offer to update a pull request branch behind its base (true) or not (false).
  RepositoryConfig.use_squash_pr_title_as_default: >-
    Deprecated by GitHub in favor of squash_merge_commit_title: use the PR title as the squash commit title (true) or not (false).
  RepositoryConfig.archived: Archive the repository (true) or unarchive it (false).
  RepositoryConfig.allow_forking: Allow private forks (true) or not (false).
  RepositoryConfig.web_commit_signoff_required: Require contributors to sign off on web-based commits (true) or not (false).
  RepositoryConfig.security_and_analysis: >-
    The security_and_analysis object of PATCH /repos/{r}: GitHub Advanced Security, secret scanning,
    push protection, and the other nested feature toggles.
  RepositoryConfig.squash_merge_commit_title: >-
    The default title of a squash merge commit: PR_TITLE or COMMIT_OR_PR_TITLE. Required beside
    squash_merge_commit_message; legal pairs are PR_TITLE with PR_BODY, BLANK, or COMMIT_MESSAGES,
    and COMMIT_OR_PR_TITLE with COMMIT_MESSAGES.
  RepositoryConfig.squash_merge_commit_message: >-
    The default message of a squash merge commit: PR_BODY, BLANK, or COMMIT_MESSAGES. Needs
    squash_merge_commit_title declared beside it, in one of the legal pairs.
  RepositoryConfig.merge_commit_title: >-
    The default title of a merge commit: PR_TITLE or MERGE_MESSAGE. Required beside
    merge_commit_message.
  RepositoryConfig.merge_commit_message: >-
    The default message of a merge commit: PR_BODY, PR_TITLE, or BLANK. Needs merge_commit_title
    declared beside it.
  SecurityAndAnalysisConfig: >-
    The nested security_and_analysis object, closed to the sub-keys the PATCH accepts (GitHub rejects
    any other with a 422). Each feature is {status: enabled/disabled}. dependabot_security_updates
    is not one of them: declare enable_automated_security_fixes instead.
  SecurityAndAnalysisConfig.advanced_security: GitHub Advanced Security.
  SecurityAndAnalysisConfig.code_security: GitHub Code Security.
  SecurityAndAnalysisConfig.secret_scanning: Secret scanning.
  SecurityAndAnalysisConfig.secret_scanning_push_protection: Secret scanning push protection.
  SecurityAndAnalysisConfig.secret_scanning_ai_detection: AI detection of generic secrets.
  SecurityAndAnalysisConfig.secret_scanning_non_provider_patterns: Non-provider secret patterns.
  SecurityAndAnalysisConfig.secret_scanning_delegated_alert_dismissal: >-
    Delegated dismissal of secret scanning alerts.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass: >-
    Delegated bypass of push protection; the reviewers live in
    secret_scanning_delegated_bypass_options.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass_options: >-
    Who reviews push protection bypass requests; honored only while
    secret_scanning_delegated_bypass is enabled.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass_options.reviewers: >-
    The bypass reviewers; left out, the existing set is unchanged.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass_options.reviewers[].reviewer_id: >-
    The id of the team or role selected as a reviewer.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass_options.reviewers[].reviewer_type: >-
    TEAM or ROLE.
  SecurityAndAnalysisConfig.secret_scanning_delegated_bypass_options.reviewers[].mode: >-
    ALWAYS (the default: every bypass needs review) or EXEMPT (this reviewer's own pushes skip it).
  SecurityAndAnalysisConfig.secret_scanning_validity_checks: >-
    Validity checks for detected secrets (documented in the GHEC flavor of the spec).
  SecurityFeatureToggle: One security_and_analysis feature.
  SecurityFeatureToggle.status: '"enabled" or "disabled".'
  RepositoryConfig.enable_vulnerability_alerts: >-
    Dependabot alerts, via PUT/DELETE /repos/{r}/vulnerability-alerts. On read, 404 means off.
  RepositoryConfig.enable_automated_security_fixes: >-
    Dependabot security updates, via PUT/DELETE /repos/{r}/automated-security-fixes. On read, 404
    means off, as does a 200 body with enabled: false.
  RepositoryConfig.enable_private_vulnerability_reporting: >-
    Private vulnerability reporting, via PUT/DELETE /repos/{r}/private-vulnerability-reporting.
    Repositories where the feature does not apply (observed: private repos) read as off.
  RepositoryConfig.enable_git_lfs: >-
    Git LFS, via PUT/DELETE /repos/{r}/lfs. Write-only upstream: check mode cannot verify it, and
    apply re-asserts it on every run.
  RepositoryConfig.enable_immutable_releases: >-
    Immutable releases, via PUT/DELETE /repos/{r}/immutable-releases. On read, 404 means off. When
    the repository owner enforces immutable releases (enforced_by_owner in the GET body), writes
    answer 409 and the setting cannot be changed from the repository; apply reports that as a note
    instead of a change.
  RepositoryConfig.enable_sponsorships: >-
    Display a Sponsor button on the repository, via the GraphQL updateRepository mutation
    (hasSponsorshipsEnabled) - GraphQL is the setting's only read and write surface (the REST repo
    PATCH and GET carry no such field). A stored repository toggle independent of any FUNDING.yml
    content.
  RepositoryConfig.issue_creation_policy: >-
    Who may create issues: "all" (everyone) or "collaborators_only", mapped to GitHub's
    ALL/COLLABORATORS_ONLY GraphQL enum at the API boundary. GraphQL-only upstream
    (Repository.issueCreationPolicy and the updateRepository mutation): the REST repo PATCH accepts
    an issue_creation_policy field and silently ignores it, and no REST GET returns it.
  RepositoryConfig.*: Everything else passes through to PATCH /repos/{r} verbatim.

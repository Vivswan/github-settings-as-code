name: agents-secrets-undeclared-keep-note
description: >
  The section's keep default: a live Copilot agents secret the plain-array
  form does not declare is KEPT and surfaced as a note naming the
  "_undeclared: delete" knob that would remove it. The declared secret is
  re-sealed and re-written as on every run, nothing is deleted, and a check
  rerun converges (the kept secret is a note, not drift).
settings:
  agents_secrets:
    - name: AGENT_TOKEN
      value: $AGENT_TOKEN
env:
  AGENT_TOKEN: sealed-agent-plaintext-77dd
inputs:
  mode: apply
live_state:
  agents_secrets:
    - name: AGENT_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_AGENT_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    agents_secrets: applied
  mutations:
    - "PUT /repos/{repo}/agents/secrets/AGENT_TOKEN"
  never:
    - "DELETE /repos/{repo}/agents/secrets"
    - "PUT /repos/{repo}/agents/secrets/STALE_AGENT_KEY"
  stdout_contains:
    - 'kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
    - STALE_AGENT_KEY
  leaks_nowhere:
    - sealed-agent-plaintext-77dd
  fixpoint: converges

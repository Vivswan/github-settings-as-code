name: agents-secrets-name-rejected
description: >
  A Copilot agents secret carrying the reserved GITHUB_ prefix fails when the
  settings file is parsed, before any API contact, with the entry's path and
  GitHub's rule - not as a 422 from the sealed PUT mid-apply. The wrapped
  {_undeclared, entries} form keeps the entry's path in the message.
settings:
  agents_secrets:
    _undeclared: delete
    entries:
      - name: MODEL_KEY
        value: $MODEL_KEY
      - name: GITHUB_AGENT_KEY
        value: $AGENT_KEY
env:
  MODEL_KEY: sealed-model-plaintext-5d6e
  AGENT_KEY: sealed-agent-plaintext-7a8b
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'agents_secrets.entries[1].name: the secret name "GITHUB_AGENT_KEY" starts with the reserved GITHUB_ prefix'
  leaks_nowhere:
    - sealed-model-plaintext-5d6e
    - sealed-agent-plaintext-7a8b

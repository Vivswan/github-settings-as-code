name: agents-secrets-apply-converges
description: >
  Apply seals and writes every declared Copilot agents secret - creating a
  missing one (PUT answers 201) and re-writing an existing one (204),
  matching names case-insensitively - while an undeclared live secret is
  kept (the default) with a note. The resolved plaintexts must reach no
  public surface, a second apply must be a fixpoint (same digests and
  created_at; updated_at moves on every write and must recur, since declared
  secrets are re-PUT each run), and the check re-run must read the applied
  state as clean from existence alone.
settings:
  agents_secrets:
    - name: AGENT_TOKEN
      value: $AGENT_TOKEN
    - name: mcp_api_key
      value: $MCP_API_KEY
env:
  AGENT_TOKEN: sealed-agent-plaintext-4b8e
  MCP_API_KEY: sealed-mcp-plaintext-9d21
inputs:
  mode: apply
live_state:
  agents_secrets:
    - name: MCP_API_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: LEGACY_AGENT_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    agents_secrets: applied
  mutations:
    - "PUT /repos/{repo}/agents/secrets/AGENT_TOKEN"
    - "PUT /repos/{repo}/agents/secrets/MCP_API_KEY"
  never:
    - "DELETE /repos/{repo}/agents/secrets"
  stdout_contains:
    - 'created secret "AGENT_TOKEN"'
    - 'updated secret "MCP_API_KEY"'
    - Copilot agents secret "LEGACY_AGENT_KEY" exists on the repo but is not declared
  leaks_nowhere:
    - sealed-agent-plaintext-4b8e
    - sealed-mcp-plaintext-9d21
  apply_idempotent: true

schema:
  "{ActionsSecretConfig,AgentsSecretConfig,CodespacesSecretConfig,DependabotSecretConfig,EnvironmentSecretConfig}.name": >-
    The secret name, the natural key; compared case-insensitively and written uppercase.
  "{ActionsSecretConfig,AgentsSecretConfig,CodespacesSecretConfig,DependabotSecretConfig,EnvironmentSecretConfig}.value": >-
    A whole-value `$NAME` reference to an environment variable holding the secret - never a literal
    (settings files are committed plaintext). Resolved from the action step's env at run time and
    sealed with a libsodium sealed box before upload; GitHub cannot return the value, so check mode
    verifies existence only and apply re-seals it on every run.
  UndeclaredPolicy: What apply does to live resources the settings file does not declare.
  UndeclaredPolicyList<*>: >-
    The wrapped form of a list, overriding what happens to live resources the file does not declare.
    The plain array form keeps the list's own default policy (for a top-level section that is the
    section default, and a multi-repo defaults file can set it; a nested list such as
    environments[].variables has its own fixed default and never inherits one); this wrapper can set
    it explicitly, and with `_undeclared` omitted it behaves exactly like the plain array. The
    wrapper is this action's own vocabulary (nothing here passes through to GitHub), so its keys are
    strict: anything besides `_undeclared`, `entries`, and `_layering` (the directives wear the
    underscore; a nested list's wrapper does not take `_layering`) is rejected upfront as a typo.
  UndeclaredPolicyList<*>._undeclared: >-
    What apply does to live resources `entries` does not declare: "delete" removes them, "keep"
    leaves them alone and surfaces each as a note. Omitted, the list's own default applies.
  UndeclaredPolicyList<*>.entries: The declared entries, exactly as the plain array form lists them.
  UndeclaredPolicyList<*>._layering: >-
    A merge-time directive: how this section combines with the layers BELOW it in a layered merge.
    "replace" lets this layer's list win. "merge" unions the entries by identity and is accepted
    only on a section whose entries have one (labels by name, rulesets by name with their rules by
    type); on any other section it is refused, so declare "replace" or omit the key. Omitted, the
    run's layering applies. It has no effect on a single document, the merged document never
    carries it, and a list nested inside a section entry does not take it (a higher layer replaces
    such a list wholesale).

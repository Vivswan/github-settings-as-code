schema:
  "{ActionsSecretConfig,AgentsSecretConfig,CodespacesSecretConfig,DependabotSecretConfig,EnvironmentSecretConfig}.name": >-
    The secret name, the natural key; compared case-insensitively and written uppercase. GitHub's
    naming rule is checked when the file is parsed, before any API call: ASCII letters, digits, and
    underscores only, not starting with a digit, and not starting with the reserved `GITHUB_` prefix
    in any case (`github_token` is the reserved `GITHUB_TOKEN` once uppercased).
  "{ActionsSecretConfig,AgentsSecretConfig,CodespacesSecretConfig,DependabotSecretConfig,EnvironmentSecretConfig}.value": >-
    A whole-value `$NAME` reference to an environment variable holding the secret - never a literal
    (settings files are committed plaintext). Resolved from the action step's env at run time and
    sealed client-side into the sealed box GitHub's secrets API expects (libsodium's
    crypto_box_seal format) before upload; GitHub cannot return the value, so check mode verifies
    existence only and apply re-seals it on every run.
  UndeclaredPolicy: What apply does to live resources the settings file does not declare.
  UndeclaredPolicyList<*>: >-
    The wrapped form of a list, overriding what happens to live resources the file does not declare.
    The plain array form keeps the list's own default policy (for a top-level section that is the
    section default, and a multi-repo defaults file can set it; a nested list such as
    environments[].variables has its own fixed default and never inherits one); this wrapper can set
    it explicitly, and with `_undeclared` omitted it behaves exactly like the plain array. The
    wrapper is this action's own vocabulary (nothing here passes through to GitHub), so its keys are
    strict: anything besides `_undeclared`, `entries`, and `_layering` (the directives wear the
    underscore; a nested list's wrapper does not take `_layering`) is rejected upfront as a typo.
  UndeclaredPolicyList<*>._undeclared: >-
    What apply does to live resources `entries` does not declare: "delete" removes them, "keep"
    leaves them alone and surfaces each as a note. Omitted, the list's own default applies.
  UndeclaredPolicyList<*>.entries: The declared entries, exactly as the plain array form lists them.
  LayeredList<*>: >-
    The wrapped form of a list section that applies no undeclared policy (environments, branches,
    workflows): the plain array beside `{_layering, entries}`. The wrapper exists for the render
    directive alone, so the rendered document always holds the plain array, and with `_layering`
    omitted it behaves exactly like the plain array. Its keys are strict: anything besides
    `_layering` and `entries` (there is no `_undeclared` here, since the section keeps every live
    resource it does not declare) is rejected upfront as a typo.
  LayeredList<*>.entries: The declared entries, exactly as the plain array form lists them.
  LayeredList<*>._layering: >-
    A render-time directive: how this section combines with the layers BELOW it in a layered merge,
    by the section's key (an environment's name, a branch name or pattern, a workflow path).
    "replace" lets this layer's list win wholesale; "shallow" unions the entries by key and swaps a
    same-key entry for this layer's; "deep" unions by key and merges a same-key pair field by field,
    the entry's nested lists (an environment's variables, secrets, branch policies, protection
    rules, and reviewers, each by its own key) unioning the same way. Omitted, the file's
    `_layering` applies, else the run's layering. It has no effect on a single document, and the
    rendered document never carries it.
  UndeclaredPolicyList<*>._layering: >-
    A render-time directive: how this section combines with the layers BELOW it in a layered merge,
    by the section's key (a label's name, a secret's name, a webhook's URL, ...). "replace" lets
    this layer's list win wholesale; "shallow" unions the entries by key and swaps a same-key entry
    for this layer's; "deep" unions by key and merges a same-key pair field by field, a nested keyed
    list (a ruleset's rules, by type) unioning the same way. To clear a list, write "replace" with
    an empty list: under "shallow" and "deep" an empty list adds nothing. Omitted, the file's
    `_layering` applies, else the run's layering. It has no effect on a single document, the
    rendered document never carries it, and a list nested inside a section entry does not take it.

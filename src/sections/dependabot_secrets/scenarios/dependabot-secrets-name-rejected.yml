name: dependabot-secrets-name-rejected
description: >
  A Dependabot secret name starting with a digit fails when the settings file
  is parsed, before any API contact, with the entry's path and GitHub's rule -
  not as a 422 from the sealed PUT mid-apply.
settings:
  dependabot_secrets:
    - name: 2_REGISTRY_TOKEN
      value: $REGISTRY_TOKEN
env:
  REGISTRY_TOKEN: sealed-registry-plaintext-4b1c
inputs:
  mode: check
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'dependabot_secrets[0].name: the secret name "2_REGISTRY_TOKEN" starts with a digit'
  leaks_nowhere:
    - sealed-registry-plaintext-4b1c

name: dependabot-secrets-undeclared-delete
description: >
  The wrapped `undeclared: delete` form deletes a live Dependabot secret the
  file does not declare (the values are unrecoverable, so deletion is
  strictly opt-in) while the declared secret is re-sealed and re-written;
  the run then converges.
settings:
  dependabot_secrets:
    undeclared: delete
    entries:
      - name: REGISTRY_TOKEN
        value: $REGISTRY_TOKEN
env:
  REGISTRY_TOKEN: sealed-registry-plaintext-66cc
inputs:
  mode: apply
live_state:
  dependabot_secrets:
    - name: REGISTRY_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_FEED_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    dependabot_secrets: applied
  mutations:
    - "PUT /repos/{repo}/dependabot/secrets/REGISTRY_TOKEN"
    - "DELETE /repos/{repo}/dependabot/secrets/STALE_FEED_TOKEN"
  stdout_contains:
    - 'updated secret "REGISTRY_TOKEN"'
    - DELETED undeclared secret "STALE_FEED_TOKEN"
  leaks_nowhere:
    - sealed-registry-plaintext-66cc
  converges: true

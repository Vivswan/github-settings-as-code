name: dependabot-secrets-apply-converges
description: >
  Apply seals and writes every declared Dependabot secret - creating a
  missing one (PUT answers 201) and re-writing an existing one (204),
  matching names case-insensitively - while an undeclared live secret is
  kept (the default) with a note. The resolved plaintexts must reach no
  public surface, a second apply must be a fixpoint (same digests and
  created_at; updated_at moves on every write and must recur, since declared
  secrets are re-PUT each run), and the check re-run must read the applied
  state as clean from existence alone.
settings:
  dependabot_secrets:
    - name: REGISTRY_TOKEN
      value: $REGISTRY_TOKEN
    - name: npm_mirror_token
      value: $NPM_MIRROR_TOKEN
env:
  REGISTRY_TOKEN: sealed-registry-plaintext-4b1e
  NPM_MIRROR_TOKEN: sealed-mirror-plaintext-9d2c
inputs:
  mode: apply
live_state:
  dependabot_secrets:
    - name: NPM_MIRROR_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: LEGACY_FEED_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    dependabot_secrets: applied
  mutations:
    - "PUT /repos/{repo}/dependabot/secrets/REGISTRY_TOKEN"
    - "PUT /repos/{repo}/dependabot/secrets/NPM_MIRROR_TOKEN"
  never:
    - "DELETE /repos/{repo}/dependabot/secrets"
  stdout_contains:
    - 'created secret "REGISTRY_TOKEN"'
    - 'updated secret "NPM_MIRROR_TOKEN"'
    - Dependabot secret "LEGACY_FEED_TOKEN" exists on the repo but is not declared
  leaks_nowhere:
    - sealed-registry-plaintext-4b1e
    - sealed-mirror-plaintext-9d2c
  apply_idempotent: true

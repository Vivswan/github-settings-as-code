name: dependabot-secrets-check-drift
description: >
  Check mode reconciles Dependabot secrets by existence alone: a
  declared-but-missing secret is drift, the declared values earn one
  cannot-verify note, an undeclared live secret stays a keep-note under the
  default policy, and no reference is resolved (this scenario deliberately
  defines no env), so only the list and the sealing key are read - the
  key is a read the plan closes over for its sealed writes, in every mode.
settings:
  dependabot_secrets:
    - name: REGISTRY_TOKEN
      value: $REGISTRY_TOKEN
inputs:
  mode: check
live_state:
  dependabot_secrets:
    - name: LEGACY_FEED_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 1
  result: drift
  outcomes:
    dependabot_secrets: drift
  never:
    - "PUT /repos/{repo}/dependabot/secrets"
    - "DELETE /repos/{repo}/dependabot/secrets"
  stdout_contains:
    - "drift: dependabot_secrets[REGISTRY_TOKEN]: missing"
    - values cannot be read back from GitHub
    - Dependabot secret "LEGACY_FEED_TOKEN" exists on the repo but is not declared

name: dependabot-secrets-undeclared-keep-note
description: >
  The section's keep default: a live Dependabot secret the plain-array form
  does not declare is KEPT and surfaced as a note naming the
  "_undeclared: delete" knob that would remove it. The declared secret is
  re-sealed and re-written as on every run, nothing is deleted, and a check
  rerun converges (the kept secret is a note, not drift).
settings:
  dependabot_secrets:
    - name: REGISTRY_TOKEN
      value: $REGISTRY_TOKEN
env:
  REGISTRY_TOKEN: sealed-registry-plaintext-55ff
inputs:
  mode: apply
live_state:
  dependabot_secrets:
    - name: REGISTRY_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_REGISTRY_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    dependabot_secrets: applied
  mutations:
    - "PUT /repos/{repo}/dependabot/secrets/REGISTRY_TOKEN"
  never:
    - "DELETE /repos/{repo}/dependabot/secrets"
    - "PUT /repos/{repo}/dependabot/secrets/STALE_REGISTRY_KEY"
  stdout_contains:
    - 'kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
    - STALE_REGISTRY_KEY
  leaks_nowhere:
    - sealed-registry-plaintext-55ff
  fixpoint: converges

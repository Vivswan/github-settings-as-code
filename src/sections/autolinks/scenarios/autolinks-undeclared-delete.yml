# The section's delete default: a live autolink the plain-array form does not
# declare is DELETED, the declared autolink (already converged) is left alone,
# apply stays green, and a check rerun over the mutated state converges.
name: autolinks-undeclared-delete
settings:
  autolinks:
    - key_prefix: "TICKET-"
      url_template: "https://example.com/TICKET?q=<num>"
      is_alphanumeric: true
live_state:
  autolinks:
    - id: 10
      key_prefix: "TICKET-"
      url_template: "https://example.com/TICKET?q=<num>"
      is_alphanumeric: true
    - id: 20
      key_prefix: "JIRA-"
      url_template: "https://jira.example.com/<num>"
      is_alphanumeric: true
token_permissions:
  administration: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    autolinks: applied
  mutations:
    - "DELETE /repos/{repo}/autolinks/20"
  never:
    - "DELETE /repos/{repo}/autolinks/10"
    - "POST /repos/{repo}/autolinks"
  stdout_contains:
    - 'DELETED undeclared autolink "JIRA-"'
  fixpoint: converges

# Two declared prefixes where one begins the other. GitHub accepts the first
# create and rejects the second, which would leave the run half-applied, so
# the pair is refused before the section's read and nothing is requested.
name: autolinks-overlapping-prefixes
settings:
  autolinks:
    - key_prefix: "TICKET-"
      url_template: "https://example.com/TICKET/<num>"
    - key_prefix: "TICKET-A"
      url_template: "https://example.com/TICKET-A/<num>"
token_permissions:
  administration: write
expect:
  exit_code: 1
  result: failed
  outcomes:
    autolinks: failed
  stdout_contains:
    - 'autolinks: the settings file declares conflicting autolinks: the key_prefix "TICKET-" begins the key_prefix "TICKET-A"'
    - "choose prefixes where neither begins the other"
  zero_requests: true

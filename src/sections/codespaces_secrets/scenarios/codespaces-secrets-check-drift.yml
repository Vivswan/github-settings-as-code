name: codespaces-secrets-check-drift
description: >
  Check mode reconciles Codespaces secrets by existence alone: a
  declared-but-missing secret is drift, the declared values earn one
  cannot-verify note, an undeclared live secret stays a keep-note under the
  default policy, and no reference is resolved (this scenario deliberately
  defines no env), so nothing but the list endpoint is touched.
settings:
  codespaces_secrets:
    - name: DOTFILES_PAT
      value: $DOTFILES_PAT
inputs:
  mode: check
live_state:
  codespaces_secrets:
    - name: LEGACY_CODESPACE_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 1
  result: drift
  outcomes:
    codespaces_secrets: drift
  never:
    - "PUT /repos/{repo}/codespaces/secrets"
    - "DELETE /repos/{repo}/codespaces/secrets"
    - "GET /repos/{repo}/codespaces/secrets/public-key"
  stdout_contains:
    - "drift: codespaces_secrets[DOTFILES_PAT]: missing"
    - values cannot be read back from GitHub
    - Codespaces secret "LEGACY_CODESPACE_TOKEN" exists on the repo but is not declared

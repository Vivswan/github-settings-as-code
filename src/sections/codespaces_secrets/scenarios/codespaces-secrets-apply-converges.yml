name: codespaces-secrets-apply-converges
description: >
  Apply seals and writes every declared Codespaces secret - creating a
  missing one (PUT answers 201) and re-writing an existing one (204),
  matching names case-insensitively - while an undeclared live secret is
  kept (the default) with a note. The resolved plaintexts must reach no
  public surface, a second apply must be a fixpoint (same digests and
  created_at; updated_at moves on every write and must recur, since declared
  secrets are re-PUT each run), and the check re-run must read the applied
  state as clean from existence alone.
settings:
  codespaces_secrets:
    - name: DOTFILES_PAT
      value: $DOTFILES_PAT
    - name: devcontainer_key
      value: $DEVCONTAINER_KEY
env:
  DOTFILES_PAT: sealed-dotfiles-plaintext-3e8a
  DEVCONTAINER_KEY: sealed-devcontainer-plaintext-5f1b
inputs:
  mode: apply
live_state:
  codespaces_secrets:
    - name: DEVCONTAINER_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: LEGACY_CODESPACE_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    codespaces_secrets: applied
  mutations:
    - "PUT /repos/{repo}/codespaces/secrets/DOTFILES_PAT"
    - "PUT /repos/{repo}/codespaces/secrets/DEVCONTAINER_KEY"
  never:
    - "DELETE /repos/{repo}/codespaces/secrets"
  stdout_contains:
    - 'created secret "DOTFILES_PAT"'
    - 'updated secret "DEVCONTAINER_KEY"'
    - Codespaces secret "LEGACY_CODESPACE_TOKEN" exists on the repo but is not declared
  leaks_nowhere:
    - sealed-dotfiles-plaintext-3e8a
    - sealed-devcontainer-plaintext-5f1b
  apply_idempotent: true

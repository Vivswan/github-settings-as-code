name: codespaces-secrets-name-rejected
description: >
  A lowercase github_ prefix is the reserved GITHUB_ prefix once GitHub
  uppercases the name, so the Codespaces secret fails when the settings file
  is parsed, before any API contact, naming the reservation - not as a 422
  from the sealed PUT mid-apply.
settings:
  codespaces_secrets:
    - name: github_token
      value: $CODESPACES_TOKEN
env:
  CODESPACES_TOKEN: sealed-codespaces-plaintext-9e2f
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'codespaces_secrets[0].name: the secret name "github_token" starts with the reserved GITHUB_ prefix'
  leaks_nowhere:
    - sealed-codespaces-plaintext-9e2f

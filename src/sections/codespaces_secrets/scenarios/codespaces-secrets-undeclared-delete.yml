name: codespaces-secrets-undeclared-delete
description: >
  The wrapped `undeclared: delete` form deletes a live Codespaces secret the
  file does not declare (the values are unrecoverable, so deletion is
  strictly opt-in) while the declared secret is re-sealed and re-written;
  the run then converges.
settings:
  codespaces_secrets:
    undeclared: delete
    entries:
      - name: DOTFILES_PAT
        value: $DOTFILES_PAT
env:
  DOTFILES_PAT: sealed-dotfiles-plaintext-22dd
inputs:
  mode: apply
live_state:
  codespaces_secrets:
    - name: DOTFILES_PAT
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_CODESPACE_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    codespaces_secrets: applied
  mutations:
    - "PUT /repos/{repo}/codespaces/secrets/DOTFILES_PAT"
    - "DELETE /repos/{repo}/codespaces/secrets/STALE_CODESPACE_TOKEN"
  stdout_contains:
    - 'updated secret "DOTFILES_PAT"'
    - DELETED undeclared secret "STALE_CODESPACE_TOKEN"
  leaks_nowhere:
    - sealed-dotfiles-plaintext-22dd
  converges: true

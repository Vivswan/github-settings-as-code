name: codespaces-secrets-undeclared-keep-note
description: >
  The section's keep default: a live Codespaces secret the plain-array form
  does not declare is KEPT and surfaced as a note naming the
  "_undeclared: delete" knob that would remove it. The declared secret is
  re-sealed and re-written as on every run, nothing is deleted, and a check
  rerun converges (the kept secret is a note, not drift).
settings:
  codespaces_secrets:
    - name: DOTFILES_PAT
      value: $DOTFILES_PAT
env:
  DOTFILES_PAT: sealed-dotfiles-plaintext-44ee
inputs:
  mode: apply
live_state:
  codespaces_secrets:
    - name: DOTFILES_PAT
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_CODESPACE_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    codespaces_secrets: applied
  mutations:
    - "PUT /repos/{repo}/codespaces/secrets/DOTFILES_PAT"
  never:
    - "DELETE /repos/{repo}/codespaces/secrets"
    - "PUT /repos/{repo}/codespaces/secrets/STALE_CODESPACE_TOKEN"
  stdout_contains:
    - 'kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
    - STALE_CODESPACE_TOKEN
  leaks_nowhere:
    - sealed-dotfiles-plaintext-44ee
  fixpoint: converges

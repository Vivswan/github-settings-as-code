name: webhooks-secret-leaks-nowhere
description: >-
  The resolved webhook secret plaintext appears on NO public surface, even
  with debug logging on (the runner always sets RUNNER_DEBUG=1): not in the
  step summary, stdout, stderr, or any output. The run exercises both
  plaintext paths - the create POST and the forced config PATCH - and the
  whole-surface leaks_nowhere sweep hunts the exact plaintext (the
  ::add-mask:: registration lines are stripped by design; the traced request
  payloads show "***" in place of the secret field).
settings:
  webhooks:
    - config:
        url: https://ci.example.com/hook
        content_type: json
        secret: $WEBHOOK_SECRET
    - config:
        url: https://deploy.example.com/hook
        content_type: json
        secret: $WEBHOOK_SECRET
      events: [push]
env:
  WEBHOOK_SECRET: hook-secret-canary-3f9a
live_state:
  hooks:
    - id: 621
      events: [push]
      config:
        url: https://deploy.example.com/hook
        content_type: json
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    webhooks: applied
  mutations:
    - POST /repos/{repo}/hooks
    - PATCH /repos/{repo}/hooks/621/config
  leaks_nowhere:
    - hook-secret-canary-3f9a
  converges: true

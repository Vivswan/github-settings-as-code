name: actions-secrets-undeclared-delete
description: >
  The wrapped `undeclared: delete` form deletes a live secret the file does
  not declare (the values are unrecoverable, so deletion is strictly opt-in)
  while the declared secret is re-sealed and re-written; the run then
  converges.
settings:
  actions_secrets:
    undeclared: delete
    entries:
      - name: DEPLOY_TOKEN
        value: $DEPLOY_TOKEN
env:
  DEPLOY_TOKEN: sealed-deploy-plaintext-11aa
inputs:
  mode: apply
live_state:
  actions_secrets:
    - name: DEPLOY_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_API_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_secrets: applied
  mutations:
    - "PUT /repos/{repo}/actions/secrets/DEPLOY_TOKEN"
    - "DELETE /repos/{repo}/actions/secrets/STALE_API_KEY"
  stdout_contains:
    - 'updated secret "DEPLOY_TOKEN"'
    - DELETED undeclared secret "STALE_API_KEY"
  leaks_nowhere:
    - sealed-deploy-plaintext-11aa
  converges: true

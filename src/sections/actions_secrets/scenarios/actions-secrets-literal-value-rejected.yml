name: actions-secrets-literal-value-rejected
description: >
  A literal secret value (anything but a whole-value $NAME reference) is
  refused before any API contact - settings files are committed plaintext,
  which is exactly what references exist to prevent - and the rejected
  literal itself is never echoed to any public surface.
settings:
  actions_secrets:
    - name: DEPLOY_TOKEN
      value: hunter2-literal-secret
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - committed plaintext
    - whole-value $NAME reference
  leaks_nowhere:
    - hunter2-literal-secret

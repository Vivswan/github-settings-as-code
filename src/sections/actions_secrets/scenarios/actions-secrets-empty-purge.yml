name: actions-secrets-empty-purge
description: >
  An entries-less `undeclared: delete` purge works end to end WITHOUT any
  scenario env: nothing declared means no $NAME references, so the engine
  provisions no resolver, and deletion must not demand one (regression - an
  empty inventory once failed the apply asking for a resolver). No public-key
  fetch either: there is nothing to seal.
settings:
  actions_secrets:
    undeclared: delete
    entries: []
inputs:
  mode: apply
live_state:
  actions_secrets:
    - name: STALE_API_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_secrets: applied
  mutations:
    - "DELETE /repos/{repo}/actions/secrets/STALE_API_KEY"
  never:
    - "GET /repos/{repo}/actions/secrets/public-key"
  stdout_contains:
    - DELETED undeclared secret "STALE_API_KEY"
  converges: true

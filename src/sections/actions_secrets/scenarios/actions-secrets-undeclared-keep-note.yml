name: actions-secrets-undeclared-keep-note
description: >
  The section's keep default: a live secret the plain-array form does not
  declare is KEPT and surfaced as a note naming the "_undeclared: delete" knob
  that would remove it. The declared secret is re-sealed and re-written as on
  every run, nothing is deleted, and a check rerun converges (the kept secret
  is a note, not drift).
settings:
  actions_secrets:
    - name: DEPLOY_TOKEN
      value: $DEPLOY_TOKEN
env:
  DEPLOY_TOKEN: sealed-deploy-plaintext-33bb
inputs:
  mode: apply
live_state:
  actions_secrets:
    - name: DEPLOY_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_API_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_secrets: applied
  mutations:
    - "PUT /repos/{repo}/actions/secrets/DEPLOY_TOKEN"
  never:
    - "DELETE /repos/{repo}/actions/secrets"
    - "PUT /repos/{repo}/actions/secrets/STALE_API_KEY"
  stdout_contains:
    - 'kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
    - STALE_API_KEY
  leaks_nowhere:
    - sealed-deploy-plaintext-33bb
  fixpoint: converges

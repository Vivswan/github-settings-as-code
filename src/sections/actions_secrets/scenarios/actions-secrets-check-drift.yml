name: actions-secrets-check-drift
description: >
  Check mode reconciles secrets by existence alone: a declared-but-missing
  secret is drift, the declared values earn one cannot-verify note, an
  undeclared live secret stays a keep-note under the default policy, and no
  reference is resolved (this scenario deliberately defines no env), so only the list and the sealing key are read - the
  key is a read the plan closes over for its sealed writes, in every mode.
settings:
  actions_secrets:
    - name: DEPLOY_TOKEN
      value: $DEPLOY_TOKEN
inputs:
  mode: check
live_state:
  actions_secrets:
    - name: LEGACY_WEBHOOK_URL
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 1
  result: drift
  outcomes:
    actions_secrets: drift
  never:
    - "PUT /repos/{repo}/actions/secrets"
    - "DELETE /repos/{repo}/actions/secrets"
  stdout_contains:
    - "drift: actions_secrets[DEPLOY_TOKEN]: missing"
    - values cannot be read back from GitHub
    - Actions secret "LEGACY_WEBHOOK_URL" exists on the repo but is not declared

name: actions_secrets-snapshot-roundtrip
description: "mode: snapshot reads the live actions_secrets back into snapshot.yml and writes nothing to GitHub. The actions_secrets names read back as per-store $SECRET_ACTIONS_<name> references, one note each in the file header and as a notice; the values, which GitHub never reveals, come from the environment when the snapshot is checked back. The written file, fed back to a check run against the same state, reads clean."
settings: {}
live_state:
  actions_secrets:
    - name: DEPLOY_TOKEN
      created_at: 2026-01-01T00:00:00Z
      updated_at: 2026-01-01T00:00:00Z
    - name: GITHUB_PAT
      created_at: 2026-01-01T00:00:00Z
      updated_at: 2026-01-01T00:00:00Z
env:
  SECRET_ACTIONS_DEPLOY_TOKEN: deploy-token-plaintext-7f3a
  SECRET_ACTIONS_GITHUB_PAT: pat-plaintext-91c2
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: actions_secrets
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    actions_secrets: snapshot
  snapshot:
    actions_secrets:
      _undeclared: keep
      entries:
        - name: DEPLOY_TOKEN
          value: $SECRET_ACTIONS_DEPLOY_TOKEN
        - name: GITHUB_PAT
          value: $SECRET_ACTIONS_GITHUB_PAT
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

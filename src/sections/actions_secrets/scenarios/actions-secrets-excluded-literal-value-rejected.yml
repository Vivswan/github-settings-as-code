name: actions-secrets-excluded-literal-value-rejected
description: >
  A literal secret value is refused at validation even when the sections
  input excludes actions_secrets from the run: the check is the file's,
  not the selection's, so the run exits 1 with zero requests and the
  selected labels section is never applied. The literal itself is never
  echoed to any public surface.
settings:
  actions_secrets:
    - name: DEPLOY_TOKEN
      value: hunter2-literal-secret
  labels:
    - name: bug
      color: d73a4a
inputs:
  mode: apply
  sections: labels
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - "actions_secrets: the secret entry \"DEPLOY_TOKEN\" carries a literal value"
    - whole-value $NAME reference
  leaks_nowhere:
    - hunter2-literal-secret

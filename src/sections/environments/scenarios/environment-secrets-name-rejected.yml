name: environment-secrets-name-rejected
description: >
  A per-environment secret name starting with a digit fails when the settings
  file is parsed, before any API contact, with the nested path and GitHub's
  rule - not as a 422 from the sealed PUT that would otherwise land only after
  the environment PUT had already been written.
settings:
  environments:
    - name: staging
      secrets:
        - name: 1_DEPLOY_TOKEN
          value: $STAGING_DEPLOY_TOKEN
env:
  STAGING_DEPLOY_TOKEN: sealed-staging-plaintext-1a2b
inputs:
  mode: apply
token_permissions:
  environments: write
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'environments[0].secrets[0].name: the secret name "1_DEPLOY_TOKEN" starts with a digit'
  leaks_nowhere:
    - sealed-staging-plaintext-1a2b

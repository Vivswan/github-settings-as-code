# The enable POST is gated by Administration WRITE (a per-endpoint
# override): with Administration granted at read, the preflight passes, the
# environment already matches, the available-Apps read succeeds and resolves
# the slug - and the enable itself is refused. The denial advice names the
# "Administration" grant the override requires.
name: environment-protection-rules-write-denied
settings:
  environments:
    - name: production
      deployment_protection_rules:
        - app: deploy-gate
denial_style: fine_grained
live_state:
  environments:
    production:
      name: production
      protection_rules: []
token_permissions:
  environments: write
  actions: read
  administration: read
expect:
  exit_code: 1
  result: failed
  outcomes:
    environments: failed
  never:
    - "DELETE /repos/{repo}/environments"
  requests_contain:
    - "GET /repos/e2e-owner/e2e-repo/environments/production/deployment_protection_rules/apps"
  stdout_contains:
    - '"Administration" (read and write)'

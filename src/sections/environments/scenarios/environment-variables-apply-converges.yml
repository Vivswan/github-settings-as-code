# Apply reconciles a declared per-environment variables list through the
# variables endpoints AFTER the environment PUT: the missing variable is
# created, the divergent value is updated (PATCH addressed at the LIVE name,
# despite the declared lowercase spelling), and the undeclared one is DELETED
# (the default policy WITHIN a declared variables key). A check rerun lists
# the reconciled variables and sees them satisfied, so it converges.
name: environment-variables-apply-converges
settings:
  environments:
    - name: production
      wait_timer: 30
      variables:
        - name: DEPLOY_REGION
          value: eu-west-1
        - name: log_level
          value: debug
live_state:
  environments:
    production:
      name: production
      protection_rules:
        - id: 3736
          type: wait_timer
          wait_timer: 15
  environment_variables:
    production:
      - name: LOG_LEVEL
        value: info
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
      - name: LEGACY
        value: keep-me-not
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
token_permissions:
  environments: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    environments: applied
  mutations:
    - "PUT /repos/{repo}/environments/production"
    - "POST /repos/{repo}/environments/production/variables"
    - "PATCH /repos/{repo}/environments/production/variables/LOG_LEVEL"
    - "DELETE /repos/{repo}/environments/production/variables/LEGACY"
  converges: true

# The wrapped variables form with "undeclared: keep" softens the nested
# default: a live variable the entries do not declare is KEPT and surfaced as
# a note instead of being deleted. The declared variable still updates, apply
# stays green, and a check rerun converges (the kept variable is a note, not
# drift).
name: environment-variables-undeclared-keep
settings:
  environments:
    - name: production
      variables:
        undeclared: keep
        entries:
          - name: DEPLOY_REGION
            value: eu-west-1
live_state:
  environments:
    production:
      name: production
      protection_rules: []
  environment_variables:
    production:
      - name: DEPLOY_REGION
        value: us-east-1
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
      - name: LEGACY
        value: still-here
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
token_permissions:
  environments: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    environments: applied
  mutations:
    - "PATCH /repos/{repo}/environments/production/variables/DEPLOY_REGION"
  never:
    - "DELETE /repos/{repo}/environments/production/variables"
  stdout_contains:
    - "kept under \"undeclared: keep\""
    - LEGACY
  converges: true

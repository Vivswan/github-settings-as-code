name: environment-secrets-undeclared-delete
description: >
  The wrapped `undeclared: delete` form deletes a live environment secret
  the entries do not declare (deletion is strictly opt-in for secrets - the
  default WITHIN a declared secrets key is keep, unlike variables) while the
  declared secret is re-sealed and re-written; the run then converges.
settings:
  environments:
    - name: prod
      secrets:
        undeclared: delete
        entries:
          - name: DEPLOY_TOKEN
            value: $PROD_DEPLOY_TOKEN
env:
  PROD_DEPLOY_TOKEN: sealed-prod-plaintext-77ee
inputs:
  mode: apply
live_state:
  environments:
    prod:
      name: prod
      protection_rules: []
  environment_secrets:
    prod:
      - name: DEPLOY_TOKEN
        created_at: "2019-08-10T14:59:22Z"
        updated_at: "2019-08-10T14:59:22Z"
      - name: STALE_ENV_TOKEN
        created_at: "2019-08-10T14:59:22Z"
        updated_at: "2019-08-10T14:59:22Z"
token_permissions:
  environments: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    environments: applied
  mutations:
    - "PUT /repos/{repo}/environments/prod"
    - "PUT /repos/{repo}/environments/prod/secrets/DEPLOY_TOKEN"
    - "DELETE /repos/{repo}/environments/prod/secrets/STALE_ENV_TOKEN"
  stdout_contains:
    - 'updated secret "DEPLOY_TOKEN" in environment "prod"'
    - DELETED undeclared secret "STALE_ENV_TOKEN" in environment "prod"
  leaks_nowhere:
    - sealed-prod-plaintext-77ee
  converges: true

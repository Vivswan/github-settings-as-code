name: environment-secrets-apply-converges
description: >
  Apply reconciles a declared per-environment secrets list after the
  environment's own write, one sealing scope per environment: BOTH environments
  declare a secret named DEPLOY_TOKEN with DIFFERENT source values, so a
  lookup keyed by name alone would collide across scopes - each environment
  must fetch its own public key and seal its own plaintext. staging is
  created (its sealing key is readable only once that PUT has landed, so it
  is read after it; its secret PUT answers 201) and prod already exists and
  matches, so it is not re-PUT (its secret PUT answers 204); an
  undeclared live secret on prod is kept (the default within a declared
  secrets key) with a note naming its environment. The plaintexts reach no
  public surface, a second apply is a fixpoint (same digests and created_at;
  every secret PUT recurs), and the final check reads clean from existence
  alone.
settings:
  environments:
    - name: staging
      secrets:
        - name: DEPLOY_TOKEN
          value: $STAGING_DEPLOY_TOKEN
    - name: prod
      secrets:
        - name: DEPLOY_TOKEN
          value: $PROD_DEPLOY_TOKEN
env:
  STAGING_DEPLOY_TOKEN: sealed-staging-plaintext-1a2b
  PROD_DEPLOY_TOKEN: sealed-prod-plaintext-3c4d
inputs:
  mode: apply
live_state:
  environments:
    prod:
      name: prod
      protection_rules: []
  environment_secrets:
    prod:
      - name: DEPLOY_TOKEN
        created_at: "2019-08-10T14:59:22Z"
        updated_at: "2019-08-10T14:59:22Z"
      - name: LEGACY_ENV_TOKEN
        created_at: "2019-08-10T14:59:22Z"
        updated_at: "2019-08-10T14:59:22Z"
token_permissions:
  environments: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    environments: applied
  mutations:
    - "PUT /repos/{repo}/environments/staging"
    - "PUT /repos/{repo}/environments/staging/secrets/DEPLOY_TOKEN"
    - "PUT /repos/{repo}/environments/prod/secrets/DEPLOY_TOKEN"
  never:
    - "DELETE /repos/{repo}/environments"
  requests_contain:
    # The sealing key is per ENVIRONMENT: each scope must fetch its own (a
    # shared-key regression would be invisible to the single-keypair mock
    # otherwise).
    - "GET /repos/e2e-owner/e2e-repo/environments/staging/secrets/public-key"
    - "GET /repos/e2e-owner/e2e-repo/environments/prod/secrets/public-key"
  stdout_contains:
    - 'created secret "DEPLOY_TOKEN" in environment "staging"'
    - 'updated secret "DEPLOY_TOKEN" in environment "prod"'
    - prod environment secret "LEGACY_ENV_TOKEN" exists on the environment but is not declared
  leaks_nowhere:
    - sealed-staging-plaintext-1a2b
    - sealed-prod-plaintext-3c4d
  apply_idempotent: true

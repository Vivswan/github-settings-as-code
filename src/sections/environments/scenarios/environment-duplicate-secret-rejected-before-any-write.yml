# One environment declares two secrets that fold to one name (GitHub stores
# secret names uppercase). The nested list's check reads nothing but the
# settings file, so document validation rejects the run BEFORE any section
# writes: the repository section would otherwise have PATCHed before the
# environments planner threw. The issue path reaches into the nested list.
name: environment-duplicate-secret-rejected-before-any-write
settings:
  repository:
    description: should never be written
  environments:
    - name: prod
      secrets:
        - name: token
          value: $A
        - name: TOKEN
          value: $B
env:
  A: sealed-plaintext-a
  B: sealed-plaintext-b
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'environments[0].secrets[1].name: "TOKEN" names the same secret of the "prod" environment as "token" declared earlier; keep exactly one entry per secret of the "prod" environment'

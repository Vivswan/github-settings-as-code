sections_table:
  endpoints: deploy keys list/create/delete
  notes: >-
    matched by title; the declared material is a PUBLIC key; immutable upstream, so changed entries
    are replaced
coverage:
  - area: "[Deploy keys](https://docs.github.com/en/rest/deploy-keys/deploy-keys)"
    endpoints: [list, create, remove]
    notes:
      - >-
        GET/POST /repos/{owner}/{repo}/keys and DELETE /repos/{owner}/{repo}/keys/{key_id}, matched
        by exact title (two live keys under one title fail loudly, since GitHub does not enforce title
        uniqueness).
      - The declared material is a PUBLIC key, so it is safe to keep in settings.yml (unlike secrets).
      - >-
        Keys are immutable upstream (no update endpoint exists), so a changed key or declared
        read_only is applied as delete + recreate, the autolinks pattern; an UNDECLARED read_only
        survives the recreate, since the live value is re-sent, so a rotation never widens access.
      - >-
        Renaming a key while keeping its material cannot be applied - the one-repository-per-key rule
        makes the create collide with the live key - so the section fails loudly naming the live
        holder; delete or rename the live key on GitHub first.
      - >-
        Material is compared as algorithm + base64 blob with the trailing comment ignored, because
        GitHub may strip or rewrite comments on storage - a raw-string compare would replace the key
        on every apply.
      - >-
        A live key under an algorithm the settings file cannot declare is outside the section: GitHub
        accepted it, so it is never matched, deleted, or aborted on, and a snapshot leaves it out with
        a note.
      - >-
        A 422 on create can mean the public key is already attached to another repository (one
        repository per key, account-wide); the error says so.
      - >-
        Undeclared keys are KEPT by default (deleting a live deploy key breaks whatever service
        authenticates with it, and deployment tooling installs its own keys); the wrapped
        `_undeclared: delete` form opts into deletion.
      - >-
        Snapshot reads the live keys back (title, comparable material, read_only) under the keep
        default.
schema:
  SettingsFile.deploy_keys: >-
    Deploy keys, matched by title. The declared material is a PUBLIC key, safe in a committed
    settings file. Keys are immutable upstream, so any change is applied as delete plus recreate.
    Undeclared keys are kept by default - deleting a live deploy key breaks whatever service
    authenticates with it, and deployment tooling installs its own keys - and the wrapped form can
    set `_undeclared: delete`.
  DeployKeyConfig: >-
    One deploy key, matched by exact title (GitHub documents no case folding for titles). Extra
    fields pass through to the create call verbatim.
  DeployKeyConfig.title: The key title shown in the settings UI, the natural key.
  DeployKeyConfig.key: >-
    The PUBLIC key as one line, "<algorithm> <base64> [comment]" (the .pub file), the algorithm one
    of ssh-ed25519, ssh-rsa, ecdsa-sha2-nistp256/384/521, sk-ssh-ed25519@openssh.com,
    sk-ecdsa-sha2-nistp256@openssh.com (GitHub dropped DSA in 2022). Anything else, a line break
    included, is refused when the settings file is read; a private key is named, never echoed.
    Compared as
    algorithm + blob, comment ignored; immutable upstream, so a changed key is delete plus recreate.
  DeployKeyConfig.read_only: >-
    Whether the key is restricted to read-only access; GitHub defaults to false (read/write).

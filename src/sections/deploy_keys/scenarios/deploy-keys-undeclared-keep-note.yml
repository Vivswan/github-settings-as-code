name: deploy-keys-undeclared-keep-note
description: >-
  The section's keep default: a live deploy key the plain-array form does not
  declare is KEPT and surfaced as a note naming the "_undeclared: delete" knob
  that would remove it. The declared key is already converged (the mock
  stores the material without its trailing comment, as GitHub does), so apply
  writes nothing, stays green, and a check rerun converges.
settings:
  deploy_keys:
    - title: mirror-pull
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIRotatedRotatedRotatedRotatedRotated mirror@new
      read_only: true
live_state:
  deploy_keys:
    - id: 10
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIRotatedRotatedRotatedRotatedRotated
      url: https://api.github.com/repos/e2e-owner/e2e-repo/keys/10
      title: mirror-pull
      verified: true
      created_at: "2026-01-01T00:00:00Z"
      read_only: true
    - id: 20
      key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCRetiredRetiredRetiredRetired
      url: https://api.github.com/repos/e2e-owner/e2e-repo/keys/20
      title: retired-service
      verified: true
      created_at: "2026-01-01T00:00:00Z"
      read_only: true
token_permissions:
  administration: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    deploy_keys: applied
  never:
    - "POST /repos/{repo}/keys"
    - "DELETE /repos/{repo}/keys"
  stdout_contains:
    - 'deploy key "retired-service" exists on the repo but is not declared in the settings file; kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
  fixpoint: converges

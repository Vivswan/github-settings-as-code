name: code_scanning_default_setup-snapshot-roundtrip
description: "mode: snapshot reads the live code_scanning_default_setup back into snapshot.yml and writes nothing to GitHub. A configured default setup reads back as its declarable fields; updated_at and the schedule fall away. The written file, fed back to a check run against the same state, reads clean."
settings: {}
live_state:
  code_scanning:
    state: configured
    languages:
      - javascript-typescript
    runner_type: standard
    runner_label: null
    query_suite: default
    threat_model: remote
    updated_at: 2026-07-01T10:00:00Z
    schedule: null
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: code_scanning_default_setup
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    code_scanning_default_setup: snapshot
  snapshot:
    code_scanning_default_setup:
      state: configured
      query_suite: default
      languages:
        - javascript-typescript
      runner_type: standard
      runner_label: null
      threat_model: remote
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

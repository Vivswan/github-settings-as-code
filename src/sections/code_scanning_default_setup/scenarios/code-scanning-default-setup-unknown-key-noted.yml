# A misspelled key passes through (the surface is open so a field GitHub ships
# tomorrow is declarable), but the GET never echoes it, so the PATCH would
# re-run on every apply without converging. Check mode notes exactly that,
# naming the key, alongside the drift it causes, and writes nothing.
name: code-scanning-default-setup-unknown-key-noted
settings:
  code_scanning_default_setup:
    state: configured
    threat_models: remote
inputs:
  mode: check
live_state:
  code_scanning:
    state: configured
    languages:
      - javascript-typescript
    query_suite: default
expect:
  exit_code: 1
  result: drift
  outcomes:
    code_scanning_default_setup: drift
  stdout_contains:
    - 'declared key "threat_models" does not exist on the live code scanning default setup, so if GitHub ignores it this PATCH will re-run on every apply without converging. Fix the key name, or remove it from the settings file'
  never:
    - "PATCH /repos/{repo}/code-scanning/default-setup"

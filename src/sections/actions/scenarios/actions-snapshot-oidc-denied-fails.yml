# The OIDC template GET sits behind the Actions grant, not the section's
# Administration, so with Actions denied it is the one read the token cannot
# make while the primary read succeeds. Under the default
# on-missing-permission: fail that sub-read denial fails the section and the
# run exactly as a primary read's would: exit 1, result failed, the error
# annotation naming the Actions grant, and no file written.
name: actions-snapshot-oidc-denied-fails
settings: {}
live_state:
  actions_permissions:
    enabled: true
    allowed_actions: all
  workflow_permissions:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
  actions_access:
    access_level: none
  actions_retention:
    days: 90
    maximum_allowed_days: 400
  cache_retention_limit:
    max_cache_retention_days: 5
  cache_storage_limit:
    max_cache_size_gb: 10
  oidc_customization_sub:
    use_default: true
  fork_pr_contributor_approval:
    approval_policy: first_time_contributors
  fork_pr_workflows_private_repos:
    run_workflows_from_fork_pull_requests: false
    send_write_tokens_to_workflows: false
    send_secrets_and_variables: false
    require_approval_for_fork_pr_workflows: true
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: actions
denial_style: fine_grained
token_permissions:
  administration: write
  actions: none
expect:
  exit_code: 1
  result: failed
  skipped_sections: []
  outcomes:
    actions: failed
  stdout_contains:
    - "::error::actions: not snapshotted - the token was denied GET /repos/e2e-owner/e2e-repo/actions/oidc/customization/sub"
    - 'grant "Actions"'
  stdout_lacks:
    - "left out of the snapshot"
  summary_contains:
    - ":x: failed - the snapshot failed, so no file was written"
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /

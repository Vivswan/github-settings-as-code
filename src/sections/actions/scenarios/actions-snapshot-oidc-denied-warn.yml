# The warn twin of actions-snapshot-oidc-denied-fails: the same Actions
# denial on the OIDC template GET is a notice naming the key it takes out,
# the other keys read back, and the file is written with result snapshot
# (a noted key is not a skipped section, so the run is not partial).
name: actions-snapshot-oidc-denied-warn
settings: {}
live_state:
  actions_permissions:
    enabled: true
    allowed_actions: all
  workflow_permissions:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
  actions_access:
    access_level: none
  actions_retention:
    days: 90
    maximum_allowed_days: 400
  cache_retention_limit:
    max_cache_retention_days: 5
  cache_storage_limit:
    max_cache_size_gb: 10
  oidc_customization_sub:
    use_default: true
  fork_pr_contributor_approval:
    approval_policy: first_time_contributors
  fork_pr_workflows_private_repos:
    run_workflows_from_fork_pull_requests: false
    send_write_tokens_to_workflows: false
    send_secrets_and_variables: false
    require_approval_for_fork_pr_workflows: true
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: actions
  on_missing_permission: warn
denial_style: fine_grained
token_permissions:
  administration: write
  actions: none
expect:
  exit_code: 0
  result: snapshot
  skipped_sections: []
  outcomes:
    actions: snapshot
  snapshot:
    actions:
      enabled: true
      allowed_actions: all
      default_workflow_permissions: read
      can_approve_pull_request_reviews: false
      access_level: none
      artifact_and_log_retention:
        days: 90
      cache:
        max_cache_retention_days: 5
        max_cache_size_gb: 10
      fork_pr_contributor_approval:
        approval_policy: first_time_contributors
      fork_pr_workflows_private_repos:
        run_workflows_from_fork_pull_requests: false
        send_write_tokens_to_workflows: false
        send_secrets_and_variables: false
        require_approval_for_fork_pr_workflows: true
  stdout_contains:
    - "::notice::actions.oidc_customization_sub: left out of the snapshot - the token was denied GET /repos/e2e-owner/e2e-repo/actions/oidc/customization/sub"
    - snapshot written to snapshot.yml
  stdout_lacks:
    - "::error::"
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

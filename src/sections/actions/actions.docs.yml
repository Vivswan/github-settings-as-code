sections_table:
  endpoints: >-
    actions permissions + selected-actions + workflow token + access level + artifact/log retention
    + cache limits + OIDC subject claim + fork PR policies
  notes: >-
    keys with their own sub-endpoint route there; everything else rides the base permissions PUT
    verbatim
coverage:
  - area: >-
      [Actions permissions](https://docs.github.com/en/rest/actions/permissions) (enabled,
      allowed_actions, sha_pinning_required + any base-permission field GitHub adds; selected_actions
      policy; workflow
      token default permissions + can_approve_pull_request_reviews; workflows access_level;
      artifact/log retention; cache limits; OIDC subject claim customization; fork PR contributor
      approval and private-repo fork PR workflow policies)
    notes: >-
      Key routing (src/sections/actions/index.ts): the two known workflow-token keys -> PUT
      .../actions/permissions/workflow, selected_actions -> PUT .../permissions/selected-actions
      (the allowlist body is closed to its three documented keys, since that PUT has no
      unrecognized-key note to catch a typo), access_level -> PUT .../permissions/access (private
      repositories only), artifact_and_log_retention -> PUT .../permissions/artifact-and-log-retention
      (body {days}, verbatim), cache.max_cache_retention_days -> PUT .../actions/cache/retention-limit,
      cache.max_cache_size_gb -> PUT .../actions/cache/storage-limit (each limit is its own
      single-field endpoint, so unrecognized cache keys are rejected; a 403 on the cache endpoints
      can mean an org- or enterprise-managed policy rather than a missing grant),
      oidc_customization_sub -> GET/PUT .../actions/oidc/customization/sub (201 on write; needs the
      "Actions" PAT permission instead of Administration, and include_claim_keys is compared
      positionally because claim-key order defines the subject format), fork_pr_contributor_approval
      -> GET/PUT .../permissions/fork-pr-contributor-approval (the approval_policy object,
      verbatim), fork_pr_workflows_private_repos -> GET/PUT
      .../permissions/fork-pr-workflows-private-repos (only run_workflows_from_fork_pull_requests is
      required, as in the request body; the pair is documented for private repositories, so a denial
      on it can also mean the repository is public), EVERYTHING else -> base PUT
      .../actions/permissions verbatim. Whenever any base-permissions key is present in that PUT
      body, an undeclared `enabled` is defaulted to `true` (declaring a permissions field implies
      Actions are on), and selected_actions with no allowed_actions infers allowed_actions:
      selected. RISK: a key GitHub adds that belongs on a NEW sub-endpoint gets routed to the base
      PUT where GitHub ignores it; audit the routing whenever GitHub adds a permissions
      sub-endpoint. Fields a GET reports that its PUT does not take (selected_actions_url,
      artifact_and_log_retention.maximum_allowed_days, oidc_customization_sub.sub_claim_prefix) are
      refused when the file is parsed, since a declared value could only diff against live and
      re-PUT on every run. Snapshot reads every endpoint back onto its key (the allowlist only under
      the selected policy; the reported-only fields fall away); a sub-endpoint the token cannot read,
      such as the OIDC template under a token without the Actions permission, is noted and left out
      rather than failing the section.
schema:
  SettingsFile.actions: GitHub Actions permissions for the repository.
  ActionsConfig: GitHub Actions settings, routed to the right endpoint by key.
  ActionsConfig.enabled: "PUT /repos/{r}/actions/permissions: whether Actions runs at all."
  ActionsConfig.allowed_actions: Which actions may run; "selected" pairs with selected_actions below.
  ActionsConfig.sha_pinning_required: Whether actions must be pinned to a full-length commit SHA.
  ActionsConfig.selected_actions: >-
    PUT /repos/{r}/actions/permissions/selected-actions (allowed_actions: selected): the allowlist,
    e.g. { github_owned_allowed: true, patterns_allowed: [octocat/*] }. Only the three documented
    keys are accepted, so a misspelled one is refused instead of re-sent on every run.
  ActionsConfig.selected_actions.github_owned_allowed: Whether actions in GitHub's own organizations (such as actions/*) may run.
  ActionsConfig.selected_actions.verified_allowed: Whether actions by GitHub Marketplace verified creators may run.
  ActionsConfig.selected_actions.patterns_allowed: >-
    Patterns naming the actions and reusable workflows allowed to run, e.g. octocat/hello-world@v2
    or octocat/*; GitHub applies them to public repositories only.
  ActionsConfig.default_workflow_permissions: "PUT /repos/{r}/actions/permissions/workflow: the default GITHUB_TOKEN grant."
  ActionsConfig.can_approve_pull_request_reviews: Whether workflows may approve pull request reviews.
  ActionsConfig.access_level: PUT /repos/{r}/actions/permissions/access (private repositories only)
  ActionsConfig.artifact_and_log_retention: >-
    PUT /repos/{r}/actions/permissions/artifact-and-log-retention: how many days artifacts and
    workflow logs are kept, e.g. { days: 90 }. The body passes through verbatim, so future fields
    GitHub adds work unchanged; maximum_allowed_days, which the GET reports and the PUT does not
    take, is refused.
  ActionsConfig.artifact_and_log_retention.days: How many days artifacts and workflow logs are kept; a whole number of days within the plan's maximum.
  ActionsConfig.cache: >-
    Actions cache limits, each key routed to its own endpoint: max_cache_retention_days -> PUT
    /repos/{r}/actions/cache/retention-limit, max_cache_size_gb -> PUT
    /repos/{r}/actions/cache/storage-limit. Keys other than these two are rejected (each limit has
    its own single-field endpoint, so an extra key could only be a typo).
  ActionsConfig.cache.max_cache_retention_days: How many days an unused cache entry is kept before GitHub evicts it.
  ActionsConfig.cache.max_cache_size_gb: The total cache storage the repository may use, in GB.
  ActionsConfig.oidc_customization_sub: >-
    PUT /repos/{r}/actions/oidc/customization/sub: the OIDC subject claim template for this
    repository's workflow tokens, e.g. { use_default: false, include_claim_keys: [repo, context] }
    (keys are unique and hold only letters, digits, and underscores; a list under use_default: true
    is refused, since GitHub ignores it). Claim-key ORDER defines the subject format, so check mode
    compares a declared list positionally; an omitted list on a custom template opts into the
    organization template and is not compared. sub_claim_prefix, which the GET reports and the PUT
    does not take, is refused. use_immutable_subject switches the whole subject to the stable
    repository-ID-based format; omitted, the organization setting or the repository's creation date
    decides, and only a declared value is compared. Unlike the rest of this section, these endpoints
    need the "Actions" PAT permission rather than Administration.
  ActionsConfig.oidc_customization_sub|0.use_default: "true: GitHub's default subject claim format; this variant carries no claim-key list."
  ActionsConfig.oidc_customization_sub|0.use_immutable_subject: Switch the whole subject to the stable repository-ID-based format.
  ActionsConfig.oidc_customization_sub|1.use_default: "false: a custom template, joined from include_claim_keys."
  ActionsConfig.oidc_customization_sub|1.include_claim_keys: >-
    The claim keys the custom subject joins, in order (e.g. repo, context); the order defines the
    subject format.
  ActionsConfig.oidc_customization_sub|1.use_immutable_subject: Switch the whole subject to the stable repository-ID-based format.
  ActionsConfig.fork_pr_contributor_approval: >-
    PUT /repos/{r}/actions/permissions/fork-pr-contributor-approval: when workflows triggered by
    fork pull requests need a maintainer's approval before they run, e.g. { approval_policy:
    first_time_contributors }. The policies GitHub accepts are
    first_time_contributors_new_to_github, first_time_contributors, and all_external_contributors;
    any other value is refused when the file is parsed. The body passes through verbatim, so future
    fields GitHub adds work unchanged.
  ActionsConfig.fork_pr_contributor_approval.approval_policy: >-
    Which fork contributors need a maintainer's approval before their workflows run:
    first_time_contributors_new_to_github, first_time_contributors, or all_external_contributors.
  ActionsConfig.fork_pr_workflows_private_repos: >-
    PUT /repos/{r}/actions/permissions/fork-pr-workflows-private-repos: whether pull requests from
    forks may run workflows on this private repository, and what those workflows receive. Only
    run_workflows_from_fork_pull_requests is required, as in the request body; GitHub does not
    document whether the PUT preserves or resets an omitted toggle, so declaring all four is the
    posture that leaves no toggle unwatched. The body passes through verbatim, so future fields
    GitHub adds work unchanged.
  ActionsConfig.fork_pr_workflows_private_repos.run_workflows_from_fork_pull_requests: Whether pull requests from forks may run workflows at all.
  ActionsConfig.fork_pr_workflows_private_repos.send_write_tokens_to_workflows: Whether those workflows receive a GITHUB_TOKEN with write permissions.
  ActionsConfig.fork_pr_workflows_private_repos.send_secrets_and_variables: Whether those workflows receive the repository's secrets and variables.
  ActionsConfig.fork_pr_workflows_private_repos.require_approval_for_fork_pr_workflows: Whether a repository administrator must approve each fork workflow run before it starts.

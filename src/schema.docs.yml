schema:
  SettingsFile: "One settings.yml document: every top-level section is optional."
  SettingsFile._layering: >-
    mode: render only: a layer-level default for how this document's list sections combine with
    the layers below it, overriding the run's layering input; a section's own wrapper-level
    `_layering` overrides it again. `replace` lets each of this document's lists win wholesale;
    `shallow` unions the entries by the section's key and swaps a same-key entry for this
    document's; `deep` unions by key and merges a same-key pair field by field, a nested keyed
    list (a ruleset's rules, by type) unioning the same way. Consumed by the render, never applied:
    the rendered document carries no `_layering`, and apply and check ignore it like any `_` key.

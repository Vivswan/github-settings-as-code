# The import layering of src/: one declaration, two readers. An edge counts whether the import is runtime or
# type-only; imports inside one layer are not edges.
#   bun run lint:arch (.github/scripts/arch-lint.ts)  -> fails on an import between layers not under `edges`, and on a listed edge no file draws
#   bun run build:docs                                -> renders the same list as the module map in docs/reference/architecture.md

layers:
  main: [src/main.ts]
  action: [src/action/]
  cli: [src/cli.ts, src/cli/]
  library: [src/index.ts]
  internal: [src/internal.ts]
  flows: [src/flows/]
  engine: [src/engine/]
  sections: [src/sections/]
  github: [src/github/]
  discovery: [src/discovery/]
  report: [src/report/]
  schema: [src/schema.ts]
  io: [src/io.ts]
  problem: [src/problem.ts]
  types: [src/types.ts]
  plain-data: [src/plain-data.ts]
  text: [src/text.ts]
  private: [src/private.ts, src/private-open.ts]
  upstream-gaps: [src/upstream-gaps/]

# Tests, the e2e mock fragments, and the fuzz generators live under test/, outside the walk; only the declaration files are spared here.
exclude:
  - "src/**/*.d.ts"

# from -> the layers it may import; a layer absent here imports nothing outside itself.
# The action and the CLI are consumers of the two entries: src/index.ts (the documented library) and src/internal.ts
# (the rest; the action draws only the first).
edges:
  main: [action]
  action: [library]
  cli: [library, internal]
  library: [discovery, engine, flows, github, io, problem, report, schema, sections]
  internal: [discovery, engine, flows, github, problem, report, schema, sections, text, types]
  flows: [discovery, engine, github, io, private, problem, report, schema, text, types]
  engine: [discovery, github, io, plain-data, problem, schema, sections, text, types]
  sections: [discovery, engine, github, schema, text, types, upstream-gaps]
  github: [io, plain-data]
  discovery: [github, private, problem, text]
  report: [discovery, engine, github, io, private, problem, schema, sections, types]
  problem: [plain-data, schema, text]
  schema: [sections, types]
  upstream-gaps: [types]

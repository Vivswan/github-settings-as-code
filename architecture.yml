# The import layering of src/: one declaration, two readers. An edge counts whether the import is runtime or
# type-only; imports inside one layer are not edges.
#   bun run lint:arch (.github/scripts/arch-lint.ts)  -> fails on an import between layers not under `edges`, and on a listed edge no file draws
#   bun run build:docs                                -> renders the same list as the module map in docs/reference/architecture.md

layers:
  main: [src/main.ts]
  action: [src/action/]
  cli: [src/cli.ts, src/cli/]
  library: [src/index.ts]
  internal: [src/internal.ts]
  flows: [src/flows/]
  engine: [src/engine/]
  sections: [src/sections/]
  github: [src/github/]
  discovery: [src/discovery/]
  report: [src/report/]
  schema: [src/schema.ts]
  io: [src/io.ts]
  problem: [src/problem.ts]
  types: [src/types.ts]
  plain-data: [src/plain-data.ts]
  text: [src/text.ts]
  private: [src/private.ts, src/private-open.ts]
  upstream-gaps: [src/upstream-gaps/]

exclude:
  - src/sections/*/mock.ts
  - src/sections/*/generators.ts
  - "src/**/*.test.ts"
  - "src/**/*.d.ts"

# from -> the layers it may import; a layer absent here imports nothing outside itself.
# The action and the CLI are consumers of the two entries: src/index.ts (the documented library) and src/internal.ts
# (the rest; the action draws only the first).
edges:
  main: [action]
  action: [library]
  cli: [library, internal]
  library: [discovery, engine, flows, github, io, problem, report, schema, sections]
  internal: [discovery, engine, flows, github, problem, report, schema, sections, text, types]
  flows: [discovery, engine, github, io, plain-data, private, problem, report, schema, text, types]
  engine: [discovery, github, io, plain-data, problem, schema, sections, text, types]
  sections: [discovery, engine, github, schema, text, types, upstream-gaps]
  github: [io, plain-data]
  discovery: [github, private, problem, text]
  report: [discovery, engine, github, io, private, problem, schema, sections, types]
  problem: [plain-data, schema, text]
  schema: [sections, types]
  upstream-gaps: [types]

# The never-throw rule: errors are values, so a `throw` in src/ is a `BUG:` invariant (a programming error no user
# can cause), a bare rethrow sitting directly inside its catch clause, or spared here. `requestLayer` lists the files
# the GitHub request layer still throws from, until it returns Results. `ratchet` lists every other throw by file with
# its exact count: the lint fails when this list and the tree disagree in either direction, and refuses a count it
# cannot compare. That a count only ever goes down is the review rule in AGENTS.md, not the lint's.
throws:
  requestLayer:
    - src/github/api.ts
    # Only raise(): the seam that stays until sections return Results themselves, then leaves with them.
    - src/sections/contract/errors.ts
  ratchet:
    src/action/artifact.ts: 1
    src/cli/inputs.ts: 1
    src/engine/diff.ts: 1
    src/engine/execute.ts: 1
    src/engine/orchestrate.ts: 1
    src/github/secret-scan.ts: 5
    src/sections/branches/graphql-rules.ts: 10
    src/sections/branches/index.ts: 1
    src/sections/collaborators/index.ts: 2
    src/sections/contract/docs.ts: 2
    src/sections/custom_properties/index.ts: 2
    src/sections/deploy_keys/index.ts: 1
    src/sections/environments/branch-policies.ts: 2
    src/sections/environments/pins.ts: 2
    src/sections/environments/protection-rules.ts: 3
    src/sections/repository/index.ts: 4
    src/sections/rulesets/index.ts: 1
    src/sections/shared/list-section.ts: 3
    src/sections/shared/roles.ts: 1
    src/sections/shared/sealed-box.ts: 1
    src/sections/shared/secrets-engine.ts: 4

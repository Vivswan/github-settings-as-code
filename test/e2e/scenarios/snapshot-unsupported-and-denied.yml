name: snapshot-unsupported-and-denied
description: "A snapshot under on-missing-permission: warn with a section the token cannot read and one GitHub exposes no read endpoint for. The denied section is skipped (a warning, the skipped-sections output, the header line) and the run ends partial with exit 0; the unsupported one is a notice and a header line, never a failure; the file carries the section that read back. The document itself never reaches stdout or the summary."
settings: {}
live_state:
  labels:
    - &a1
      name: bug
      color: d73a4a
      description: Something is broken
  actions_variables:
    - name: REGION
      value: eu-west-1
      created_at: 2026-01-01T00:00:00Z
      updated_at: 2026-01-01T00:00:00Z
token_permissions:
  variables: none
inputs:
  mode: snapshot
  snapshot_file: out/snapshot.yml
  on_missing_permission: warn
  sections: labels,actions_variables,check_suite_preferences
expect:
  exit_code: 0
  result: partial
  skipped_sections:
    - actions_variables
  outcomes:
    labels: snapshot
    actions_variables: skipped
    check_suite_preferences: unsupported
  snapshot:
    labels:
      _undeclared: delete
      entries:
        - *a1
  stdout_contains:
    - "::warning::actions_variables: skipped - the token was denied GET /repos/e2e-owner/e2e-repo/actions/variables"
    - "::notice::not snapshotted: check_suite_preferences - snapshot does not read these sections back, so the file omits them (the header says why); declare them by hand if they should be managed"
    - snapshot written to out/snapshot.yml
  summary_contains:
    - ":warning: partial - written to out/snapshot.yml"
    - "| check_suite_preferences | :fast_forward: unsupported | check_suite_preferences: GitHub exposes no read endpoint for this section, so there is nothing to snapshot; apply re-asserts the declared value on every run |"
  leaks_nowhere:
    - _undeclared
    - Something is broken
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /

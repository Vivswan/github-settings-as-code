name: environment-secrets-check-drift
description: >
  Check mode reconciles per-environment secrets by existence alone, and only
  where an environment exists: on the live prod environment the
  declared-but-missing secret is drift under its per-environment label, the
  undeclared live secret stays a keep-note naming its environment, and the
  declared values earn ONE cannot-verify note per scope; the declared-but-
  missing staging environment cannot list secrets at all, so its declared
  list gets the unverifiable note instead. No reference is resolved (no env
  is defined here) and no sealing key is ever fetched.
settings:
  environments:
    - name: staging
      secrets:
        - name: DEPLOY_TOKEN
          value: $STAGING_DEPLOY_TOKEN
    - name: prod
      secrets:
        - name: API_KEY
          value: $PROD_API_KEY
inputs:
  mode: check
live_state:
  environments:
    prod:
      name: prod
      protection_rules: []
  environment_secrets:
    prod:
      - name: LEGACY_ENV_TOKEN
        created_at: "2019-08-10T14:59:22Z"
        updated_at: "2019-08-10T14:59:22Z"
token_permissions:
  environments: read
expect:
  exit_code: 1
  result: drift
  outcomes:
    environments: drift
  never:
    - "PUT /repos/{repo}/environments"
    - "DELETE /repos/{repo}/environments"
    - "GET /repos/{repo}/environments/prod/secrets/public-key"
    - "GET /repos/{repo}/environments/staging/secrets"
  stdout_contains:
    - "drift: environments[staging]: missing"
    - "environments[staging].secrets: not verifiable while the environment is missing"
    - "drift: environments[prod].secrets[API_KEY]: missing"
    - prod environment secret values cannot be read back from GitHub
    - prod environment secret "LEGACY_ENV_TOKEN" exists on the environment but is not declared
  requests_contain:
    - "GET /repos/e2e-owner/e2e-repo/environments/prod/secrets"

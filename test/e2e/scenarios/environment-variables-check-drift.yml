# Check mode reports variables drift without writing: the declared value
# differs from the live one, a declared variable is missing, and an
# undeclared live variable would be deleted by the default policy. The
# environment itself matches, so every drift line is a variables line.
name: environment-variables-check-drift
settings:
  environments:
    - name: production
      wait_timer: 15
      variables:
        - name: DEPLOY_REGION
          value: eu-west-1
        - name: RETRIES
          value: "3"
inputs:
  mode: check
live_state:
  environments:
    production:
      name: production
      protection_rules:
        - id: 3736
          type: wait_timer
          wait_timer: 15
  environment_variables:
    production:
      - name: DEPLOY_REGION
        value: us-east-1
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
      - name: LEGACY
        value: stale
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
token_permissions:
  environments: read
expect:
  exit_code: 1
  result: drift
  outcomes:
    environments: drift
  summary_contains:
    - "environments[production].variables[DEPLOY_REGION].value"
    - "environments[production].variables[RETRIES]: missing"
    - "environments[production].variables[LEGACY]: undeclared"
  never:
    - "PUT /repos/{repo}/environments/production"
    - "POST /repos/{repo}/environments/production/variables"
    - "PATCH /repos/{repo}/environments/production/variables"
    - "DELETE /repos/{repo}/environments/production/variables"
  requests_contain:
    - "GET /repos/e2e-owner/e2e-repo/environments/production/variables"

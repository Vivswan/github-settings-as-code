# Refused repos entry under redaction. The second entry is not an owner/name
# slug, so the list is refused before any repository is read. The run cannot
# know whether that text names a private repository, so the refusal names the
# entry by its place in the list and prints its text on no public surface.
name: multi-refused-repos-entry-hidden
settings: {}
repos:
  e2e-owner/svc-a:
    settings: {}
  zq-vault-zq:
    settings: {}
expect:
  exit_code: 1
  result: failed
  stdout_contains:
    - 'the "repos" input has 1 invalid entry: entry #2 is not an owner/name slug'
    - "its text is hidden under private-repos: redact"
  leaks_nowhere:
    - zq-vault-zq
  never:
    - "GET /repos/e2e-owner/svc-a"

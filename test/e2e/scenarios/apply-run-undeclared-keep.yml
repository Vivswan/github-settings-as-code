# The `undeclared: keep` input softens every delete default the file leaves
# unset, on the single-file path as in a render: the bare labels list and the
# environment's bare variables both KEEP their undeclared live entries as notes
# instead of deleting them. The declared entries still update, apply stays
# green, and a check rerun under the same input converges.
name: apply-run-undeclared-keep
inputs:
  undeclared: keep
settings:
  labels:
    - name: bug
      color: d73a4a
      description: Something isn't working
  environments:
    - name: production
      variables:
        - name: DEPLOY_REGION
          value: eu-west-1
live_state:
  labels:
    - name: bug
      color: ffffff
      description: Something isn't working
    - name: wontfix
      color: ffffff
      description: This will not be worked on
  environments:
    production:
      name: production
      protection_rules: []
  environment_variables:
    production:
      - name: DEPLOY_REGION
        value: us-east-1
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
      - name: LEGACY
        value: still-here
        created_at: "2026-06-01T00:00:00Z"
        updated_at: "2026-06-01T00:00:00Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    labels: applied
    environments: applied
  mutations:
    - "PATCH /repos/{repo}/labels/bug"
    - "PATCH /repos/{repo}/environments/production/variables/DEPLOY_REGION"
  never:
    - "DELETE /repos/{repo}/labels"
    - "DELETE /repos/{repo}/environments/production/variables"
  stdout_contains:
    - "kept under \"_undeclared: keep\""
    - wontfix
    - LEGACY
  fixpoint: converges

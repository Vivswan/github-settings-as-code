name: agents-secrets-undeclared-delete
description: >
  The wrapped `undeclared: delete` form deletes a live Copilot agents secret
  the file does not declare (the values are unrecoverable, so deletion is
  strictly opt-in) while the declared secret is re-sealed and re-written;
  the run then converges.
settings:
  agents_secrets:
    undeclared: delete
    entries:
      - name: AGENT_TOKEN
        value: $AGENT_TOKEN
env:
  AGENT_TOKEN: sealed-agent-plaintext-66cc
inputs:
  mode: apply
live_state:
  agents_secrets:
    - name: AGENT_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: STALE_AGENT_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    agents_secrets: applied
  mutations:
    - "PUT /repos/{repo}/agents/secrets/AGENT_TOKEN"
    - "DELETE /repos/{repo}/agents/secrets/STALE_AGENT_KEY"
  stdout_contains:
    - 'updated secret "AGENT_TOKEN"'
    - DELETED undeclared secret "STALE_AGENT_KEY"
  leaks_nowhere:
    - sealed-agent-plaintext-66cc
  converges: true

# The issue-on-failure channel on a HEALTHY run: total quiet. svc-quiet is
# private and converged and never needed a report, so neither its settings nor
# the repository holds the marker label. The channel reads the marker label
# (404: not declared, the check stays clean) and looks up an open report
# issue, finds none, and writes NOTHING: no label, no issue, no title scan.
name: multi-report-issue-on-failure-healthy-quiet
settings: {}
inputs:
  mode: check
  private_report: issue-on-failure
repos:
  e2e-owner/svc-quiet:
    settings:
      labels:
        - name: declared
          color: "00ff00"
    live_state:
      repo:
        private: true
        visibility: private
      labels:
        - name: declared
          color: "00ff00"
    permissions:
      issues: write
      contents: read
      administration: read
expect:
  exit_code: 0
  result: clean
  repos_result:
    "private repository #1": clean
  summary_lacks:
    - "svc-quiet"
  stdout_lacks:
    - "svc-quiet"
  # Zero report issues created; the channel looked for an open one by the
  # marker label.
  issue_report:
    slug: e2e-owner/svc-quiet
    created_count: 0
    lookup_by_label: true
  # The healthy path writes nothing at all: no issue create or update, no
  # marker-label ensure, and no fallback title scan.
  never:
    - "POST /repos/e2e-owner/svc-quiet/issues"
    - "PATCH /repos/e2e-owner/svc-quiet/issues"
    - "POST /repos/e2e-owner/svc-quiet/labels"
    # Both create-guard reads (the state=all label lookup and the title scan) share
    # the open lookup's path; their state=all query is what sets them apart.
    - "GET /repos/e2e-owner/svc-quiet/issues?state=all"
  # The two reads: the marker label, then an indexed lookup for an OPEN report
  # issue by the marker.
  requests_contain:
    - "GET /repos/e2e-owner/svc-quiet/labels/settings-as-code-report"
    - "GET /repos/e2e-owner/svc-quiet/issues?state=open&labels=settings-as-code-report&per_page=100"

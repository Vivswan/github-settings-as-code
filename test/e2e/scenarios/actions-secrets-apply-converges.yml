name: actions-secrets-apply-converges
description: >
  Apply seals and writes every declared Actions secret - creating a missing
  one (PUT answers 201) and re-writing an existing one (204), matching names
  case-insensitively - while an undeclared live secret is kept (the default)
  with a note. The resolved plaintexts must reach no public surface, a second
  apply must be a fixpoint (same digests and created_at; updated_at moves on
  every write and must recur, since declared secrets are re-PUT each run),
  and the check re-run must read the applied state as clean from existence
  alone.
settings:
  actions_secrets:
    - name: DEPLOY_TOKEN
      value: $DEPLOY_TOKEN
    - name: npm_token
      value: $NPM_TOKEN
env:
  DEPLOY_TOKEN: sealed-deploy-plaintext-7f3a
  NPM_TOKEN: sealed-npm-plaintext-2c9d
inputs:
  mode: apply
live_state:
  actions_secrets:
    - name: NPM_TOKEN
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
    - name: LEGACY_WEBHOOK_URL
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 0
  result: applied
  outcomes:
    actions_secrets: applied
  mutations:
    - "PUT /repos/{repo}/actions/secrets/DEPLOY_TOKEN"
    - "PUT /repos/{repo}/actions/secrets/NPM_TOKEN"
  never:
    - "DELETE /repos/{repo}/actions/secrets"
  stdout_contains:
    - 'created secret "DEPLOY_TOKEN"'
    - 'updated secret "NPM_TOKEN"'
    - Actions secret "LEGACY_WEBHOOK_URL" exists on the repo but is not declared
  leaks_nowhere:
    - sealed-deploy-plaintext-7f3a
    - sealed-npm-plaintext-2c9d
  apply_idempotent: true

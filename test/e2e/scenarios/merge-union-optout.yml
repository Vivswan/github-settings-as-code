# mode: merge folds a layer stack into one document with ZERO requests. A
# fleet layer declares labels, a `main` ruleset, Pages, and a repository knob;
# the repo layer edits the labels and ruleset and nulls both Pages and the knob.
# The merged file pins the contrast: `pages: null` is kept as the value with no
# notice (the only spelling of "Pages off"), while `repository: null` is removed
# with a notice.
name: merge-union-optout
inputs:
  mode: merge
settings_layers:
  - repository:
      has_wiki: false
    labels:
      - name: bug
        color: d73a4a
        description: Something isn't working
      - name: docs
        color: "0075ca"
    rulesets:
      - name: main
        target: branch
        enforcement: active
        conditions:
          ref_name:
            include: ["~DEFAULT_BRANCH"]
            exclude: []
        rules:
          - type: deletion
    pages:
      build_type: workflow
      source:
        branch: main
        path: /
settings:
  repository: null
  labels:
    - name: docs
      color: ffffff
    - name: infra
      color: "111111"
  rulesets:
    - name: main
      rules:
        - type: non_fast_forward
  pages: null
expect:
  exit_code: 0
  result: merged
  zero_requests: true
  stdout_contains:
    - "settings.yml: null removed repository declared by a lower layer"
  stdout_lacks:
    - "null removed pages"
  summary_contains:
    - "| 1 | "
    - "layer-0.yml |"
    - "| 2 | "
    - "settings.yml |"
    - "Merged document written to "
  merged:
    pages: null
    labels:
      _undeclared: delete
      entries:
        - name: bug
          color: d73a4a
          description: Something isn't working
        - name: docs
          color: ffffff
        - name: infra
          color: "111111"
    rulesets:
      _undeclared: keep
      entries:
        - name: main
          target: branch
          enforcement: active
          conditions:
            ref_name:
              include: ["~DEFAULT_BRANCH"]
              exclude: []
          rules:
            - type: deletion
            - type: non_fast_forward

name: webhooks-unset-secret-fails
description: >-
  An apply whose declared webhook secret references an UNSET environment
  variable fails the repository cleanly: references are resolved up front,
  after the read-only preflight and before the first mutation of any
  section, so the run exits 1 naming the variable and nothing is ever
  written.
settings:
  webhooks:
    - config:
        url: https://ci.example.com/hook
        content_type: json
        secret: $UNSET_HOOK_SECRET
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  outcomes:
    webhooks: failed
  stdout_contains:
    - secret reference $UNSET_HOOK_SECRET is unset
  never:
    - POST /repos/{repo}/hooks
    - PATCH /repos/{repo}/hooks
    - DELETE /repos/{repo}/hooks

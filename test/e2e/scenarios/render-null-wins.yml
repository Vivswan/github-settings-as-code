# mode: render folds a layer stack into one document with ZERO requests, and a
# higher layer's null WINS at every depth: it is the EMPTY or OFF value on
# GitHub, never a delete marker, so no notice is printed. `pages: null` turns
# Pages off over the fleet's site, `protection: null` strips the fleet's branch
# protection, `value: null` unsets the fleet's custom property, and
# `deployment_branch_policy: null` lifts the fleet's branch restriction. The
# labels and rulesets union as before.
name: render-null-wins
inputs:
  mode: render
settings_layers:
  - repository:
      has_wiki: false
    labels:
      - name: bug
        color: d73a4a
        description: Something isn't working
      - name: docs
        color: "0075ca"
    rulesets:
      - name: main
        target: branch
        enforcement: active
        conditions:
          ref_name:
            include: ["~DEFAULT_BRANCH"]
            exclude: []
        rules:
          - type: deletion
    branches:
      - name: main
        protection:
          enforce_admins: true
    environments:
      - name: prod
        deployment_branch_policy:
          protected_branches: true
          custom_branch_policies: false
    custom_properties:
      - property_name: team
        value: fleet
    pages:
      build_type: workflow
      source:
        branch: main
        path: /
settings:
  labels:
    - name: docs
      color: ffffff
    - name: infra
      color: "111111"
  rulesets:
    - name: main
      rules:
        - type: non_fast_forward
  branches:
    - name: main
      protection: null
  environments:
    - name: prod
      deployment_branch_policy: null
  custom_properties:
    - property_name: team
      value: null
  pages: null
expect:
  exit_code: 0
  result: rendered
  zero_requests: true
  stdout_lacks:
    - "_remove"
    - "null"
  summary_contains:
    - "| 1 | "
    - "layer-0.yml |"
    - "| 2 | "
    - "settings.yml |"
    - "Rendered document written to "
  rendered:
    repository:
      has_wiki: false
    labels:
      _undeclared: delete
      entries:
        - name: bug
          color: d73a4a
          description: Something isn't working
        - name: docs
          color: ffffff
        - name: infra
          color: "111111"
    rulesets:
      _undeclared: keep
      entries:
        - name: main
          target: branch
          enforcement: active
          conditions:
            ref_name:
              include: ["~DEFAULT_BRANCH"]
              exclude: []
          rules:
            - type: deletion
            - type: non_fast_forward
    environments:
      - name: prod
        deployment_branch_policy: null
    branches:
      - name: main
        protection: null
    pages: null
    custom_properties:
      _undeclared: keep
      entries:
        - property_name: team
          value: null

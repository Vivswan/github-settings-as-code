name: multi-secrets-provenance-conflation
description: >
  Secret provenance is structural, never string equality: a target naming the
  operator's own $FLEET_TOKEN reference inside its OWN webhooks section is
  refused for that webhook - a hard validation failure for the whole target,
  so nothing (the defaults' fan-out included) is written to it - while the
  SAME string surviving from the operator's defaults stays operator-sourced.
  The refusal names only the target's webhooks section, never actions_secrets,
  and the fan-out to every other target still resolves and writes. A second
  offender using a different reference name behaves identically.
settings: {}
defaults_file:
  actions_secrets:
    - name: FLEET_TOKEN
      value: $FLEET_TOKEN
env:
  FLEET_TOKEN: fleet-secret-plaintext-99xx
repos:
  e2e-owner/svc-clean:
    settings: {}
    expect:
      result: applied
  e2e-owner/svc-same-ref:
    settings:
      webhooks:
        - config:
            url: https://hooks.example/same
            secret: $FLEET_TOKEN
    expect:
      result: failed
  e2e-owner/svc-other-ref:
    settings:
      webhooks:
        - config:
            url: https://hooks.example/other
            secret: $TEAM_HOOK
    expect:
      result: failed
token_permissions:
  secrets: write
  webhooks: write
expect:
  exit_code: 1
  result: failed
  repos_result:
    e2e-owner/svc-clean: applied
    e2e-owner/svc-same-ref: failed
    e2e-owner/svc-other-ref: failed
  mutations:
    - "PUT /repos/e2e-owner/svc-clean/actions/secrets/FLEET_TOKEN"
  never:
    - "PUT /repos/e2e-owner/svc-same-ref/actions/secrets/FLEET_TOKEN"
    - "POST /repos/e2e-owner/svc-same-ref/hooks"
    - "PUT /repos/e2e-owner/svc-other-ref/actions/secrets/FLEET_TOKEN"
    - "POST /repos/e2e-owner/svc-other-ref/hooks"
  stdout_contains:
    - "svc-same-ref: webhooks: secret reference $FLEET_TOKEN appears in a target-fetched settings file"
    - "svc-other-ref: webhooks: secret reference $TEAM_HOOK appears in a target-fetched settings file"
  stdout_lacks:
    # The conflation regression pin: the operator's actions_secrets value is
    # the same string the offender declared, and it must never be refused.
    - "actions_secrets: secret reference"
  summary_lacks:
    - "actions_secrets: secret reference"
  leaks_nowhere:
    - fleet-secret-plaintext-99xx

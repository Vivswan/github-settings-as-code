# The bypass list holds at most 100 users, and the mock 422s any add that
# would overflow it. Seeding a FULL live list and declaring one fresh login
# makes the remove-before-add ordering load-bearing: an add-first regression
# would push the list to 101 and fail here with the mock 422, instead of
# surviving as an untested comment.
name: interaction-limits-bypass-full-list-swap
settings:
  interaction_limits:
    pull_request_creation_bypass:
      - fresh-user

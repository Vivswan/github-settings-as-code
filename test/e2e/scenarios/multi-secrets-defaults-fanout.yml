name: multi-secrets-defaults-fanout
description: >
  The documented multi-repo fan-out: a defaults file declaring actions_secrets
  writes that secret into EVERY target the run processes that has no settings
  file of its own (the operator-owned defaults file is legitimate provenance
  for $NAME references). svc-a and svc-b have no settings.yml, so the whole
  defaults document is applied to each and both get the sealed PUT. svc-webhook
  has its own settings file, which is applied as written: its webhook is
  created and the defaults' secret never reaches it. The plaintext leaks
  nowhere (auto-swept from env), and the run converges.
settings: {}
defaults_file:
  actions_secrets:
    - name: FLEET_TOKEN
      value: $FLEET_TOKEN
env:
  FLEET_TOKEN: fleet-secret-plaintext-77zz
repos:
  e2e-owner/svc-a:
    settings: null
    expect:
      result: applied
  e2e-owner/svc-b:
    settings: null
    expect:
      result: applied
  e2e-owner/svc-webhook:
    settings:
      webhooks:
        - config:
            url: https://ops.example/fleet-events
            content_type: json
    expect:
      result: applied
token_permissions:
  secrets: write
  webhooks: write
expect:
  exit_code: 0
  result: applied
  repos_result:
    e2e-owner/svc-a: applied
    e2e-owner/svc-b: applied
    e2e-owner/svc-webhook: applied
  mutations:
    - "PUT /repos/e2e-owner/svc-a/actions/secrets/FLEET_TOKEN"
    - "PUT /repos/e2e-owner/svc-b/actions/secrets/FLEET_TOKEN"
    - "POST /repos/e2e-owner/svc-webhook/hooks"
  never:
    # The target with its own file is applied as written; the defaults are
    # never merged into it.
    - "PUT /repos/e2e-owner/svc-webhook/actions/secrets/FLEET_TOKEN"
  requests_contain:
    # The sealing key is per REPOSITORY on real GitHub: each fileless target
    # must fetch its own (a shared-key regression would seal ciphertext no
    # target could decrypt, invisibly to the single-keypair mock).
    - "GET /repos/e2e-owner/svc-a/actions/secrets/public-key"
    - "GET /repos/e2e-owner/svc-b/actions/secrets/public-key"
  stdout_contains:
    - 'created secret "FLEET_TOKEN"'
    - "svc-a: applying the defaults file"
    - "svc-b: applying the defaults file"
  stdout_lacks:
    # No document in this run carries a target-sourced reference, so nothing
    # may be refused.
    - target-fetched settings file
    - "svc-webhook/actions/secrets/public-key"
  converges: true

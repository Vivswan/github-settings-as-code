name: multi-secrets-defaults-fanout
description: >
  The documented multi-repo fan-out: a defaults file declaring actions_secrets
  writes that secret into EVERY target the run processes (the operator-owned
  defaults file is legitimate provenance for $NAME references). A target
  declaring its own secret-free webhooks section changes nothing about that
  provenance - the merged actions_secrets section still comes from the
  defaults. All three targets get the sealed PUT, the plaintext leaks nowhere
  (auto-swept from env), and the run converges.
settings: {}
defaults_file:
  actions_secrets:
    - name: FLEET_TOKEN
      value: $FLEET_TOKEN
env:
  FLEET_TOKEN: fleet-secret-plaintext-77zz
repos:
  e2e-owner/svc-a:
    settings: {}
    expect:
      result: applied
  e2e-owner/svc-b:
    settings: {}
    expect:
      result: applied
  e2e-owner/svc-webhook:
    settings:
      webhooks:
        - config:
            url: https://ops.example/fleet-events
            content_type: json
    expect:
      result: applied
token_permissions:
  secrets: write
  webhooks: write
expect:
  exit_code: 0
  result: applied
  repos_result:
    e2e-owner/svc-a: applied
    e2e-owner/svc-b: applied
    e2e-owner/svc-webhook: applied
  mutations:
    - "PUT /repos/e2e-owner/svc-a/actions/secrets/FLEET_TOKEN"
    - "PUT /repos/e2e-owner/svc-b/actions/secrets/FLEET_TOKEN"
    - "PUT /repos/e2e-owner/svc-webhook/actions/secrets/FLEET_TOKEN"
    - "POST /repos/e2e-owner/svc-webhook/hooks"
  requests_contain:
    # The sealing key is per REPOSITORY on real GitHub: each target must fetch
    # its own (a shared-key regression would seal ciphertext no target could
    # decrypt, invisibly to the single-keypair mock).
    - "GET /repos/e2e-owner/svc-a/actions/secrets/public-key"
    - "GET /repos/e2e-owner/svc-b/actions/secrets/public-key"
    - "GET /repos/e2e-owner/svc-webhook/actions/secrets/public-key"
  stdout_contains:
    - 'created secret "FLEET_TOKEN"'
  stdout_lacks:
    # No document in this run carries a target-sourced reference, so nothing
    # may be refused.
    - target-fetched settings file
  converges: true

# A resolved secret plaintext reaches NO surface of a redacted target's run, the
# private report included. svc-hooks is private and has no settings file, so the
# operator-authored defaults file applies, and its webhook secret resolves from
# the step environment. The create POST carries that secret, and the mock rejects
# it with a 422 that quotes the whole request body back, the echo the client's
# withholding exists for. The section fails, so the run fails and the report
# issue opens on svc-hooks: its body names the real slug and the withheld cause
# (the transcript is captured unmasked so the slug stays legible), while the
# plaintext appears in neither the report nor any public surface. The runner's
# every-scenario sweep hunts every env value in every delivered report; the
# explicit body_lacks pins the same for the reader.
name: multi-report-secret-withheld
settings: {}
defaults_file:
  webhooks:
    - config:
        url: https://ci.example.com/hook
        content_type: json
        secret: $WEBHOOK_SECRET
env:
  WEBHOOK_SECRET: hook-secret-canary-7c1d
inputs:
  mode: apply
  private_report: issue
repos:
  e2e-owner/svc-hooks:
    settings: null
    live_state:
      repo:
        private: true
        visibility: private
    permissions:
      webhooks: write
      issues: write
      contents: read
      administration: read
faults:
  - endpoint: webhooks.create
    kind: echo_422
    times: always
expect:
  exit_code: 1
  result: failed
  repos_result:
    "private repository #1": failed
  mutations:
    - "POST /repos/e2e-owner/svc-hooks/hooks"
    - "POST /repos/e2e-owner/svc-hooks/labels"
    - "POST /repos/e2e-owner/svc-hooks/issues"
  summary_contains:
    - "private repository #1"
    - "hidden (private repository)"
  summary_lacks:
    - "svc-hooks"
  stdout_lacks:
    - "svc-hooks"
  issue_report:
    slug: e2e-owner/svc-hooks
    title: "[automated] settings-as-code: private settings report"
    created_count: 1
    state: open
    body_contains:
      - "e2e-owner/svc-hooks"
      - 'creating webhook "https://ci.example.com/hook" failed'
      - "response body withheld: the request carried a secret field"
    body_lacks:
      - hook-secret-canary-7c1d

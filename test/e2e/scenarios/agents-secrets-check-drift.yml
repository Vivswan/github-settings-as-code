name: agents-secrets-check-drift
description: >
  Check mode reconciles Copilot agents secrets by existence alone: a
  declared-but-missing secret is drift, the declared values earn one
  cannot-verify note, an undeclared live secret stays a keep-note under the
  default policy, and no reference is resolved (this scenario deliberately
  defines no env), so nothing but the list endpoint is touched.
settings:
  agents_secrets:
    - name: AGENT_TOKEN
      value: $AGENT_TOKEN
inputs:
  mode: check
live_state:
  agents_secrets:
    - name: LEGACY_AGENT_KEY
      created_at: "2019-08-10T14:59:22Z"
      updated_at: "2019-08-10T14:59:22Z"
expect:
  exit_code: 1
  result: drift
  outcomes:
    agents_secrets: drift
  never:
    - "PUT /repos/{repo}/agents/secrets"
    - "DELETE /repos/{repo}/agents/secrets"
    - "GET /repos/{repo}/agents/secrets/public-key"
  stdout_contains:
    - "drift: agents_secrets[AGENT_TOKEN]: missing"
    - values cannot be read back from GitHub
    - Copilot agents secret "LEGACY_AGENT_KEY" exists on the repo but is not declared

name: multi-secrets-target-ref-rejected
description: >
  The authorization boundary behind $NAME references: a TARGET-fetched
  settings.yml declaring actions_secrets is refused even when the referenced
  variable exists in the operator's environment - otherwise a target could
  route any operator secret into a repo secret it can read. The offending
  target fails in isolation with zero writes; the clean sibling still applies.
settings: {}
env:
  FLEET_TOKEN: fleet-secret-plaintext-88yy
repos:
  e2e-owner/svc-sneaky:
    settings:
      actions_secrets:
        - name: EXFIL
          value: $FLEET_TOKEN
    expect:
      result: failed
  e2e-owner/svc-clean:
    settings:
      labels:
        - name: healthy
          color: "00ff00"
    expect:
      result: applied
token_permissions:
  secrets: write
  issues: write
expect:
  exit_code: 1
  result: failed
  repos_result:
    e2e-owner/svc-sneaky: failed
    e2e-owner/svc-clean: applied
  mutations:
    - "POST /repos/e2e-owner/svc-clean/labels"
  never:
    - "PUT /repos/e2e-owner/svc-sneaky/actions/secrets/EXFIL"
  stdout_contains:
    - the secret reference $FLEET_TOKEN in a target-fetched settings file
    - honored only in operator-owned settings sources

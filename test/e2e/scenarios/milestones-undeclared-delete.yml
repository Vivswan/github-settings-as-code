name: milestones-undeclared-delete
description: >-
  The wrapped milestones form with "undeclared: delete" removes a live
  milestone the settings file does not declare - and says out loud that the
  deletion DETACHES the milestone from every issue that carried it, the
  reason keep is the default. The declared milestone is created, apply stays
  green, and a check rerun converges.
settings:
  milestones:
    undeclared: delete
    entries:
      - title: v1.0
        description: First stable release.
live_state:
  milestones:
    - id: 900001
      number: 1
      state: open
      title: v0.9
      description: Old preview.
expect:
  exit_code: 0
  result: applied
  outcomes:
    milestones: applied
  mutations:
    - "POST /repos/{repo}/milestones"
    - "DELETE /repos/{repo}/milestones/1"
  stdout_contains:
    - "DELETED undeclared milestone \"v0.9\" (detached from every issue that carried it)"
  summary_contains:
    - "detached from every issue"
  converges: true

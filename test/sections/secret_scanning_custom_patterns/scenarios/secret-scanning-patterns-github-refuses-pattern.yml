name: secret-scanning-patterns-github-refuses-pattern
description: >-
  A pattern's regular expressions are GitHub's to judge, so the file parses and apply sends the
  bulk create. GitHub refuses the second pattern (a look-behind, which its engine has none of) with
  a 422 whose validation_errors map is keyed by the pattern's index in the request. The run fails
  naming that pattern by its settings-file label with GitHub's own message; the first pattern is not
  blamed. Without this the line says only that validation failed, for a batch of two. GitHub
  publishes no example body: the status and the shape are the API description's, the message text
  is the mock's.
settings:
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "int_[a-z0-9]{32}"
    - name: vendor-license-key
      pattern: "(?<=lic-)[0-9]{6}"
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  outcomes:
    secret_scanning_custom_patterns: failed
  mutations:
    - POST /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - 'creating secret scanning patterns "internal-api-token", "vendor-license-key" failed - POST /repos/e2e-owner/e2e-repo/secret-scanning/custom-patterns: 422 Validation failed for one or more patterns.'
    - "GitHub refused secret_scanning_custom_patterns[vendor-license-key] (invalid): Lookbehind assertions are not supported. Fix each named pattern in the settings file to satisfy GitHub's message"

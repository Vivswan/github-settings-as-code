name: secret-scanning-patterns-snapshot-verbatim
description: >-
  mode: snapshot writes each live pattern as GitHub holds it: the PCRE-only forms GitHub accepts (a
  Python-style named group, an inline comment, a braced hex escape) and an expression no JavaScript
  RegExp compiles alike. A pattern's dialect is GitHub's to judge, so no live value is left out or
  fails the snapshot.
settings: {}
live_state:
  secret_scanning_patterns:
    - id: 1
      name: vendor-key
      slug: vendor-key
      pattern: (?P<token>key_[A-Z0-9]{32})
      start_delimiter: (?#word edge)\A|[^0-9A-Za-z]
      must_match:
        - "[\\x{41}-\\x{5A}]"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 2
      name: odd-one
      slug: odd-one
      pattern: (key_[A-Z0-9]{32}
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: secret_scanning_custom_patterns
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    secret_scanning_custom_patterns: snapshot
  snapshot:
    secret_scanning_custom_patterns:
      _undeclared: keep
      entries:
        - name: odd-one
          pattern: (key_[A-Z0-9]{32}
        - name: vendor-key
          pattern: (?P<token>key_[A-Z0-9]{32})
          start_delimiter: (?#word edge)\A|[^0-9A-Za-z]
          must_match:
            - "[\\x{41}-\\x{5A}]"
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
  snapshot_converges: true

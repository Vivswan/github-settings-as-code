# A misspelled key on a pattern entry (typ for type) passes through: the create
# call carried it, GitHub ignored it, and the pattern lives as a branch pattern.
# No run compares a pattern's extra key, so the check stays clean and the note
# is the one line that names the key. Nothing is written.
name: environment-branch-policies-unknown-key-noted
settings:
  environments:
    - name: production
      deployment_branch_policy:
        protected_branches: false
        custom_branch_policies: true
      deployment_branch_policies:
        - name: v*
          typ: tag
inputs:
  mode: check
live_state:
  environments:
    production:
      name: production
      protection_rules: []
      deployment_branch_policy:
        protected_branches: false
        custom_branch_policies: true
  environment_branch_policies:
    production:
      - id: 4001
        name: v*
        type: branch
token_permissions:
  environments: read
  actions: read
expect:
  exit_code: 0
  result: clean
  outcomes:
    environments: clean
  stdout_contains:
    - 'environments[production].deployment_branch_policies[v*]: declared key "typ" does not exist on the live deployment branch policy'
    - "so if GitHub ignores it the pattern is unaffected and no check reports that as drift. Fix the key name, or remove it from the settings file"
  never:
    - "PUT /repos/{repo}/environments"
    - "POST /repos/{repo}/environments/production/deployment-branch-policies"
    - "DELETE /repos/{repo}/environments"
  requests_contain:
    - "GET /repos/e2e-owner/e2e-repo/environments/production/deployment-branch-policies"

name: environments-snapshot-roundtrip
description: >-
  mode: snapshot reads production and staging back into snapshot.yml and writes nothing: PUT-shape
  settings off each GET body (protection_rules un-nested, an unprotected environment as the three
  disabled values), plus every nested list with live items in its wrapped form. staging is pinned,
  so it LEADS the file with pinned: true; declaration order is pin order. The written file reads
  clean against the same state.
settings: {}
live_state:
  environments:
    production:
      id: 161088068
      name: production
      url: https://api.github.com/repos/e2e-owner/e2e-repo/environments/production
      html_url: https://github.com/e2e-owner/e2e-repo/deployments/activity_log?environments_filter=production
      created_at: 2026-01-01T00:00:00Z
      updated_at: 2026-01-01T00:00:00Z
      can_admins_bypass: true
      protection_rules:
        - id: 3736
          node_id: MDQ6R2F0ZTM3MzY=
          type: wait_timer
          wait_timer: 30
        - id: 3755
          node_id: MDQ6R2F0ZTM3NTU=
          type: required_reviewers
          prevent_self_review: true
          reviewers:
            - type: User
              reviewer:
                login: octocat
                id: 583231
            - type: Team
              reviewer:
                slug: platform
                id: 42
      deployment_branch_policy:
        protected_branches: false
        custom_branch_policies: true
    staging:
      name: staging
      protection_rules: []
      deployment_branch_policy: null
  pinned_environments: [staging]
  environment_variables:
    production:
      - name: REGION
        value: eu-west-1
        created_at: 2026-01-01T00:00:00Z
        updated_at: 2026-01-01T00:00:00Z
  environment_secrets:
    production:
      - name: DEPLOY_TOKEN
        created_at: 2026-01-01T00:00:00Z
        updated_at: 2026-01-01T00:00:00Z
      - name: RELEASE_PAT
        created_at: 2026-01-01T00:00:00Z
        updated_at: 2026-01-01T00:00:00Z
    staging:
      - name: DEPLOY_TOKEN
        created_at: 2026-01-01T00:00:00Z
        updated_at: 2026-01-01T00:00:00Z
  environment_branch_policies:
    production:
      - id: 4001
        name: release/*
        type: branch
      - id: 4002
        name: v*
        type: tag
  environment_protection_rules:
    production:
      - id: 7100
        node_id: DPR_7100
        enabled: true
        app:
          id: 3516
          slug: region-guard
          integration_url: https://api.github.com/apps/region-guard
          node_id: MDQ6R2F0ZTM1MTY=
env:
  SECRET_ENVIRONMENT_PRODUCTION_DEPLOY_TOKEN: deploy-token-plaintext-7f3a
  SECRET_ENVIRONMENT_PRODUCTION_RELEASE_PAT: pat-plaintext-91c2
  SECRET_ENVIRONMENT_STAGING_DEPLOY_TOKEN: staging-deploy-token-plaintext-0b5d
inputs:
  mode: snapshot
  snapshot_file: snapshot.yml
  sections: environments
expect:
  exit_code: 0
  result: snapshot
  outcomes:
    environments: snapshot
  snapshot:
    environments:
      - name: staging
        pinned: true
        wait_timer: 0
        prevent_self_review: false
        reviewers: []
        deployment_branch_policy: null
        secrets:
          _undeclared: keep
          entries:
            - name: DEPLOY_TOKEN
              value: $SECRET_ENVIRONMENT_STAGING_DEPLOY_TOKEN
      - name: production
        wait_timer: 30
        prevent_self_review: true
        reviewers:
          - type: User
            id: 583231
          - type: Team
            id: 42
        deployment_branch_policy:
          protected_branches: false
          custom_branch_policies: true
        variables:
          _undeclared: delete
          entries:
            - name: REGION
              value: eu-west-1
        secrets:
          _undeclared: keep
          entries:
            - name: DEPLOY_TOKEN
              value: $SECRET_ENVIRONMENT_PRODUCTION_DEPLOY_TOKEN
            - name: RELEASE_PAT
              value: $SECRET_ENVIRONMENT_PRODUCTION_RELEASE_PAT
        deployment_branch_policies:
          _undeclared: delete
          entries:
            - name: release/*
              type: branch
            - name: v*
              type: tag
        deployment_protection_rules:
          _undeclared: keep
          entries:
            - app: region-guard
  requests_contain:
    - "GET /repos/e2e-owner/e2e-repo/environments"
    - "GET /repos/e2e-owner/e2e-repo/environments/production/variables"
    - "GET /repos/e2e-owner/e2e-repo/environments/production/secrets"
    - "GET /repos/e2e-owner/e2e-repo/environments/production/deployment-branch-policies"
    - "GET /repos/e2e-owner/e2e-repo/environments/production/deployment_protection_rules"
    - "GRAPHQL EnvironmentPinsSnapshot"
  never:
    - POST /
    - PATCH /
    - PUT /
    - DELETE /
    - "GET /repos/{repo}/environments/staging/deployment-branch-policies"
  stdout_contains:
    - "environments[production].secrets[DEPLOY_TOKEN]: value of DEPLOY_TOKEN is not readable; export it into the environment as SECRET_ENVIRONMENT_PRODUCTION_DEPLOY_TOKEN before apply"
    - "environments[staging].secrets[DEPLOY_TOKEN]: value of DEPLOY_TOKEN is not readable; export it into the environment as SECRET_ENVIRONMENT_STAGING_DEPLOY_TOKEN before apply"
  snapshot_converges: true

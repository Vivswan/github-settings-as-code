# A deploy key entry declares `id`, a value GitHub reports and the create does
# not take. GitHub cannot edit a deploy key, so the differing id is applied as a
# delete and a recreate, and the new key gets an id of GitHub's choosing: the
# next apply deletes and recreates it again. The note is the one line that says
# so; this apply completes.
name: deploy-keys-reported-key-noted
settings:
  deploy_keys:
    - title: deploy-bot
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDeployBotDeployBotDeployBot
      read_only: true
      id: 5
live_state:
  deploy_keys:
    - id: 10
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDeployBotDeployBotDeployBot
      url: https://api.github.com/repos/e2e-owner/e2e-repo/keys/10
      title: deploy-bot
      verified: true
      created_at: "2026-01-01T00:00:00Z"
      read_only: true
inputs:
  mode: apply
token_permissions:
  administration: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    deploy_keys: applied
  mutations:
    - "DELETE /repos/{repo}/keys/10"
    - "POST /repos/{repo}/keys"
  stdout_contains:
    - '::notice::deploy_keys[deploy-bot]: "id" is a value GitHub reports, not a setting it accepts (the GET returns it, the POST does not take it), so every apply deletes and recreates the deploy key while a declared value differs from the live one; remove it from the settings file'
    - 'deploy_keys: deleted deploy key "deploy-bot" to recreate it with the declared settings'
    - 'deploy_keys: recreated deploy key "deploy-bot"'

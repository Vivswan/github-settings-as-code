# The branch does NOT exist live; the token has Administration but not Contents.
# The advisory probe is denied (a concealed 404), so the section cannot tell the branch is missing.
# It plans the protection PUT, which GitHub answers 404 "Branch not found": the endpoint declares
# that body definitive, so the failure names the missing branch and carries no grant advice.
name: branches-missing-branch-no-contents-apply-fails
settings:
  branches:
    - name: release
      protection:
        enforce_admins: true
inputs:
  mode: apply
denial_style: fine_grained
live_state:
  branches: ["main"]
  branch_protection: {}
token_permissions:
  administration: write
  contents: none
expect:
  exit_code: 1
  result: failed
  outcomes:
    branches: failed
  skipped_sections: []
  requests_contain:
    - "PUT /repos/e2e-owner/e2e-repo/branches/release/protection"
  stdout_contains:
    - >-
      ::error::branches: replacing protection for branch "release" failed - PUT
      /repos/e2e-owner/e2e-repo/branches/release/protection: 404 Branch not found. The declared branch
      does not exist on the repo, so its protection cannot be applied; create the branch, or remove it
      from the settings file
  summary_contains:
    - "404 Branch not found"
  summary_lacks:
    - "the token was denied"

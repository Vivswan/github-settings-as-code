# Check mode, a declared branch that does not exist live: protection probes 404
# (unprotected), then the advisory branch-existence probe (Contents-gated)
# answers GitHub's definitive "Branch not found", so the section fails with the
# one missing-branch advice, the same failure apply meets at the PUT without the
# Contents grant. No write is attempted.
name: branches-missing-branch-advisory
settings:
  branches:
    - name: release
      protection:
        enforce_admins: true
inputs:
  mode: check
live_state:
  branches: ["main"]
  branch_protection: {}
token_permissions:
  administration: read
  contents: read
expect:
  exit_code: 1
  result: failed
  outcomes:
    branches: failed
  summary_contains:
    - "branches[release]: the declared branch does not exist on the repo, so its protection cannot be applied; create the branch, or remove it from the settings file"
  never:
    - "PUT /repos/{repo}/branches/release/protection"

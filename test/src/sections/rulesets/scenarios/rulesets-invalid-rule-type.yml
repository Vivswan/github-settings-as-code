# A rule type GitHub does not recognize, which motivated the enriched rejection
# messages. A type the vendored spec does not know passes through verbatim by
# design, so a type GitHub ships tomorrow works today and this typo reaches
# GitHub and comes back as a 422 that must name the operation and the failure
# class and carry the documentation link. Wrongly cased parameters of a known
# type never get this far: rulesets-known-rule-parameters-rejected.
name: rulesets-invalid-rule-type
settings:
  rulesets:
    - name: quality
      rules:
        - type: code_quality
          parameters:
            severity: warning
token_permissions:
  administration: write
expect:
  exit_code: 1
  result: failed
  outcomes:
    rulesets: failed
  stdout_contains:
    - 'creating ruleset "quality" failed'
    - "Invalid rule"
    - "rules[].type GitHub does not recognize"
    - "documented at https://docs.github.com/rest/repos/rules#create-a-repository-ruleset"

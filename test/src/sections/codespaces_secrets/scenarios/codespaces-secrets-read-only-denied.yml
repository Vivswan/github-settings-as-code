# The permission-model proof for the accessGrade override: GitHub's
# fine-grained "Codespaces secrets" permission gates even the READS at write,
# so a read-only grant fails the section's list exactly like a missing grant -
# in check mode, before anything else. The mock's gate and the fuzz oracle
# derive this from the same endpoint declaration (accessGrade: write), and
# this scenario pins the modeled behavior end to end.
name: codespaces-secrets-read-only-denied
settings:
  codespaces_secrets:
    - name: DEV_TOKEN
      value: $DEV_TOKEN
env:
  DEV_TOKEN: codespaces-read-denied-plaintext-33cc
inputs:
  mode: check
denial_style: fine_grained
token_permissions:
  codespaces_secrets: read
expect:
  exit_code: 1
  result: failed
  outcomes:
    codespaces_secrets: failed

name: deploy-keys-undeclared-delete
description: >-
  Under the wrapped "_undeclared: delete" form a live deploy key the settings
  file does not declare is DELETED; the declared key is already converged and
  untouched. Apply stays green, and a check rerun over the mutated state
  converges.
settings:
  deploy_keys:
    _undeclared: delete
    entries:
      - title: mirror-pull
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIRotatedRotatedRotatedRotatedRotated mirror@new
        read_only: true
live_state:
  deploy_keys:
    - id: 10
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIRotatedRotatedRotatedRotatedRotated
      url: https://api.github.com/repos/e2e-owner/e2e-repo/keys/10
      title: mirror-pull
      verified: true
      created_at: "2026-01-01T00:00:00Z"
      read_only: true
    - id: 20
      key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCRetiredRetiredRetired
      url: https://api.github.com/repos/e2e-owner/e2e-repo/keys/20
      title: retired-service
      verified: true
      created_at: "2026-01-01T00:00:00Z"
      read_only: true
token_permissions:
  administration: write
expect:
  exit_code: 0
  result: applied
  outcomes:
    deploy_keys: applied
  mutations:
    - "DELETE /repos/{repo}/keys/20"
  never:
    - "POST /repos/{repo}/keys"
    - "DELETE /repos/{repo}/keys/10"
  stdout_contains:
    - 'DELETED undeclared deploy key "retired-service"'
  fixpoint: converges

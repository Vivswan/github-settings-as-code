name: actions-secrets-name-rejected
description: >
  A secret name GitHub refuses (a hyphen here; the same rule covers a leading
  digit and the reserved GITHUB_ prefix) fails when the settings file is
  parsed, before any API contact, with the entry's path and the rule - not as
  a 422 from the sealed PUT after earlier sections have already written.
settings:
  actions_secrets:
    - name: deploy-token
      value: $DEPLOY_TOKEN
env:
  DEPLOY_TOKEN: sealed-deploy-plaintext-7f3a
inputs:
  mode: apply
expect:
  exit_code: 1
  result: failed
  zero_requests: true
  stdout_contains:
    - 'actions_secrets[0].name: the secret name "deploy-token" has characters outside ASCII letters, digits, and underscore'
    - reserved GITHUB_ prefix
  leaks_nowhere:
    - sealed-deploy-plaintext-7f3a

name: secret-scanning-custom-patterns-undeclared-keep-note
description: >
  The section's keep default: a live custom pattern the plain-array form does
  not declare is KEPT and surfaced as a note naming the "_undeclared: delete"
  knob that would remove it. The declared pattern is already converged, so
  apply writes nothing, stays green, and a check rerun converges (the kept
  pattern is a note, not drift).
settings:
  secret_scanning_custom_patterns:
    - name: internal-api-token
      pattern: "int_[a-z0-9]{16}"
live_state:
  secret_scanning_patterns:
    - id: 501
      name: internal-api-token
      slug: internal-api-token
      pattern: "int_[a-z0-9]{16}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v1
    - id: 502
      name: retired-pattern
      slug: retired-pattern
      pattern: "old_[0-9]{4}"
      state: published
      push_protection_enabled: false
      custom_pattern_version: v2
inputs:
  mode: apply
expect:
  exit_code: 0
  result: applied
  outcomes:
    secret_scanning_custom_patterns: applied
  never:
    - POST /repos/{repo}/secret-scanning/custom-patterns
    - PATCH /repos/{repo}/secret-scanning/custom-patterns
    - DELETE /repos/{repo}/secret-scanning/custom-patterns
  stdout_contains:
    - 'secret scanning custom pattern "retired-pattern" exists on the repo but is not declared in the settings file; kept under "_undeclared: keep"'
    - 'or set "_undeclared: delete" to have apply'
  fixpoint: converges

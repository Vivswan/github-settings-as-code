sections_table:
  endpoints: labels CRUD
  notes: upsert by name (rename via `new_name`); the delete-by-default is Probot parity
coverage:
  - area: "[Labels](https://docs.github.com/en/rest/issues/labels)"
    endpoints: [list, create, update, remove]
    notes:
      - >-
        Full CRUD on /repos/{owner}/{repo}/labels: upsert by name, rename via new_name (Probot
        parity).
      - >-
        Undeclared labels are DELETED loudly by default; the wrapped `_undeclared: keep` form keeps
        them, each surfaced as a note.
      - >-
        A declared key the GET reports and neither the POST nor the PATCH takes (id, node_id, url,
        default) draws a note in check and in apply, whatever its value and with or without a live
        label: a value that differs from the live one drifts on every check, and its update re-runs on
        every apply.
      - Snapshot reads the live labels back as entries under the delete default.
schema:
  SettingsFile.labels: >-
    Issue/PR labels; undeclared labels are DELETED by default (Probot parity; the wrapped form can
    set `_undeclared: keep`).
  LabelConfig: One label, matched to the live repo by name.
  LabelConfig.name: The label name, the natural key.
  LabelConfig.color: >-
    Six hex digits, the leading "#" optional ("#d73a4a" or "d73a4a"). Color names and three-digit
    shorthand fail at parse time; GitHub rejects them.
  LabelConfig.description: >-
    Short explanation shown in the label picker, at most 100 characters (GitHub's cap); longer ones
    fail at parse time.
  LabelConfig.new_name: "Probot compat: rename an existing label."

sections_table:
  endpoints: autolinks CRUD
  notes: immutable upstream, so changed entries are replaced
coverage:
  - area: "[Autolinks](https://docs.github.com/en/rest/repos/autolinks)"
    endpoints: [list, create, remove]
    notes:
      - >-
        GET/POST/DELETE /repos/{owner}/{repo}/autolinks; immutable upstream so changed entries are
        delete+recreate.
      - >-
        Undeclared autolinks are DELETED by default, kept as notes under the wrapped `_undeclared:
        keep` form.
      - >-
        A declared key the GET reports and the POST does not take (id, updated_at) draws a note in
        check and in apply, whatever its value and with or without a live autolink: a value that
        differs from the live one makes every apply delete and recreate the autolink.
      - Snapshot reads the live autolinks back as entries under the delete default.
schema:
  SettingsFile.autolinks: >-
    Autolink references; undeclared ones are DELETED by default (the wrapped form can set
    `_undeclared: keep`).
  AutolinkConfig: One autolink reference, matched by key prefix.
  AutolinkConfig.key_prefix: >-
    Text prefix that triggers the link (e.g. "TICKET-"), the natural key; letters, digits, and
    ". - _ + = : / #" only, and no declared prefix may begin another.
  AutolinkConfig.url_template: Target URL template containing "<num>".
  AutolinkConfig.is_alphanumeric: >-
    Whether <num> also matches letters; upstream default is true on a create, and a recreate
    re-sends the live value when undeclared.

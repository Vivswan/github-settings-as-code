sections_table:
  endpoints: milestones
  notes: >-
    upsert by title; deleting a milestone detaches it from every issue carrying it, which is why
    keep is the default
coverage:
  - area: "[Milestones](https://docs.github.com/en/rest/issues/milestones)"
    endpoints: [list, create, update, remove]
    notes:
      - >-
        POST/PATCH/DELETE /repos/{owner}/{repo}/milestones, matched by title, declared-keys-only
        (description/state/due_on untouched unless declared; a due_on is a calendar day, compared and
        converged as the day GitHub keeps).
      - >-
        Undeclared milestones are kept by default and surfaced as notes, because deleting a milestone
        DETACHES it from every issue carrying it - the wrapped `_undeclared: delete` form opts into
        exactly that.
      - >-
        A declared key the GET reports and neither the POST nor the PATCH takes (url, html_url,
        labels_url, id, node_id, number, creator, open_issues, closed_issues, created_at, updated_at,
        closed_at) draws a note in check and in apply, whatever its value and with or without a live
        milestone: a value that differs from the live one drifts on every check, and its update
        re-runs on every apply.
      - Snapshot reads every milestone, open and closed, back as entries under the keep default.
schema:
  SettingsFile.milestones: >-
    Milestones, upserted by title; undeclared ones are kept by default (the wrapped form can set
    `_undeclared: delete`, which detaches deleted milestones from their issues).
  MilestoneConfig: One milestone, matched by title.
  MilestoneConfig.title: The milestone title, the natural key.
  MilestoneConfig.description: Longer explanation of the milestone.
  MilestoneConfig.state: Open or closed; untouched unless declared.
  MilestoneConfig.due_on: >-
    The due day as `YYYY-MM-DD`; GitHub keeps only the day, so only the day is compared, and a
    snapshot reads it back as the day. The day is sent as noon UTC, `YYYY-MM-DDT12:00:00Z`, which
    GitHub stores on the same calendar day in PST and PDT. A UTC timestamp `YYYY-MM-DDTHH:MM:SSZ` is
    accepted for its date part.
